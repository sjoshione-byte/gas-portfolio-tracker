function spawnHazard(){
  const lv=level();
  let avail=HAZDEFS.filter(h=>h.lvl<=lv);
  if(!avail.length)avail=HAZDEFS.slice();     /* never leave the sky empty-handed */
  const def=avail[Math.floor(Math.random()*avail.length)];
  if(!def)return;
  /* hazards speed up steadily with the level (and with the flow system).
     LV1 ×1.00 · LV5 ×1.60 · LV10 ×2.35 · capped so it stays flyable. */
  const spdMul=Math.min(CFG.hazardSpeedCap||2.6, 1+(lv-1)*(CFG.hazardSpeedPerLevel||0.15))*flowAdj;
  const hz={def,t:0,frozen:false,struck:false};
  /* a hazard is persistent: it makes 2–3 attack runs before it finally
     gives up and flies away — one lazy pass is never the whole story */
  hz.passes=0; hz.maxPasses=2+(Math.random()<0.55?1:0);
  const py=planeScreenY();
  if(def.kind==='homing'||def.kind==='straight'){
    const fromRight=Math.random()<0.7;
    hz.sx=fromRight?W+50:-50;
    hz.sy=def.kind==='straight'?py+(Math.random()*60-30):60+Math.random()*(H*0.5);
    hz.vx=(fromRight?-1:1)*def.spd*spdMul;
    hz.vy=0;
    if(def.id==='missile'){alarmSound();banner('⚠️ ROCKET! Go up or go down! 🚀',2200,true);}
  }else if(def.kind==='fall'){
    hz.sx=W*0.25+Math.random()*W*0.5;
    hz.sy=-50;hz.vx=(Math.random()*30-15);hz.vy=def.spd*spdMul;
  }else if(def.kind==='storm'){
    hz.sx=W*0.3+Math.random()*W*0.4;hz.sy=54;hz.vx=(Math.random()<0.5?-1:1)*def.spd;hz.vy=0;
    hz.strikeT=2.2;hz.bolt=0;
  }else if(def.kind==='push'){
    hz.sx=Math.random()<0.5?-60:W+60;hz.sy=100+Math.random()*(H*0.35);
    hz.vx=(hz.sx<0?1:-1)*def.spd*spdMul;hz.vy=0;
  }else if(def.kind==='flare'){
    hz.timer=Math.max(1.6, 3.4 - lv*0.16);
    banner('🌞 HOT SUN! GO DOWN ⬇️',2400,true);
    alarmSound();
  }
  hazards.push(hz);
  /* the special hazards speak the INSTRUCTION, not just their name */
  const warnLine = def.id==='missile' ? 'A rocket is coming! Go up high, or dive down low!'
                 : def.kind==='flare' ? 'Hot sun! Dive down low, quickly!'
                 : null;
  hazardWarn(def,warnLine);
  if(def.kind!=='flare'&&def.id!=='missile') banner(`${def.em} ${def.nm.split(' ')[0]} is coming!`,2400,true);
  updateCalmBtn();
}

/* ═══════════════════════════════════════════════════════════════════════
   ONE THING AT A TIME
   Nothing may interrupt anything else, and nothing may follow straight on
   the heels of the last thing. Every interruption (a rescue, a gift, a
   fork, a level-up, a share request) asks canInterrupt() first, and calls
   markInterrupt() when it fires.
   ═══════════════════════════════════════════════════════════════════════ */
function canInterrupt(){
  if(paused)return false;              /* a modal is already open */
  if(overlay.classList.contains('show'))return false;
  if(breath.active)return false;
  if(flightClock-lastInterruptAt < quietGap())return false;
  return true;
}
function markInterrupt(){ lastInterruptAt=flightClock; }

/* ═══════════ GAME LOOP ═══════════ */
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  if(!paused)update(dt);
  draw(t/1000);
  engineUpdate();
  updatePanel();
}
requestAnimationFrame(loop);
/* the journey is remembered — quietly, every 20 seconds, and on the way out */
setInterval(()=>{ if(started&&!missionDone)saveProgress(); },20000);
window.addEventListener('visibilitychange',()=>{ if(document.hidden)saveProgress(); });
window.addEventListener('pagehide',saveProgress);
window.addEventListener('beforeunload',saveProgress);

function update(dt){
  prevPlaneX=plane.x;
  /* steering TURNS the plane. There is no limit — he can circle right round. */
  if(input.left){
    plane.heading-=turnRate()*dt;
    plane.x=lerp(plane.x,-1.0,dt*3.5);
    plane.bank=lerp(plane.bank,-1,dt*6);
  }else if(input.right){
    plane.heading+=turnRate()*dt;
    plane.x=lerp(plane.x,1.0,dt*3.5);
    plane.bank=lerp(plane.bank,1,dt*6);
  }else{
    plane.x=lerp(plane.x,0,dt*2.2);      /* drifts back to the middle to dodge */
    plane.bank=lerp(plane.bank,0,dt*5);
  }
  plane.heading=normAng(plane.heading);

  if(input.up)plane.alt+=48*dt;
  if(input.down)plane.alt-=52*dt;
  plane.alt=Math.max(6,Math.min(100,plane.alt));

  let target=CFG.cruiseSpeed;
  if(input.up)target=cfgNum('climbSpeed',1.05,0.1);
  if(input.boost)target=CFG.boostSpeed;
  if(input.down)target*=0.9;
  if(plane.wheels)target*=0.62;
  target*=(0.5+0.5*engines/engineSlots);        /* fewer engines = slower plane */
  if(!preflightOK)target*=CFG.sluggishFactor;   /* skipped the plane check */
  else target*=(1+cfgNum('cleanBoost',0.10,0));/* a clean plane is a light plane */
  /* HIGHER IS FASTER: the air is thin up high, so the plane goes faster the
     higher he flies, and noticeably slower down near the ground. Smooth, so
     the joystick teaches it by feel rather than by a rule. */
  target*=1+cfgNum('altSpeedBonus',0.25,0)*(altFrac()-0.5)*2;
  plane.speed=lerp(plane.speed,target,dt*2.5);
  highFlyHint();
  /* ── HONEST MOTION ────────────────────────────────────────────────────────
     The scenery is driven by the heading, not by a stopwatch. Fly forward and
     it streams towards you; turn side-on and it slides across; turn right
     around and it streams AWAY, back towards the horizon. One mile is the
     same distance whichever way the nose points, so zPerMile() is shared by
     the forward scroll and the sideways slide. */
  const fwd=Math.cos(plane.heading);            /* +1 ahead … −1 turned around */
  const lat=Math.sin(plane.heading);            /* +1 right   … −1 left        */
  const zspeed=0.20*plane.speed*fwd;            /* SIGNED: negative = reversing */

  /* ── the miles tick by ──────────────────────────────────────────────── */
  /* pointing the wrong way? the radar says so, gently */
  /* Badly off course? The radar pulses red and that is all. Being told
     "turn left" over and over while exploring was nagging, and the child
     can already read the radar — so the picture warns, the voice does not. */

  if(!missionDone){
    /* fly towards the village and the miles fall away. Turn away, and they
       climb again — the world is honest about which way he is pointing.  */
    const mps=(CFG.milesPerMinute/60)*plane.speed*dt;
    /* BUGFIX: miles used to be clamped at 0, so flying back past the start
       line quietly froze the journey — the plane kept moving but the world
       and the radar did not. He may now fly as far behind the start as he
       likes, and everything follows honestly. */
    miles   +=mps*fwd;                              /* along the route         */
    dLatStep =mps*lat;                              /* this frame's sideways step */
    latMiles+=dLatStep;                             /* left (−) / right (+)    */
    playMinutes+=dt/60;
    if(playMinutes-lastInterestMin>=cfgNum('interestEveryMinutes',10,0.2))payInterest();
    if(distToDest()<=0.5){missionDone=true;arriveAtVillage();return;}
    updateGps();
  }

  /* how far the world swung this frame — from turning AND from travelling.
     Computed once, here, so every moving thing agrees on it. */
  const swingPx=worldSwingPx();
  const swing=swingPx/(W*0.55);         /* the same swing, in prop x units */

  flightClock+=dt;
  decayCalm(dt);

  /* weather wheel — every phase passes */
  wxClock+=dt;
  if(wxClock>cfgNum('weatherSeconds',50,3)){
    wxClock=0;wxIdx=(wxIdx+1)%WEATHER.length;
    banner(`${WEATHER[wxIdx][0]} ${WEATHER[wxIdx][1]}`,2000);
    updateHUD();
  }
  if(WEATHER[wxIdx][1]==='Windy'){plane.x+=Math.sin(zoneClock*1.7)*0.06*dt;}

  /* karma: shared kindness returns as surprise help when you need it */
  if(karma>0&&(engines<engineSlots||hazards.length)&&Math.random()<dt*0.035){
    karma--;
    if(engines<engineSlots){
      engines++;
      banner('💛 A repair crew came! Engine fixed.',2600,true);
      if(autoRead)speakPlain('The animals you shared with sent a crew to fix your engine!');
    }else{
      shield=Math.max(shield,12);
      shieldKind='kind';
      banner('💛 A gift shield!',2400,true);
      if(autoRead)speakPlain('The animals you shared with sent a shield to keep you safe!');
    }
    fanfare();updateHUD();
  }

  /* "you are this far away" — see distanceCall() */
  distClock-=dt;
  if(distClock<=0)distanceCall();

  /* mystery cargo — a rare surprise gift */
  cargoClock-=dt;
  if(cargoClock<=0&&!cargo&&!animal&&!hazards.length&&canInterrupt()){spawnCargo();cargoClock=(CFG.cargoEveryMin||110)+Math.random()*60;}
  if(cargo){
    cargo.sx-=cargo.v*dt*plane.speed*Math.max(0.1,fwd)+swingPx;
    if(Math.hypot(cargo.sx-W/2,cargo.sy-planeScreenY())<52&&canInterrupt()){collectCargo();}
    else if(cargo.sx<-60)cargo=null;
  }

  zoneClock+=dt;   /* general wind-wobble clock */
  /* the landscape tracks real WORLD POSITION, not a stopwatch — flying
     sideways, looping back, or turning fully around all shift the scenery
     honestly, exactly as far as he has actually gone */
  const wantZone=zoneIndexFor(miles,latMiles);
  if(wantZone!==(zonePending!=null?zonePending:zoneIdx)){ zonePending=wantZone; zoneBlendT=0; }
  if(zonePending!=null&&zonePending!==zoneIdx){
    zoneBlendT+=dt;
    if(zoneBlendT>=2.2){
      zoneIdx=zonePending;zonePending=null;zoneBlendT=0;
      banner(`${zone().em} ${zone().name}`,1800);
      updateHUD();
      setTimeout(maybeFork,2500);
    }
  }

  /* new scenery arrives from the horizon when flying forward, and from under
     the plane when flying backwards — so a U-turn really does reverse the world */
  spawnClock-=Math.abs(zspeed)*dt;
  if(spawnClock<=0){ spawnProp(fwd<0); spawnClock=0.30*0.20; }
  /* ...and while TURNING, it arrives from whichever side is swinging into
     view. Without this, flying side-on (where zspeed is 0, so the clock above
     never ticks) slowly emptied the landscape as everything slid away. */
  panSpawnClock-=Math.abs(swing);
  if(panSpawnClock<=0){ spawnPropSide(swing>0?1:-1); panSpawnClock=0.42; }

  props.forEach(p=>{ p.z-=zspeed*dt; p.x-=swing; });
  props=props.filter(p=>p.z>-0.08&&p.z<1.12&&p.x>-4.5&&p.x<4.5);
  /* clouds and kites are far off, so they swing at a gentler parallax */
  const skySlide=swingPx*0.5;
  clouds.forEach(c=>{
    c.x-=c.v*dt*plane.speed*Math.max(0.15,fwd)+skySlide;
    if(c.x<-80){c.x=W+80;c.y=20+Math.random()*140;}
    if(c.x>W+80){c.x=-80;c.y=20+Math.random()*140;}
  });
  skyClock-=dt;
  if(skyClock<=0){spawnSkyObj();skyClock=7+Math.random()*8;}
  skyObjs.forEach(s=>s.x-=s.v*dt*plane.speed*Math.max(0.15,fwd)+skySlide);
  skyObjs=skyObjs.filter(s=>s.x>-120&&s.x<W+120);

  /* animals — kept apart from hazards */
  if(!animal){
    animalClock-=dt;
    if(animalClock<=0){
      if(hazards.length||cargo){animalClock=4;}   /* wait for a clear, calm sky */
      else spawnAnimal();
    }
  }else{
    animal.z-=zspeed*dt*0.85;
    animal.x-=swing;                    /* it stays put on the ground */
    if(animal.z<0.5&&!animal.called){animal.called=true;animalCall(animal.em);}
    if(animal.z<=0.14&&animal.z>0.02&&!animal.missed){
      if(Math.abs(animal.x-plane.x)<0.36&&plane.alt<=26&&plane.wheels&&canInterrupt()){startRescue();return;}
    }
    if(animal.z<=0.02){
      if(!animal.missed){
        animal.missed=true;
        /* BUGFIX: this used to say "Steer closer!" even when the child had
           flown a perfect approach and the game itself was holding events
           back (canInterrupt). Now the message is always true. */
        const linedUp=Math.abs(animal.x-plane.x)<0.36&&plane.alt<=26&&plane.wheels;
        toast(`${animal.em} `+(
          plane.alt>26 ? 'Too high! Fly lower next time 🛬'
          : !plane.wheels ? 'Wheels DOWN next time 🛞'
          : linedUp ? 'So close! One at a time — catch the next one 💛'
          : 'Steer closer next time ⬅️➡️'));
      }
      if(animal.z<-0.1){animal=null;animalClock=animalGap();}
    }
    /* turned away from it? Let it go, and send another along. Without this the
       animal drifted off for ever and no new one could ever spawn. */
    if(animal&&Math.abs(animal.x)>3.2){
      if(!animal.missed)toast(`${animal.em} You turned away from ${animal.name}. Another friend will come 💛`);
      animal=null;animalClock=animalGap();
    }
    if(animal&&animal.z>1.1){
      if(!animal.missed)toast(`${animal.em} You flew away from ${animal.name}. Another friend will come 💛`);
      animal=null;animalClock=animalGap();
    }
  }

  /* ---- PACING ----------------------------------------------------------
     Early on: long, calm cruises. As he earns points and levels up, events
     close in gradually.                                                   */
  const experience=experienceNow();

  hazClock-=dt;
  const wxName=WEATHER[wxIdx][1];
  let interval=gapStatic(CFG.hazardBaseInterval,CFG.hazardMinInterval)/flowAdj;
  if(wxName==='Stormy')interval*=0.85;
  if(started&&hazClock<=0){
    if(wxName==='Calm'){hazClock=8;}                 /* peaceful stretch */
    else if(animal&&animal.z<0.45){hazClock=6;}      /* only during the swoop */
    else if(cargo){hazClock=6;}                      /* don't crowd the gift */
    else if(hazards.length>=(experience>0.5?CFG.maxHazardsAtOnce:1)){hazClock=8;}
    else{
      spawnHazard();
      hazClock=interval*(0.9+Math.random()*0.35);
      animalClock=Math.max(animalClock,animalGap()*0.75);   /* keep them apart */
      cargoClock=Math.max(cargoClock,gapStatic(18,9));
    }
  }
  updateHazards(dt,swingPx);

  /* emergency landing check */
  if(emergencyMode){
    emReminderT+=dt;
    if(emReminderT>8){
      emReminderT=0;alarmSound();
      banner('🚨 LAND! Go LOW ⬇️ + WHEELS 🛞',2400);
    }
    if(plane.alt<=13&&plane.wheels){emergencyMode=false;landedForRepair();return;}
  }

  if(invuln>0)invuln-=dt;
  if(shield>0)shield-=dt;
  if(shake>0)shake-=dt*3;
  iceFx=iceFx.filter(f=>(f.t+=dt)<1.2);
  updateAlt();
}

function updateHazards(dt,worldSwing){
  worldSwing=worldSwing||0;
  /* the dodge lane, PLUS the sideways drift of the world itself, so a hazard
     stays where it is on the ground when the plane slides across it */
  const dxShift=(plane.x-prevPlaneX)*(W*0.5)+worldSwing;
  const py=planeScreenY(),pxc=W/2;
  for(const h of hazards){
    /* the creature growls again every few seconds while it hunts you */
    h.snd=(h.snd||0)+dt;
    if(h.snd>3.4+Math.random()*2){h.snd=0;hazardSound(h.def);}
    /* lingering hazards (storms, hurricanes) eventually move on by themselves —
       nothing is allowed to nag the pilot forever */
    if(h.def.kind==='storm'||h.def.kind==='push'){
      h.life=(h.life||0)+dt;
      if(h.life>22){
        h.leaving=true;
        h.sy-=26*dt;                       /* rises and fades away */
        if(h.life>26){h.dead=true;toast(`${h.def.em} ${h.def.nm} floated away.`);}
      }
    }
    if(h.def.kind!=='flare'){h.sx-=dxShift;}
    h.t+=dt;
    const d=h.def;
    if(d.kind==='homing'){
      h.sx+=h.vx*dt;
      h.sy+=Math.sign(py-h.sy)*Math.min(Math.abs(py-h.sy),40*dt);
    }else if(d.kind==='straight'){h.sx+=h.vx*dt;}
    else if(d.kind==='fall'){h.sx+=h.vx*dt;h.sy+=h.vy*dt;}
    else if(d.kind==='push'){
      h.sx+=h.vx*dt;
      const dist=Math.hypot(h.sx-pxc,h.sy-py);
      if(dist<180){plane.x+=(h.sx>pxc?-1:1)*0.35*dt;} /* wind push */
    }else if(d.kind==='storm'){
      h.sx+=h.vx*dt;
      if(h.sx<60||h.sx>W-60)h.vx*=-1;
      h.strikeT-=dt;
      if(h.strikeT<=0&&h.bolt<=0){
        h.bolt=0.4;h.strikeT=Math.max(0.9,2.4-level()*0.14);thunderSound();
        /* AUTOPILOT: the rule the child programmed actually fires */
        if(autopilotOn&&Math.abs(pxc-h.sx)<70){
          shield=Math.max(shield,3);shieldKind='calm';apUsed++;
          toast('🤖 Autopilot saved you!',true);
          if(apUsed===1)speakPlain('Autopilot dived low, just like you planned!');
        }
      }
      if(h.bolt>0){
        h.bolt-=dt;
        /* lightning column hit test */
        if(Math.abs(pxc-h.sx)<44&&py>h.sy&&invuln<=0&&shield<=0)hitPlane(h);
      }
    }else if(d.kind==='flare'){
      h.timer-=dt;
      if(h.timer<=0){
        if(plane.alt>42&&invuln<=0&&shield<=0)hitPlane(h);
        else{toast('🌞 Great dive! The hot sun went over you!');addPoints(CFG.flareDodgePoints||25);updateHUD();}
        h.dead=true;
      }
    }
    /* collision */
    if(!h.dead&&d.kind!=='storm'&&d.kind!=='flare'&&invuln<=0&&shield<=0){
      if(Math.hypot(h.sx-pxc,h.sy-py)<(d.size*0.6+26)){
        hitPlane(h);                 /* it does NOT die — it can strike again */
        /* after a strike, everything backs off a beat, then comes round again */
        if(d.kind==='homing'||d.kind==='push'){ h.sy += (h.sy<py?-60:60); }
        else if(d.kind==='straight'){ h.sy += (h.sy<py?-70:70); }
      }
    }
    /* off the edge? It doesn't give up after one pass — it wheels round,
       re-aims at the plane, and comes back for another go (2–3 runs total). */
    if(h.sx<-120||h.sx>W+120||h.sy>H+80||h.sy<-150){
      h.passes=(h.passes||0)+1;
      const comesBack=!h.leaving&&!h.frozen&&h.def.kind!=='storm'&&h.def.kind!=='flare'
                      &&h.passes<(h.maxPasses||2);
      if(comesBack){
        if(h.def.kind==='fall'){
          h.sy=-60; h.sx=Math.max(60,Math.min(W-60,pxc+(Math.random()*160-80)));
        }else{
          h.vx=-h.vx;
          h.sx=Math.min(W+110,Math.max(-110,h.sx));
          h.sy=Math.max(50,py+(Math.random()*80-40));
        }
        hazardSound(h.def);
        toast(`${h.def.em} ${h.def.nm} is coming back!`,true);
      }else h.dead=true;
    }
  }
  const before=hazards.length;
  hazards=hazards.filter(h=>!h.dead);
  if(hazards.length!==before)updateCalmBtn();
}

function hitPlane(h){
  if(started)setTimeout(saveProgress,50);

  /* 1. the calm glow (or a kindness ring) soaks the strike up */
  const soaked=absorbStrike();
  if(soaked){
    invuln=(CFG.strikeInvuln||1.1);
    shake=0.7;
    iceFx.push({x:(h&&h.sx)||W/2,y:(h&&h.sy)||120,t:0});
    freezeSound();
    if(soaked==='calm'){
      toast(`🧊 Your calm took the hit! (${Math.round(calmPower)} left)`,true);
    }else{
      toast(`💛 Kindness took the hit! (${kindness} left)`,true);
    }
    updateHUD();updateCalmBtn();
    return;                                /* the hazard stays — it can strike again */
  }

  /* 2. nothing left to soak it: the plane takes the blow */
  strikeCount++;
  invuln=(CFG.strikeInvuln||1.1);
  shake=1.2;
  losePoints(Math.round(CFG.hazardHitPenalty/2));
  crashSound();
  const need=(CFG.strikesPerEngine||2);

  if(strikeCount<need){
    toast(`💥 Bump! One more and an engine breaks (${strikeCount}/${need})`,true);
    if(autoRead)speakPlain('Careful! One more bump and an engine breaks.');
    updateHUD();updateCalmBtn();
    return;
  }

  /* 3. every Nth strike costs an engine */
  strikeCount=0;
  engines=Math.max(0,engines-1);
  invuln=2.4;shake=1.8;
  updateHUD();updateCalmBtn();
  if(engines<=0){
    crash();
  }else if(engines===1){
    enterEmergency();
  }else{
    toast(`💥 An engine broke! ${engines}/${engineSlots} left`,true);
    if(autoRead)speakPlain('An engine broke. The hangar can fix it, with points.');
  }
}

/* ═══════════ DRAWING ═══════════ */
function draw(time){
  const an=plane.alt/100;
  horizon=H*lerp(0.24,0.44,an);
  zoomF=lerp(1.75,0.72,an);

  const z=zone(),nz=nextZone();
  const blend=Math.min(1,Math.max(0,zoneBlendT/2.2));
  const skyT=blendColor(z.skyT,nz.skyT,blend);
  const skyB=blendColor(z.skyB,nz.skyB,blend);
  const groundC=blendColor(z.ground,nz.ground,blend);

  const flare=hazards.find(h=>h.def.kind==='flare');
  const g=ctx.createLinearGradient(0,0,0,horizon+40);
  g.addColorStop(0,flare?'#FFB36B':blendColor(skyT,'#FFFFFF',0.12));
  g.addColorStop(1,blendColor(skyB,'#FFFFFF',0.10));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon+2);

  ctx.font='40px serif';ctx.textAlign='left';ctx.fillText('☀️',W-70,54);
  clouds.forEach(c=>{ctx.font=c.s+'px serif';ctx.globalAlpha=.9;ctx.fillText('☁️',c.x,Math.min(c.y,horizon-30));ctx.globalAlpha=1;});
  skyObjs.forEach(o=>drawEm(o.em,o.x,Math.min(o.y,horizon-24),o.s));

  const gg=ctx.createLinearGradient(0,horizon,0,H);
  gg.addColorStop(0,blendColor(groundC,'#FFFFFF',0.45));
  gg.addColorStop(1,blendColor(groundC,'#FFFFFF',0.18));
  ctx.fillStyle=gg;ctx.fillRect(0,horizon,W,H-horizon);

  drawTerrain(time);

  /* pale veil over the whole landscape: the BACKGROUND recedes so every
     dark-outlined object in front of it pops forward */
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.fillRect(0,horizon,W,H-horizon);

  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=2;
  for(let i=0;i<7;i++){
    const zz=((miles*6)+i/7)%1;   /* signed: reversing runs this backwards too */
    const t=Math.pow(1-zz,1.9);
    const y=horizon+(H-horizon)*t;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  props.slice().sort((a,b)=>b.z-a.z).forEach(p=>{
    const pr=project(p.x,p.z);
    if(pr.sy<horizon-4)return;
    ctx.globalAlpha=Math.min(1,(1-p.z)*3);
    drawEm(p.em,pr.sx,pr.sy,p.size*pr.scale);
    ctx.globalAlpha=1;
  });

  if(animal&&animal.z>-0.05){
    const pr=project(animal.x,animal.z);
    const bob=Math.sin(time*5)*4;
    /* bright spotlight disc so the animal never blends into the ground */
    ctx.fillStyle='rgba(255,240,190,0.55)';
    ctx.beginPath();ctx.ellipse(pr.sx+12*pr.scale,pr.sy-14*pr.scale,44*pr.scale,34*pr.scale,0,0,Math.PI*2);ctx.fill();
    drawEm(animal.em,pr.sx,pr.sy,46*pr.scale);
    const markS=20+an*34+14*(1-Math.min(1,animal.z*2));
    drawEm('🆘',pr.sx+8*pr.scale,pr.sy-52*pr.scale+bob,markS);
    if(an>0.45){
      drawEm(animal.em,pr.sx-markS*0.9,pr.sy-52*pr.scale+bob,markS*0.9);
    }
    if(animal.z<0.35){
      ctx.strokeStyle='rgba(255,180,50,0.9)';ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(pr.sx,pr.sy+6,64*pr.scale,19*pr.scale,0,0,Math.PI*2);ctx.stroke();
    }
  }

  drawCargo(time);
  drawHazards(time);
  if(viewMode==='chase'){drawPlane(time,an);}
  else{drawCockpit(time);}

  /* ice sparkles */
  iceFx.forEach(f=>{
    ctx.globalAlpha=1-f.t/1.2;
    ctx.font=(22+f.t*20)+'px serif';
    ctx.fillText('❄️',f.x+Math.sin(f.t*6)*8,f.y-f.t*40);
    ctx.globalAlpha=1;
  });

  /* the active shield bubble */
  if(shield>0){
    const py=planeScreenY();
    const col = shieldKind==='kind' ? '255,205,90' : '120,200,255';
    ctx.strokeStyle=`rgba(${col},${0.45+0.25*Math.sin(time*6)})`;
    ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(W/2,py,88,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=`rgba(${col},0.10)`;
    ctx.beginPath();ctx.arc(W/2,py,88,0,Math.PI*2);ctx.fill();
  }

  /* ── THE CALM GLOW ──────────────────────────────────────────────────────
     Not a bubble: a blue light around the plane. Its brightness IS his calm.
     Faint at 1 point, blazing at full. It fades unless he tops it up.     */
  if(started&&viewMode==='chase'){
    const py=planeScreenY();
    const gs=glowStrength();                      /* 0 … 1 */
    if(gs>0.01){
      const pulse=0.85+0.15*Math.sin(time*2.2);
      const R=58+42*gs;
      const grad=ctx.createRadialGradient(W/2,py,14,W/2,py,R);
      grad.addColorStop(0,`rgba(120,215,255,${0.30*gs*pulse})`);
      grad.addColorStop(0.55,`rgba(74,184,232,${0.20*gs*pulse})`);
      grad.addColorStop(1,'rgba(74,184,232,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(W/2,py,R,0,Math.PI*2);ctx.fill();
      /* a crisp rim once the glow is strong enough to really shrug off a hit */
      if(gs>0.25){
        ctx.strokeStyle=`rgba(140,225,255,${(0.25+0.55*gs)*pulse})`;
        ctx.lineWidth=2+5*gs;
        ctx.beginPath();ctx.arc(W/2,py,R*0.86,0,Math.PI*2);ctx.stroke();
      }
    }
    /* kindness sits outside it, in gold — tap the plane to spend one */
    for(let i=0;i<Math.min(3,kindness);i++){
      const r=104+i*10;
      const a=0.35+0.35*Math.sin(time*3-i*0.7);
      ctx.strokeStyle=`rgba(255,205,90,${a})`;
      ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(W/2,py,r,0,Math.PI*2);ctx.stroke();
    }
  }

  /* EMERGENCY: pulsing red vignette so danger is unmistakable */
  if(emergencyMode){
    const a=0.14+0.1*Math.sin(time*8);
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
    vg.addColorStop(0,'rgba(255,0,0,0)');
    vg.addColorStop(1,`rgba(220,30,30,${a})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }
  /* cockpit view: drifting smoke wisps across the windshield when badly hurt */
  if(viewMode==='cockpit'&&engines<=1){
    for(let i=0;i<3;i++){
      const p=((time*0.5)+i/3)%1;
      ctx.globalAlpha=(1-p)*0.25;
      ctx.fillStyle='#44444E';
      ctx.beginPath();ctx.ellipse(W*0.2+p*W*0.6,H*0.25+Math.sin(p*5)*24,60+60*p,20+16*p,0,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}

function drawHazards(time){
  /* off-screen hazards get a big flashing arrow at the edge, so an incoming
     eagle or rocket is never a surprise the child cannot see */
  hazards.forEach(h=>{
    if(h.def.kind==='flare')return;
    const off = h.sx<10 ? 'L' : (h.sx>W-10 ? 'R' : (h.sy<10 ? 'T' : null));
    if(!off)return;
    const y=Math.max(70,Math.min(H-90,h.sy||H/2));
    const x=off==='L'?26:(off==='R'?W-26:Math.max(30,Math.min(W-30,h.sx||W/2)));
    const pulse=0.55+0.45*Math.sin(time*9);
    ctx.save();
    ctx.globalAlpha=pulse;
    ctx.fillStyle='#E8564A';
    ctx.beginPath();
    if(off==='L'){ctx.moveTo(x-14,y);ctx.lineTo(x+12,y-16);ctx.lineTo(x+12,y+16);}
    else if(off==='R'){ctx.moveTo(x+14,y);ctx.lineTo(x-12,y-16);ctx.lineTo(x-12,y+16);}
    else {ctx.moveTo(x,26);ctx.lineTo(x-16,52);ctx.lineTo(x+16,52);}
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#33305E';ctx.lineWidth=3;ctx.stroke();
    ctx.globalAlpha=1;
    ctx.restore();
    drawEm(h.def.em, off==='T'?x-16:(off==='L'?x+18:x-52), off==='T'?86:y+11, 30);
  });

  hazards.forEach(h=>{
    const d=h.def;
    if(d.kind==='flare'){
      ctx.globalAlpha=0.55+0.25*Math.sin(time*10);
      ctx.fillStyle='#FF9E4F';
      ctx.fillRect(0,0,W,26);
      ctx.globalAlpha=1;
      ctx.font='46px serif';ctx.textAlign='left';
      ctx.fillText('🌞',W/2-23,50);
      ctx.font='700 16px Nunito';ctx.fillStyle='#8A2E00';
      ctx.fillText('⬇ GO DOWN LOW! '+Math.ceil(Math.max(0,h.timer))+'s',W/2-72,74);
      return;
    }
    const wob=Math.sin(time*4+h.sx*0.01)*4;
    /* danger halo: hazards must never blend into sky or terrain */
    const pulse=0.30+0.16*Math.sin(time*7);
    ctx.fillStyle=`rgba(255,70,60,${pulse})`;
    ctx.beginPath();ctx.arc(h.sx,h.sy+wob-d.size*0.32,d.size*0.72,0,Math.PI*2);ctx.fill();
    drawEm(d.em,h.sx-d.size/2,h.sy+wob,d.size);
    if(d.kind==='storm'){
      if(h.strikeT<0.6&&h.bolt<=0){ /* telegraph flash */
        ctx.globalAlpha=0.5+0.5*Math.sin(time*30);
        ctx.font=(d.size*0.6)+'px serif';ctx.textAlign='left';
        ctx.fillText('⚡',h.sx-10,h.sy+30);
        ctx.globalAlpha=1;
      }
      if(h.bolt>0){
        ctx.strokeStyle='rgba(255,230,80,0.95)';ctx.lineWidth=6;
        ctx.beginPath();
        let yy=h.sy+16,xx=h.sx;
        ctx.moveTo(xx,yy);
        while(yy<H*0.9){xx+=(Math.random()*26-13);yy+=34;ctx.lineTo(xx,yy);}
        ctx.stroke();
      }
    }
  });
}

/* ---------- TERRAIN ---------- */
const seedA=[...Array(48)].map((_,i)=>(((Math.sin(i*127.1)*43758.5453)%1)+1)%1);
function wedge(x1,x2,color){
  const t1=project(x1,0.96),t2=project(x2,0.96);
  const b1=project(x1,0),b2=project(x2,0);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(t1.sx,t1.sy);ctx.lineTo(t2.sx,t2.sy);
  ctx.lineTo(b2.sx,H);ctx.lineTo(b1.sx,H);ctx.closePath();ctx.fill();
}
/* Peaks are sampled by ABSOLUTE index along the panorama, so panning reveals
   genuinely different mountains instead of sliding one fixed ridge. */
function mountainLayer(color,hMax,n,off,shift,turns){
  const step=W/n, period=turns*n;
  const i0=Math.floor(shift/step), frac=shift-i0*step;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(-2*step,horizon);
  for(let i=-1;i<=n+2;i++){
    const h=(terrainSeed(i0+i+off,period)*0.6+0.4)*hMax;
    const x=i*step-frac;
    ctx.lineTo(x-step/2,horizon-h);
    ctx.lineTo(x,horizon);
  }
  ctx.lineTo(W+2*step,horizon);ctx.closePath();ctx.fill();
}
function drawTerrain(time){
  const id=zone().id;
  const shift=terrainShiftPx();
  /* --- horizon silhouettes (far landscape), panned by heading + position --- */
  if(id==='forest'){
    mountainLayer('rgba(150,172,205,0.34)',horizon*0.42,6,3,terrainPan(4),4);   /* far  */
    mountainLayer('rgba(110,150,120,0.36)',horizon*0.26,9,11,terrainPan(8),8);  /* near */
  }else if(id==='rural'){
    /* rolling hills: one hump per index, sampled absolutely */
    const n=3,step=W/n,period=PAN_TURNS*n;
    const i0=Math.floor(shift/step),frac=shift-i0*step;
    ctx.fillStyle='rgba(178,200,145,0.32)';
    ctx.beginPath();ctx.moveTo(-2*step,horizon);
    for(let i=-1;i<=n+2;i++){
      const hh=26+terrainSeed(i0+i,period)*30;
      const x=i*step-frac;
      ctx.quadraticCurveTo(x-step/2,horizon-hh,x,horizon);
    }
    ctx.lineTo(W+2*step,horizon);ctx.closePath();ctx.fill();
  }else if(id==='city'){
    const n=13,bw=W/n,period=PAN_TURNS*n;
    const i0=Math.floor(shift/bw),frac=shift-i0*bw;
    for(let i=-1;i<=n+1;i++){
      const sd=terrainSeed(i0+i,period);
      const h=14+sd*horizon*0.34;
      const x=i*bw-frac;
      ctx.fillStyle='rgba(140,155,185,0.34)';
      ctx.fillRect(x+2,horizon-h,bw*0.78,h);
      if(sd>0.4){                                   /* tiny lit windows */
        ctx.fillStyle='rgba(255,240,170,0.5)';
        ctx.fillRect(x+bw*0.25,horizon-h*0.7,3,3);
        ctx.fillRect(x+bw*0.5,horizon-h*0.45,3,3);
      }
    }
  }else if(id==='lake'){
    /* a far shore with headlands, so a turn over open water still reads */
    const n=5,step=W/n,period=PAN_TURNS*n;
    const i0=Math.floor(shift/step),frac=shift-i0*step;
    ctx.fillStyle='rgba(96,150,175,0.40)';
    ctx.beginPath();ctx.moveTo(-2*step,horizon);
    for(let i=-1;i<=n+2;i++){
      const hh=8+terrainSeed(i0+i,period)*26;
      const x=i*step-frac;
      ctx.quadraticCurveTo(x-step/2,horizon-hh,x,horizon-hh*0.35);
    }
    ctx.lineTo(W+2*step,horizon);ctx.closePath();ctx.fill();
    /* wooded islands sitting in front of it */
    for(let i=-1;i<=n+1;i++){
      const sd=terrainSeed(i0+i+7,period);
      if(sd<0.55)continue;
      const x=i*step-frac+step*0.5;
      const rw=W*(0.05+sd*0.07);
      ctx.fillStyle='rgba(70,130,90,0.5)';
      ctx.beginPath();ctx.ellipse(x,horizon,rw,13,0,Math.PI,0,true);ctx.fill();
    }
  }
  /* --- ground features (perspective), sliding with the same pan --- */
  const gx=shift/(W*0.55);            /* pan expressed in prop-x world units */
  const wrap=(v,per)=>((v%per)+per)%per;
  if(id==='rural'){
    /* striped fields: period 0.84, so wrap the pan into one stripe pair */
    const o=wrap(gx,0.84);
    for(let k=-4;k<5;k++){
      const x=k*0.42-o;
      wedge(x,x+0.42,k%2===0?'rgba(255,244,170,0.13)':'rgba(80,140,60,0.10)');
    }
  }else if(id==='city'){
    /* repeating blocks either side of the flight line */
    const o=wrap(gx,0.9);
    for(let k=-3;k<4;k++){
      const x=k*0.9-o;
      wedge(x,x+0.5,'rgba(120,130,150,0.14)');
    }
  }else if(id==='lake'){
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;
    for(let i=0;i<8;i++){
      const zz=((miles*4)+i/8)%1;
      const p=project((seedA[i]*2-1)*0.9-gx*0.35,zz);
      ctx.beginPath();
      ctx.moveTo(p.sx-34*p.scale,p.sy);
      ctx.quadraticCurveTo(p.sx,p.sy-4*p.scale,p.sx+34*p.scale,p.sy);
      ctx.stroke();
    }
    { const o=wrap(gx,1.2); wedge(0.35-o,0.6-o,'rgba(255,240,180,0.10)'); }  /* sun glint */
  }else if(id==='forest'){
    for(let i=0;i<9;i++){
      const zz=((miles*3)+seedA[i+20])%1;
      const p=project((seedA[i]*2-1)*1.1-gx*0.35,zz);
      if(p.sy<horizon)continue;
      ctx.fillStyle='rgba(40,90,50,0.13)';
      ctx.beginPath();ctx.ellipse(p.sx,p.sy,60*p.scale,16*p.scale,0,0,Math.PI*2);ctx.fill();
    }
  }
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawSmoke(x,y,time,heavy){
  for(let i=0;i<4;i++){
    const p=((time*0.8)+i/4)%1;
    ctx.globalAlpha=(1-p)*(heavy?0.5:0.28);
    ctx.fillStyle=heavy?'#3A3A44':'#777788';
    ctx.beginPath();
    ctx.arc(x+Math.sin(p*7+i)*7,y-56*p,(5+13*p),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawPlane(time,an){
  const px=W/2+(shake>0?(Math.random()-0.5)*8*shake:0);
  const py=planeScreenY();
  const blink=invuln>0&&Math.sin(time*20)>0;
  const shY=H*0.87,shS=lerp(1.35,0.3,an);
  ctx.fillStyle=`rgba(30,30,60,${lerp(0.32,0.07,an)})`;
  ctx.beginPath();ctx.ellipse(px,shY,60*shS,12*shS,0,0,Math.PI*2);ctx.fill();
  if(blink)return;

  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(plane.bank*0.30);
  ctx.translate(0,Math.sin(time*2.0)*3);
  const s=1.0+(engineSlots-4)*0.07;   /* upgrades make the plane bulkier */
  ctx.strokeStyle='#33305E';ctx.lineWidth=3;ctx.lineJoin='round';
  ctx.fillStyle='#C9D2E0';
  ctx.beginPath();ctx.moveTo(-8*s,2*s);ctx.lineTo(-92*s,14*s);ctx.lineTo(-92*s,22*s);ctx.lineTo(-8*s,12*s);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(8*s,2*s);ctx.lineTo(92*s,14*s);ctx.lineTo(92*s,22*s);ctx.lineTo(8*s,12*s);ctx.closePath();ctx.fill();ctx.stroke();
  /* engine pods — up to 6 slots; broken engines are dark and smoking */
  const podPos=[[-72,20],[-40,15],[40,15],[72,20],[-96,24],[96,24]];
  for(let i=0;i<Math.min(engineSlots,podPos.length);i++){
    const [ex,ey]=podPos[i];
    const alive=i<engines;
    ctx.fillStyle=alive?'#8E97AC':'#4A4550';
    ctx.beginPath();ctx.ellipse(ex*s,(ey+8)*s,8*s,10*s,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle=alive?'#4A5468':'#2B2833';
    ctx.beginPath();ctx.ellipse(ex*s,(ey+8)*s,4.5*s,6*s,0,0,Math.PI*2);ctx.fill();
    if(!alive)drawSmoke(ex*s,(ey+8)*s,time+i*0.4,engines<=1);
  }
  ctx.fillStyle='#F4F6FA';
  ctx.beginPath();ctx.ellipse(0,0,17*s,24*s,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#3D6BB3';rr(-17*s,-3*s,34*s,7*s,3*s);ctx.fill();
  /* tail fin in the player's chosen paint */
  ctx.fillStyle=paint;
  ctx.beginPath();ctx.moveTo(-4*s,-18*s);ctx.lineTo(-2*s,-56*s);ctx.lineTo(7*s,-56*s);ctx.lineTo(5*s,-18*s);ctx.closePath();ctx.fill();ctx.stroke();
  /* earned stickers on the tail */
  if(stickers>0){
    ctx.font=(9*s)+'px serif';ctx.textAlign='left';
    for(let i=0;i<Math.min(5,stickers);i++)ctx.fillText('⭐',-1*s,(-24-i*7)*s);
  }
  ctx.fillStyle='#C9D2E0';
  ctx.beginPath();ctx.moveTo(-3*s,-42*s);ctx.lineTo(-34*s,-36*s);ctx.lineTo(-34*s,-31*s);ctx.lineTo(-3*s,-35*s);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(3*s,-42*s);ctx.lineTo(34*s,-36*s);ctx.lineTo(34*s,-31*s);ctx.lineTo(3*s,-35*s);ctx.closePath();ctx.fill();ctx.stroke();
  if(input.boost){
    ctx.fillStyle='rgba(255,200,120,0.5)';
    [[-72,32],[-40,27],[40,27],[72,32]].forEach(([ex,ey])=>{
      ctx.beginPath();ctx.ellipse(ex*s,ey*s+Math.random()*4,5,9+Math.random()*6,0,0,Math.PI*2);ctx.fill();
    });
  }
  if(plane.wheels){
    ctx.strokeStyle='#33305E';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(0,20*s);ctx.lineTo(0,32*s);ctx.moveTo(-20*s,16*s);ctx.lineTo(-20*s,30*s);ctx.moveTo(20*s,16*s);ctx.lineTo(20*s,30*s);ctx.stroke();
    ctx.fillStyle='#33305E';
    [[0,34],[-24,33],[-16,33],[16,33],[24,33]].forEach(([wx,wy])=>{ctx.beginPath();ctx.arc(wx*s,wy*s,6*s,0,Math.PI*2);ctx.fill();});
  }
  /* extra distress when nearly out of engines */
  if(engines<=1){
    if(Math.sin(time*14)>0.3){
      ctx.fillStyle='rgba(255,140,60,0.8)';
      ctx.beginPath();ctx.ellipse(-40*s,30*s,5,8+Math.random()*4,0,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='rgba(50,45,60,0.45)';
    ctx.beginPath();ctx.ellipse(8*s,6*s,8*s,5*s,0.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  /* keep the "tap the plane" zone sitting exactly over the plane */
  const tap=document.getElementById('planetap');
  if(tap){
    tap.classList.toggle('show',started&&!paused);
    tap.style.top=Math.max(0,py-75)+'px';
  }
}

/* ---------- HIGH-CONTRAST ITEMS ------------------------------------------
   The landscape is deliberately washed pale (see drawTerrain), and every
   object gets a THICK DARK OUTLINE drawn around it — so houses, cars,
   animals, hazards and gifts always read DARKER than the ground behind
   them, instead of blending in.

   PERFORMANCE FIX: this used to stamp the emoji EIGHT times with shadowBlur
   switched on, plus two more passes — ten blurred fillText calls per emoji,
   per frame, for every prop in the sky. That is what made the game stutter on
   a phone. Four crisp offsets give the same thick outline for far less work,
   and only ONE pass now uses a shadow.                                     */
const INK_DARK='#221F3D';
function drawEm(em,x,y,size,opts){
  opts=opts||{};
  size=Math.max(8,size|0);
  ctx.save();
  ctx.font=size+'px serif';
  ctx.textAlign=opts.center?'center':'left';

  /* 1. thick dark halo — 4 crisp offsets, no blur */
  const r=Math.max(1.6,size*0.06);
  ctx.fillStyle=INK_DARK;
  ctx.globalAlpha=0.92;
  ctx.fillText(em,x-r,y-r);
  ctx.fillText(em,x+r,y-r);
  ctx.fillText(em,x-r,y+r);
  ctx.fillText(em,x+r,y+r);
  ctx.globalAlpha=1;

  /* 2. one thin light rim so the dark outline shows on dark terrain too */
  ctx.shadowColor='rgba(255,255,255,0.9)';
  ctx.shadowBlur=Math.max(2,size*0.12);
  ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  ctx.fillText(em,x,y);
  ctx.shadowColor='transparent';ctx.shadowBlur=0;

  /* 3. the emoji itself, then a dark glaze so it sits DARKER than the land */
  ctx.fillText(em,x,y);
  if(opts.tint!==false){
    ctx.globalCompositeOperation='source-atop';
    ctx.globalAlpha=0.16;
    ctx.fillStyle=INK_DARK;
    ctx.fillRect(x-size*1.2,y-size*1.25,size*2.4,size*1.8);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
}

function drawCockpit(time){
  const bank=plane.bank*0.18;
  ctx.save();
  ctx.translate(W/2,H/2);ctx.rotate(bank);ctx.translate(-W/2,-H/2);
  /* windshield pillars */
  ctx.fillStyle='#26233F';
  ctx.beginPath();ctx.moveTo(-20,-20);ctx.lineTo(W*0.14,-20);ctx.lineTo(W*0.05,H+20);ctx.lineTo(-20,H+20);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(W+20,-20);ctx.lineTo(W*0.86,-20);ctx.lineTo(W*0.95,H+20);ctx.lineTo(W+20,H+20);ctx.closePath();ctx.fill();
  ctx.fillRect(-20,-20,W+40,44);          /* top canopy strip */
  ctx.fillRect(W/2-4,-20,8,H*0.28);       /* centre divider */
  ctx.restore();
  /* dashboard base (not rotated) */
  ctx.fillStyle='#26233F';
  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.quadraticCurveTo(W/2,H-190,W,H);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#191731';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(0,H);ctx.quadraticCurveTo(W/2,H-190,W,H);ctx.stroke();
  /* subtle windshield glass shine */
  ctx.strokeStyle='rgba(255,255,255,0.09)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W*0.2,40);ctx.lineTo(W*0.32,H*0.45);ctx.stroke();
}

/* Colour helpers.
   BUGFIX: blendColor() returns an "rgb(r,g,b)" string, and during a zone
   transition that string was fed back INTO blendColor() — hx() then tried to
   read "rg" as hex and produced rgb(NaN,...), which canvas rejects.
   hx() now understands both formats, and blendColor clamps every channel. */
function hx(h){
  if(Array.isArray(h))return h;
  h=String(h).trim();
  const m=h.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
  if(m)return [+m[1],+m[2],+m[3]];
  h=h.replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const p=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
  return p.map(v=>isNaN(v)?0:v);
}
function blendColor(a,b,t){
  if(!(t>0))return a;
  if(t>=1)return b;
  const pa=hx(a),pb=hx(b);
  const c=pa.map((v,i)=>{
    let x=Math.round(lerp(v,pb[i],t));
    if(isNaN(x))x=0;
    return Math.max(0,Math.min(255,x));
  });
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function sayGps(){
  stopSpeak();
  const rel=relBearing();
  let dir='straight ahead';
  if(Math.abs(rel)>2.2) dir='behind you. Turn all the way around';
  else if(rel>0.5) dir='over to your right';
  else if(rel<-0.5) dir='over to your left';
  speakPlain(`${cap1(curMission.placeName)} is ${Math.round(milesLeft())} miles away, ${dir}. You have flown ${Math.round(miles)} miles so far.`);
}
function updateGps(){
  const c=document.getElementById('compass');
  if(!c)return;
  c.classList.toggle('show',started&&!paused&&viewMode==='chase');

  /* RADAR: the village is pinned at the centre. The plane blip sits exactly
     where the plane is on the 2-D map — start of the journey = the rim,
     touching the mountain = the middle. Fly right and the blip slides right;
     turn all the way round and it slides back towards the rim. The blip's
     nose always points exactly where the plane is heading. */
  const R=44, scale=CFG.missionDistance;
  const vx=latMiles, vy=miles-CFG.missionDistance;     /* village → plane, world */
  const m=Math.hypot(vx,vy)||0.0001;
  const rad=Math.min(1,m/scale)*R;
  const sx=60+(vx/m)*rad, sy=60-(vy/m)*rad;
  const g=document.getElementById('cpPlane');
  if(g)g.setAttribute('transform',`translate(${sx.toFixed(1)},${sy.toFixed(1)})`);
  const sh=document.getElementById('cpPlaneShape');
  if(sh)sh.setAttribute('transform',`rotate(${(plane.heading*180/Math.PI).toFixed(1)})`);
  const ln=document.getElementById('cpLine');
  if(ln){ln.setAttribute('x2',sx.toFixed(1));ln.setAttribute('y2',sy.toFixed(1));}

  const arc=document.getElementById('cpRange');
  if(arc){const f=journeyFrac();arc.setAttribute('stroke-dashoffset',String(295-295*f));}

  const mi=document.getElementById('cpMiles');
  if(mi)mi.textContent=Math.max(0,Math.round(milesLeft()))+' mi';

  /* the blip's nose already shows which way he is pointing, and the disc
     pulses red when he is well off track — no words needed */

  /* the radar disc tints toward the zone he is actually over */
  const disc=document.getElementById('cpDisc');
  if(disc)disc.setAttribute('fill',blendColor('#131E34',zone().skyB,0.22));

  const rel=relBearing();
  /* Veering off is normal flying — he may go as far left, right, or turned
     fully around as he likes. The radar only pulses red when he is BOTH
     pointed well away from the village AND still has real distance to cover. */
  const wrong = Math.abs(rel)>1.75 && distToDest()>3 && started;
  c.classList.toggle('wrongway',wrong);
}
function updateDrawer(){
  updateCalmBtn();
  updateGps();
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('dPilot',kidName||'Pilot');
  set('dScore',score);
  set('dStars',availableStars());
  set('dWins',stats.rescues);
  set('dKind',kindness);
  set('dNeeds',wNeeds);
  set('dWants',wWants);

/* ═══════════ CONTROLS: FIXED JOYSTICK (bottom-left) ═══════════ */
const dialEl=document.getElementById('dial');
const knobEl=document.getElementById('dialKnob');
const KNOB_MAX=36, DEAD=0.30;
let dialPointer=null;

function dialCentre(){
  const r=dialEl.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2, r:r.width/2};
}
function dialMove(x,y){
  const c=dialCentre();
  let dx=(x-c.x)/c.r, dy=(y-c.y)/c.r;
  const mag=Math.hypot(dx,dy);
  if(mag>1){dx/=mag;dy/=mag;}
  input.left=dx<-DEAD;input.right=dx>DEAD;
  input.up=dy<-DEAD;input.down=dy>DEAD;
  knobEl.style.transform=`translate(${dx*KNOB_MAX}px,${dy*KNOB_MAX}px)`;
}
function dialRelease(){
  dialPointer=null;
  input.left=input.right=input.up=input.down=false;
  knobEl.style.transform='translate(0px,0px)';
}
dialEl.addEventListener('touchstart',e=>{
  e.preventDefault();audioInit();
  const t=e.changedTouches[0];dialPointer=t.identifier;dialMove(t.clientX,t.clientY);
},{passive:false});
/* track the finger even if it slides off the pad */
window.addEventListener('touchmove',e=>{
  if(dialPointer===null)return;
  for(const t of e.changedTouches){
    if(t.identifier===dialPointer){e.preventDefault();dialMove(t.clientX,t.clientY);break;}
  }
},{passive:false});
['touchend','touchcancel'].forEach(ev=>window.addEventListener(ev,e=>{
  if(dialPointer===null)return;
  for(const t of e.changedTouches){ if(t.identifier===dialPointer){dialRelease();break;} }
}));
let dialMouse=false;
dialEl.addEventListener('mousedown',e=>{dialMouse=true;audioInit();dialMove(e.clientX,e.clientY);});
window.addEventListener('mousemove',e=>{if(dialMouse)dialMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',()=>{if(dialMouse){dialMouse=false;dialRelease();}});

/* boost — locked while landing gear is down */
function tryBoost(on){
  const btn=document.getElementById('btnBoost');
  if(on&&plane.wheels){
    input.boost=false;
    if(btn)btn.classList.add('locked');
    toast('🛞 Wheels are down — no boost',true);
    speakPlain('Your wheels are down. Boost does not work now.');
    return;
  }
  if(btn)btn.classList.remove('locked');
  input.boost=on;
}
(()=>{
  const el=document.getElementById('btnBoost');
  const on=e=>{e.preventDefault();audioInit();tryBoost(true);el.classList.add('held');};
  const off=e=>{e.preventDefault();tryBoost(false);el.classList.remove('held');};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off);el.addEventListener('touchcancel',off);
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);
})();
document.getElementById('btnWheels').addEventListener('click',()=>{
  audioInit();plane.wheels=!plane.wheels;
  if(plane.wheels&&input.boost)tryBoost(false);
  updateHUD();gearSound(plane.wheels);
});
window.addEventListener('keydown',e=>{
  audioInit();
  if(e.key==='ArrowUp')input.up=true;
  if(e.key==='ArrowDown')input.down=true;
  if(e.key==='ArrowLeft')input.left=true;
  if(e.key==='ArrowRight')input.right=true;
  if(e.key===' ')tryBoost(true);
  if(e.key==='w'||e.key==='W'){plane.wheels=!plane.wheels;if(plane.wheels)tryBoost(false);updateHUD();gearSound(plane.wheels);}
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp')input.up=false;
  if(e.key==='ArrowDown')input.down=false;
  if(e.key==='ArrowLeft')input.left=false;
  if(e.key==='ArrowRight')input.right=false;
  if(e.key===' ')tryBoost(false);
});

/* autoReadIf() is skipped inside NVC cards — those are narrated once, as a
   whole chain, by nvcNarrate(). This is what was speaking everything twice. */
let suppressAutoRead=false;
let sayId=0;
function addSpeakers(){
  /* text blocks: read with word highlighting */
  modalEl.querySelectorAll('h2,.msub,.speech,.sentence,.mathq').forEach(el=>{
    if(el.querySelector('.spkr'))return;
    if(!el.id)el.id='say'+(sayId++);
    el.dataset.txt=el.textContent;
    const b=document.createElement('span');
    b.className='spkr';b.innerHTML=SPK;b.setAttribute('role','button');b.setAttribute('aria-label','Read aloud');
    const id=el.id;
    b.onclick=e=>{e.stopPropagation();e.preventDefault();speakHL(id);};
    el.appendChild(b);
  });
  /* every choice: read the choice aloud */
  modalEl.querySelectorAll('.chip,.rowcard,.ans').forEach(el=>{
    if(el.querySelector('.spkr'))return;
    const label=el.textContent.trim();
    const b=document.createElement('span');
    b.className='spkr';b.innerHTML=SPK;b.setAttribute('role','button');b.setAttribute('aria-label','Read choice aloud');
    b.style.marginLeft='auto';
    b.onclick=e=>{e.stopPropagation();e.preventDefault();stopSpeak();speakPlain(label);};
    el.appendChild(b);
  });
}
function closeModal(){
  suppressAutoRead=false;
  stopSpeak();
  stopBreath();
  if(typeof arch!=='undefined'&&arch)archStop();
  overlay.classList.remove('show');
  if(started)paused=false;
  engineUpdate();updateCalmBtn();
}
/* BUGFIX: esc() only escaped "<". A pilot name containing a quote broke
   value="..." attributes, and "&" produced stray entities. */
function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* "the village" → "The village" — for starting a sentence with a mission's placeName */
function cap1(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1);}
/* auto-read helper — reads the text, then chains (e.g., into the choices) */
function autoReadIf(id,cb){
  if(suppressAutoRead){ if(cb)cb(); return; }
  if(autoRead) setTimeout(()=>speakHL(id,cb),250);
}

function startRescue(){
  /* SAFETY: this is normally only reached with an animal in the arms, but if
     anything ever calls it without one, throwing here would leave the game
     paused with NO modal on screen — a dead end a child cannot escape. Borrow
     an animal from the current zone instead. */
  if(!animal){
    const z=zone();
    const em=z.animals[Math.floor(Math.random()*z.animals.length)];
    animal={em,name:ANIMAL_NAMES[em]||'Buddy'};
  }
  suppressAutoRead=false;
  markInterrupt();
  ctxMode='rescue';
  paused=true;engineUpdate();updateCalmBtn();
  const active=CHALLENGE_TYPES.filter(c=>enabled[c.id]&&(c.id!=='custom'||qPool().length));
  /* BUGFIX: if the only challenge left switched on was "my own questions" and
     no questions had been added, `active` came out empty and the next line
     threw on undefined. Vault math is always a safe fallback. */
  const ids=active.length?active.map(a=>a.id):['math'];
  if(rotation.join()!==ids.join()){rotation=ids;rotIdx=0;}
  const type=rotation[rotIdx%rotation.length];rotIdx++;
  const pool=allSituations();
  const sit=normSit(pool[Math.floor(Math.random()*pool.length)]);
  rescue={em:animal.em,name:animal.name,type,sit,zone:zone().id,word:null,wordEm:'',need:null,needEm:'',req:null,own:null,quick:null};
  failsThisChallenge=0;
  animal=null;animalClock=animalGap();hazClock=Math.max(hazClock,gapStatic(12,7));
  animalCall(rescue.em);
  const entry=CHALLENGE_TYPES.find(c=>c.id===type)||CHALLENGE_TYPES[0];
  entry.start();
}

/* ═══════════ ARCADE — every game, any time, for its own small reward ═══════
   A rescue happens when it happens; this is the opposite — a game he picks
   on purpose, whenever he likes, that still earns him something. It never
   touches the animal waiting mid-air for a real rescue. */
function arcadePtsFor(id){
  if(NVC_TYPES.includes(id))return CFG.arcadePoints+CFG.nvcBonus;
  if(id==='ground')return CFG.arcadePoints+CFG.groundBonus;
  if(id==='breathe')return CFG.arcadePoints+CFG.calmBonus;
  return CFG.arcadePoints;
}
function showArcade(){
  paused=true;engineUpdate();
  /* 'sharing' is left out: it moves points to someone else, and already has
     its own standalone door (💝 SHARE POINTS) — mixing it into a list that
     otherwise always REWARDS points would let points be earned by "giving
     them away" */
  const list=CHALLENGE_TYPES.filter(c=>c.id!=='sharing'&&enabled[c.id]!==false&&(c.id!=='custom'||qPool().length));
  openModal(`
    <div class="bigem">🎮</div>
    <h2>Play any game, any time</h2>
    <p class="msub" id="arcQ">Pick a game, Captain. You can always earn a few points, any time you like.</p>
    <div class="stack">
      ${list.map(c=>`<button class="rowcard" onclick="playArcade('${c.id}')"><span class="em">${c.em}</span>${esc(c.label)}<small style="margin-left:auto;font-weight:800;opacity:.7;white-space:nowrap">+${arcadePtsFor(c.id)}</small></button>`).join('')}
    </div>
  `);
  autoReadIf('arcQ');
}
function playArcade(id){
  const entry=CHALLENGE_TYPES.find(c=>c.id===id);
  if(!entry)return;
  const z=zone();
  const em=z.animals[Math.floor(Math.random()*z.animals.length)];
  const name=ANIMAL_NAMES[em]||'Buddy';
  suppressAutoRead=false;
  ctxMode='arcade';
  paused=true;engineUpdate();
  const pool=allSituations();
  const sit=normSit(pool[Math.floor(Math.random()*pool.length)]);
  rescue={em,name,type:id,sit,zone:z.id,word:null,wordEm:'',need:null,needEm:'',req:null,own:null,quick:null};
  failsThisChallenge=0;
  entry.start();
}
function situationText(){return String(rescue.sit.tx||'').split('{N}').join(rescue.name);}
/* accept both the new {feeling,need,resolution} shape and the older {fam} one */
function normSit(sit){
  if(!sit)return {tx:'{N} needs a friend.',feeling:'sad',need:'comfort',resolution:'Listen to how they feel'};
  return {
    tx: sit.tx || sit.situation || '{N} needs a friend.',
    feeling: sit.feeling || sit.fam || 'mixed',
    need: sit.need || 'being_heard',
    resolution: sit.resolution || sit.helps || 'Listen to how they feel',
    wrong: sit.wrong || []
  };
}
/* every scenario the game can draw from = built-in + parent-added */
function allSituations(){return SITUATIONS.concat(customSituations);}

function startFreeze(kind){
  frozenTarget=hazards[0]||null;
  if(kind==='breathe'){
    if(!frozenTarget){ctxMode='practice';showBreath('practice');return;}
    ctxMode='freezeAll';showBreath('freezeAll');return;
  }
  ctxMode='freezeOne';
  if(!frozenTarget){closeModal();return;}
  const d=frozenTarget.def;
  rescue={em:d.em,name:d.nm.split(' ')[0],type:kind,
          sit:{feeling:d.fam,need:HAZ_NEED[d.fam]||'being_heard',tx:d.story,resolution:HAZ_FIX[d.fam]||'Listen to how they feel'},
          zone:zone().id,word:null,wordEm:'',need:null,needEm:'',req:null,own:null};
  if(kind==='math')showMath();else showFeelStep();
}
function applyFreezeOne(){
  stats.freezes++;
  if(frozenTarget){
    iceFx.push({x:frozenTarget.sx||W/2,y:frozenTarget.sy||120,t:0});
    frozenTarget.dead=true;
    hazards=hazards.filter(h=>!h.dead);
  }
  freezeSound();updateCalmBtn();
}
function applyFreezeAll(){
  stats.freezes+=hazards.length;stats.zens++;
  hazards.forEach(h=>iceFx.push({x:h.sx||W/2,y:h.sy||120,t:0}));
  hazards=[];shield=20;shieldKind='calm';
  freezeSound();updateCalmBtn();
}

/* ═══════════ 1) VAULT / CALM-CODE MATH ═══════════ */
const VAULT_REWARDS=[
  ['pudding','🍰','a slice of berry cake'],['pudding','🍦','a swirly ice cream'],['pudding','🧁','a rainbow cupcake'],
  ['food','🍎','a basket of crunchy apples'],['food','🥕','a bunch of sweet carrots'],['food','🍯','a jar of golden honey'],
  ['party','🎀','a fancy bow for their home'],['party','🎈','party balloons'],['party','🪅','a piñata for their den']
];
let mathProb=null,vaultReward=null;
/* Maths mix:
     • addition:       1–3 digits (scaled by age band)
     • subtraction:    1–2 digits (never goes below zero)
     • multiplication: single digit × single digit                     */
function makeMath(){
  const r=n=>Math.floor(Math.random()*n);
  let q,ans,opts;

  /* parent-written questions get used alongside the generated ones */
  const cm=customMath[band]||[];
  if(cm.length&&Math.random()<0.45){
    const c=cm[r(cm.length)];
    const wrong=(c.wrong&&c.wrong.length?c.wrong:[c.ans+1,c.ans-1,c.ans+2]).slice(0,3);
    return {q:c.q, ans:c.ans, opts:shuffle([...new Set([c.ans,...wrong])]).slice(0,4)};
  }

  const d1=()=>1+r(9);                    /* 1..9      */
  const d2=()=>10+r(90);                  /* 10..99    */
  const d3=()=>100+r(900);                /* 100..999  */

  if(band==='t'){
    /* pre-numeracy: counting and tiny sums */
    if(Math.random()<0.5){
      const n=2+r(5);ans=n;q=`How many apples?<br>${'🍎'.repeat(n)}`;
      opts=shuffle([ans,ans+1,Math.max(1,ans-1)]);
    }else{
      const a=1+r(4),b=1+r(4);ans=a+b;q=`${a} + ${b} = ?`;
      opts=shuffle([ans,ans+1,Math.max(1,ans-1)]);
    }
    return {q,ans,opts:[...new Set(opts)].slice(0,4)};
  }

  /* ADDITION sizes: mostly a 2-digit number plus a 1- or 2-digit one, and
     sometimes a 3-digit number plus a 1-, 2- or 3-digit one. The older bands
     see the big ones more often, but the shape of the sum is the same. */
  const bigAdd=(()=>{
    const roll=Math.random();
    if(band==='y') return roll<0.25;      /* 1 in 4 is a 3-digit sum */
    if(band==='m') return roll<0.45;
    return roll<0.65;                      /* 'o' leans big */
  })();

  const kind=r(3);            /* 0 = add, 1 = subtract, 2 = multiply */

  if(kind===0){
    let a,b,near;
    if(bigAdd){
      /* 3-digit + (1, 2 or 3 digit) */
      a=d3();
      const w=r(3);
      b=w===0?d1():(w===1?d2():d3());
      near=100;
    }else{
      /* 2-digit + (1 or 2 digit) */
      a=d2();
      b=(Math.random()<0.5?d1():d2());
      near=10;
    }
    ans=a+b;q=`${a} + ${b} = ?`;
    opts=shuffle([ans,ans+near,Math.max(0,ans-near),ans+1]);
  }
  else if(kind===1){
    /* SUBTRACTION: a 1-digit or a 2-digit take-away, never below zero */
    let a,b;
    if(Math.random()<(band==='y'?0.5:0.3)){a=2+r(8);b=1+r(a);}   /* 1-digit */
    else{a=d2();b=(Math.random()<0.6?d1():1+r(a-1));}            /* 2-digit */
    ans=a-b;q=`${a} − ${b} = ?`;
    opts=shuffle([ans,ans+1,Math.max(0,ans-1),ans+10]);
  }
  else{
    /* MULTIPLICATION: single digit × single digit, always */
    const a=(band==='y')?2+r(5):2+r(8);   /* 2..6 for the little ones, 2..9 later */
    const b=(band==='y')?2+r(5):2+r(8);
    ans=a*b;q=`${a} × ${b} = ?`;
    opts=shuffle([ans,ans+a,Math.max(1,ans-b),ans+b]);
  }
  return {q,ans,opts:[...new Set(opts)].slice(0,4)};
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function showMath(){
  mathProb=makeMath();
  vaultReward=VAULT_REWARDS[Math.floor(Math.random()*VAULT_REWARDS.length)];
  const freeze=ctxMode==='freezeOne';
  openModal(`
    <div class="bigem">${rescue.em}</div>
    <h2>${freeze?`A calm code for ${esc(rescue.name)}! 🧊`:`The ${vaultReward[0]} box is locked! 🔒`}</h2>

    <div class="vault">${freeze?'🧊':'🔒'} CODE: <span class="code" id="vcode">? ? ?</span></div>
    <div class="mathq">${mathProb.q}</div>

    </div>

let rRAF=null;
function resetBreathLoop(){
  if(rRAF)cancelAnimationFrame(rRAF);
  let t0=performance.now(), pt=0, phase='';
  const CYCLE=8;
  const step=(t)=>{
    if(!reset||reset.phase!=='breathe')return;
    pt+=(t-t0)/1000; t0=t;
    const inB=(pt%CYCLE)<4;
    if(inB&&phase!=='in'){
      phase='in';
      const p=document.getElementById('rPhase'); if(p)p.textContent='Breathe in… belly goes up';
      if(reset.breaths<3)speakPlain('Breathe in.');
      tone(300,3.6,'sine',0.05,0,430);
    }else if(!inB&&phase!=='out'){
      phase='out';
      reset.breaths++;
      const p=document.getElementById('rPhase'); if(p)p.textContent='Breathe out… belly goes down';
      if(reset.breaths<=3)speakPlain('And out.');
      tone(430,3.8,'sine',0.05,0,260);
      if(reset.breaths>=3){ resetDone(); return; }
      renderReset();
    }
    const s01=Math.sin((pt%CYCLE)/CYCLE*Math.PI*2-Math.PI/2)*0.5+0.5;
    const b=document.getElementById('rBelly'), bear=document.getElementById('rBear');
    if(b){b.setAttribute('ry',24+13*s01);b.setAttribute('cy',86-6*s01);}
    if(bear)bear.setAttribute('transform',`translate(0,${-18*s01})`);
    rRAF=requestAnimationFrame(step);
  };
  rRAF=requestAnimationFrame(step);
}
function resetFelt(){
  if(!reset)return;

    speakPlain(RESET_SENSE[reset.sense].say);

  }

  if(reset.cycle<2){
    reset.sense=0;
    renderReset();
    speakPlain('Good. One more time around. Feet again.');
    return;
  }
  resetDone();
}

/* ═══════════ 2) FEELINGS (NVC) ═══════════ */
/* recap: one short line, never the whole story again */
function recapCard(){
  let line=esc(rescue.name);
  if(rescue.word) line+=` feels <b>${esc(rescue.word.toLowerCase())}</b>`;
  if(rescue.need) line+=`, and needs <b>${esc(rescue.need)}</b>`;
  line+='.';
  return `<div class="recap" id="recap">${line}</div>`;
}
/* ---- NVC quiz built from CATEGORIES + SYNONYMS ----
   The right answer is a random synonym of the situation's category, so the
   same story shows different words each time. Wrong answers come from OTHER
   categories, so they are always clearly different in meaning.          */
let quiz={};
function synFor(table,cat){
  const t=table[cat];
  if(!t)return null;
  const arr=t[band]||t.y||t.m||t.t||t.o||[];
  return arr.length?arr[Math.floor(Math.random()*arr.length)]:null;
}
function synOptions(table,correctCat,nWrong){
  let correct=synFor(table,correctCat);
  if(!correct){                       /* unknown category → fall back safely */
    const first=Object.keys(table)[0];
    correct=synFor(table,first);
    correctCat=first;
  }
  if(!correct)return {opts:[['💛','okay']],correct:0};

  /* SAFETY: if a word appears in the correct category AND in another one, it is
     a legitimate answer — it must never be offered as a "wrong" option.       */
  const okWords=new Set(
    (((table[correctCat]||{})[band])||[]).map(x=>String(x[1]).toLowerCase())
  );
  okWords.add(String(correct[1]).toLowerCase());

  const others=Object.keys(table).filter(c=>c!==correctCat);
  const wrong=[];
  let guard=0;
  while(wrong.length<nWrong && guard++<80){
    const c=others[Math.floor(Math.random()*others.length)];
    const pick=synFor(table,c);
    if(!pick)continue;
    const w=String(pick[1]).toLowerCase();
    if(okWords.has(w))continue;                       /* also correct → skip */
    if(wrong.some(x=>String(x[1]).toLowerCase()===w))continue;
    wrong.push(pick);
  }
  const opts=shuffle([correct,...wrong]);
  return {opts, correct:opts.indexOf(correct)};
}
function showFeelStep(){
  suppressAutoRead=true;
  rescue.sit=normSit(rescue.sit);
  feelingSound(rescue.sit.feeling==='happy'?'mixed':rescue.sit.feeling);

  const freeze=ctxMode==='freezeOne';

    <h2>${freeze?`Help ${esc(rescue.name)} feel calm!`:`You landed next to ${esc(rescue.name)}!`}</h2>

    </div>
  `);
  /* ONE narration only: the story, then the question, then the choices.
     The cards are never read again — that was the double-up.     */
  if(autoRead) setTimeout(()=>nvcNarrate('feel'),300);

/* the whole chain, from the beginning up to wherever he has got to */
function nvcStory(upto){
  const n=rescue.name;
  const line=deEmoji(situationText());
  if(upto==='feel') return `${line} So, how does ${n} feel?`;
  if(upto==='need') return `${line} ${n} feels ${rescue.word}. So, what would ${n} love to have?`;
  if(upto==='req')  return `${line} ${n} feels ${rescue.word}, and needs ${rescue.need}. So, what will help ${n}?`;
  return line;
}
function nvcNarrate(step){
  stopSpeak();
  const list = step==='feel' ? quiz.feel.opts.map(o=>o[1])
             : step==='need' ? quiz.need.opts.map(o=>o[1])
             : quiz.req.opts.map(o=>o[1]).concat(['Or my own kind idea']);

}

   The full feeling → need → resolution story is a lot for every single

/* ═══════════ GROUNDING — help THE ANIMAL feel grounded ═══════════
   Different from the "shake it off" reset (which helps HIM after three
   misses): a standalone game where he leads a scared or upset animal
   through the same feet/breath/soften steps, so grounding is something he
   also practises doing FOR someone else, not only for himself. */
/* ═══════════ GROUNDING — practise WITH the animal, one body part at a time
   The animal is wound up, and the two of them settle it together: palm
   first, then face, then leg. He does each one on himself at the same time,
   which is the whole point — the animal gives him a reason to practise, and
   doing it together is what makes it work. One part per screen, never a
   list to remember. */
const GROUND_STEPS=[
  {em:'🤲', part:'PALM', t:'Feel your PALMS',
   say:'Put your palms together with {n}. Feel how warm they are. Press them, then let go.'},
  {em:'😌', part:'FACE', t:'Feel your FACE',
   say:'Now your face, with {n}. Let your forehead go soft. Let your jaw go loose.'},
  {em:'🦵', part:'LEGS', t:'Feel your LEGS',
   say:'Now your legs, with {n}. Press your feet down. Feel how strong and steady they are.'}
];
let ground=null;

     exercise has a reason before it has instructions */

    `${rescue.name} feels all wound up and fidgety. Wound-up bodies calm down one part at a time. Let us do it together.`,
    ()=>speakPlain(GROUND_STEPS[0].say.split('{n}').join(rescue.name))),250);

function renderGrounding(){

      </div>

  let wrongs=(sit.wrong||[]).map(w=>Array.isArray(w)?w:['🙅',w]);

/* ═══════════════════════════════════════════════════════════════════════════
   THE ANIMAL'S OWN VOICE
   ---------------------------------------------------------------------------
   The "what will help?" options are written ABOUT the animal ("Save them a
   seat"), because that is how the child reads them. The final sentence is
   spoken BY the animal, so the same words have to flip to first person, or a
   six-year-old hears the nonsense "I feel sad. I need a friend. Please be
   THEIR friend today." Twenty-three of the thirty-three situations read that
   way before this.
   ═══════════════════════════════════════════════════════════════════════════ */
function toFirstPerson(t){
  return String(t)
    .replace(/\bthemselves\b/gi,'myself')
    .replace(/\bthem\b/gi,'me')
    .replace(/\btheirs\b/gi,'mine')
    .replace(/\btheir\b/gi,'my')
    .replace(/\bthey are\b/gi,'I am')
    .replace(/\bthey feel\b/gi,'I feel')
    .replace(/\bthey\b/gi,'I')
    /* "with you" / "your game" are addressed TO the helper — they stay put */
    .replace(/\bI can feel\b/gi,'I feel');
}
function feelDone(bonus){
  suppressAutoRead=false;
  stopSpeak();
  const cls=rescue.own?' class="i"':'';
  /* a six-year-old is band 'y' — short, one idea per sentence, same as 't' */
  const simple=(band==='t'||band==='y');
  /* his OWN typed idea is already in his own words — leave it exactly as he
     wrote it. The built-in options get flipped into the animal's voice. */
  /* Only the FIRST letter is lowered, so the request joins "Please …" neatly
     without wrecking anything the author capitalised on purpose — a blanket
     toLowerCase() turned 'Say "I know you can do it"' into '"i know you can",
     and flattened the second sentence of a two-part request. A trailing full
     stop is dropped so the template's own one does not double up. */
  const joinable=t=>{
    t=String(t).trim().replace(/\.$/,'');
    return t.charAt(0).toLowerCase()+t.slice(1);
  };
  const ask=rescue.own ? rescue.req : toFirstPerson(joinable(rescue.req));
  const sent=simple
    ?`I feel <b>${esc(rescue.word.toLowerCase())}</b>. I need <b>${esc(rescue.need)}</b>. Please <b${cls}>${esc(ask)}</b>. Thank you! 💛`
    :`I feel <b>${esc(rescue.word.toLowerCase())}</b> because I need <b>${esc(rescue.need)}</b>. It helps when you <b${cls}>${esc(ask)}</b>.`;
  const spoken=simple
    ?`I feel ${rescue.word}. I need ${rescue.need}. Please ${ask}. Thank you!`
    :`I feel ${rescue.word} because I need ${rescue.need}. It helps when you ${ask}.`;
  /* ONE line, shown and spoken — drawing it twice would show one wording and
     say a different one */
  const thanks=understoodLine();
  challengeComplete(
    `${esc(rescue.name)} feels HEARD! ${esc(rescue.name)} says:`,
    sent+`<div class="hintline understood">💛 "${esc(thanks)}"</div>`,bonus);
  if(autoRead)setTimeout(()=>speakPlain(spoken,()=>speakPlain(thanks)),400);
}
/* ═══════════ THE POINT OF ALL OF IT ═══════════
   Said by the animal at the end of every feelings exercise. A six-year-old
   will reach for a fix long before he reaches for listening, so the animal
   keeps saying which one it actually wanted — not as a rule, as a thank you.
   Several wordings, so it lands as a real voice and not a slogan. */
const UNDERSTOOD_LINES=[
  'Thank you for listening first. A good friend understands me before they fix me. Being understood helps me most of all.',
  'Thank you. You listened before you helped. Feeling understood helps me even more than mending the problem.',
  'Thank you for hearing me. A good friend understands first. That helps more than fixing it.',
  'Thank you. You understood me. That is the bit that helps most — more than fixing anything.'
];
let understoodIdx=Math.floor(Math.random()*UNDERSTOOD_LINES.length);
function understoodLine(){
  /* walks the list rather than picking at random, so the same line never
     comes round twice in a row */
  understoodIdx=(understoodIdx+1)%UNDERSTOOD_LINES.length;
  return UNDERSTOOD_LINES[understoodIdx];
}
function understoodHTML(){
  return `<div class="hintline understood">💛 "${esc(understoodLine())}"</div>`;
}

function star(a,cx,cy,R,r,n){
  for(let i=0;i<n*2;i++){
    const ang=-Math.PI/2+i*Math.PI/n;
    const rad=i%2===0?R:r;
    const x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad;
    i===0?a.moveTo(x,y):a.lineTo(x,y);
  }
  a.closePath();
}

function drawTraceGuide(){
  const a=traceCtx;if(!a)return;
  a.save();
  a.strokeStyle='#C7CBE0';a.lineWidth=3;a.setLineDash([9,8]);a.lineCap='round';
  a.beginPath();traceList()[traceIdx][1](a);a.stroke();
  a.restore();
}
function initArtCanvas(){
  const c=document.getElementById('artcv');if(!c)return;
  const maxW=Math.min(360,window.innerWidth-64);
  c.style.width=maxW+'px';c.style.height=(maxW*250/340)+'px';
  const a=c.getContext('2d');traceCtx=a;
  a.fillStyle='#FFFFFF';a.fillRect(0,0,340,250);
  a.lineCap='round';a.lineJoin='round';
  drawTraceGuide();
  let last=null;
  const pos=e=>{
    const r=c.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:(t.clientX-r.left)*340/r.width,y:(t.clientY-r.top)*250/r.height};
  };
  const dot=p=>{a.fillStyle=artColor;a.beginPath();a.arc(p.x,p.y,artSize/2,0,Math.PI*2);a.fill();artDrawn=true;};
  const down=e=>{e.preventDefault();drawing=true;last=pos(e);dot(last);};
  const move=e=>{
    if(!drawing||!last)return;e.preventDefault();
    const p=pos(e);
    a.strokeStyle=artColor;a.lineWidth=artSize;
    a.beginPath();a.moveTo(last.x,last.y);a.lineTo(p.x,p.y);a.stroke();
    last=p;artDrawn=true;
  };
  c.addEventListener('touchstart',down,{passive:false});
  c.addEventListener('touchmove',move,{passive:false});
  c.addEventListener('touchend',artUp);
  c.addEventListener('touchcancel',artUp);
  c.addEventListener('mousedown',down);
  c.addEventListener('mousemove',move);
  window.addEventListener('mouseup',artUp);
}

const SPELL_WORDS={
  t:[['CAT','🐱'],['DOG','🐶'],['SUN','☀️'],['BEE','🐝'],['BUS','🚌'],['EGG','🥚'],['HAT','🎩'],['PIG','🐷']],

};
let spell=null;
function showSpelling(){
  /* an empty custom list is truthy, so check length — otherwise the
     destructure below blows up on undefined */
  const custom=CFG.spellWords&&CFG.spellWords[band];
  const list=(custom&&custom.length)?custom:(SPELL_WORDS[band]||SPELL_WORDS.y);
  const [word,em]=list[Math.floor(Math.random()*list.length)];
  /* 0 in the settings means "pick by age"; anything else is an override */
  const wanted=cfgNum('spellBlanks',0,0)||((band==='t'||band==='y')?1:(band==='m'?2:3));
  const nBlanks=Math.max(1,Math.min(word.length-1,Math.round(wanted)));
  const idxs=shuffle([...Array(word.length).keys()]).slice(0,nBlanks).sort((a,b)=>a-b);
  const missing=idxs.map(i=>word[i]);
  /* BUG FIX: the chip list used to be de-duplicated with a Set, so a word that
     needs the SAME letter twice (RABBIT → B,B) only ever got ONE chip. The chip
     was disabled after the first blank, and the puzzle became unwinnable.
     Now every blank gets its own chip, and the de-dupe only touches distractors. */
  const alpha='ABCDEFGHIJKLMNOPRSTUW';
  const pool=shuffle(alpha.split('').filter(l=>!missing.includes(l)));
  const distractors=[...new Set(pool)].slice(0,Math.max(2,6-missing.length));
  const choices=shuffle([...missing,...distractors]);
  spell={word,em,idxs,fillPos:0,choices};
  openModal(`
    <div class="spellpic">${em}</div>
    <h2>Help ${esc(rescue.name)} read this word!</h2>
    <p class="msub" id="spellQ">Look at the picture. Tap the letter${nBlanks>1?'s':''} that ${nBlanks>1?'are':'is'} missing.</p>
    <div class="wordrow">
      ${word.split('').map((ch,i)=>spell.idxs.includes(i)
        ?`<div class="letterbox blank${i===idxs[0]?' active':''}" id="lb${i}">_</div>`
        :`<div class="letterbox">${ch}</div>`).join('')}
    </div>
    <div class="letterchoices">
      ${choices.map((L,i)=>`<button class="lchip" id="lc${i}" onclick="tryLetter(${i})">${L}</button>`).join('')}
    </div>
    <button class="cta ghost" onclick="sayWord()">${SPK} Hear the word</button>
  `);
  /* say the word AFTER the question finishes reading, so the two voices
     never talk over each other */
  if(autoRead) autoReadIf('spellQ',()=>setTimeout(sayWord,350));
  else setTimeout(sayWord,600);
}
function tryLetter(i){
  if(!spell||spell.fillPos>=spell.idxs.length)return;
  const L=spell.choices[i];
  const target=spell.idxs[spell.fillPos];
  if(L===spell.word[target]){
    const box=document.getElementById('lb'+target);
    if(box){box.textContent=L;box.classList.remove('active');box.classList.add('filled');}
    /* only grey the chip out when no LATER blank still needs this letter */
    const stillNeeded=spell.idxs.slice(spell.fillPos+1).some(k=>spell.word[k]===L);
    if(!stillNeeded){
      const chip=document.getElementById('lc'+i);
      if(chip)chip.classList.add('used');
    }
    tone(600+spell.fillPos*120,0.12,'triangle',0.12);
    spell.fillPos++;
    if(spell.fillPos<spell.idxs.length){
      const nxt=document.getElementById('lb'+spell.idxs[spell.fillPos]);
      if(nxt)nxt.classList.add('active');
    }else{
      stats.spells++;streakUp();stopSpeak();sayWord();
      const w=spell.word,e=spell.em;
      setTimeout(()=>challengeComplete(
        `${esc(rescue.name)} can read it now! Say it with ${esc(rescue.name)}: <b style="background:var(--sun);border-radius:6px;padding:0 6px">${esc(w)}</b> ${e}`,null,0
      ),900);
    }
  }else{
    flowMiss(document.getElementById('lc'+i));
  }
}
function sayWord(){
  if(!spell||!soundOn)return;
  stopSpeak();                      /* keep the speech queue state honest */
  try{
    const u=new SpeechSynthesisUtterance(spell.word.toLowerCase());
    u.rate=0.7;u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ═══════════ 5) BELLY-BEAR BREATHING ═══════════
   purpose: 'rescue' (5 breaths) | 'freezeAll' (2 min) | 'repair' (3 breaths)
            | 'practice' (calm practice on a clear sky)                      */
let breath={active:false};
/* ---- phone-on-belly motion sensing ---- */
let motionHandler=null;
function startMotion(){
  breath.sensor=0;breath.sensorBase=null;breath.cycMin=99;breath.cycMax=-99;breath.verified=0;breath.hasMotion=false;
  const attach=()=>{
    motionHandler=e=>{
      if(!breath.active)return;
      const g=e.accelerationIncludingGravity;
      if(!g||g.z==null)return;
      breath.hasMotion=true;
      if(breath.sensorBase==null)breath.sensorBase=g.z;
      breath.sensorBase=breath.sensorBase*0.985+g.z*0.015;      /* slow baseline */
      const dev=g.z-breath.sensorBase;
      breath.sensor=breath.sensor*0.8+dev*0.2;                   /* smoothed belly motion */
      breath.cycMin=Math.min(breath.cycMin,breath.sensor);
      breath.cycMax=Math.max(breath.cycMax,breath.sensor);
    };
    window.addEventListener('devicemotion',motionHandler);
  };
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      DeviceMotionEvent.requestPermission().then(s=>{if(s==='granted')attach();}).catch(()=>{});
    }else attach();
  }catch(e){}
}
function stopMotion(){if(motionHandler){window.removeEventListener('devicemotion',motionHandler);motionHandler=null;}}

        <circle cx="169" cy="76" r="4" fill="#B07A44" stroke="#33305E" stroke-width="2.5"/>
        <circle cx="183" cy="76" r="4" fill="#B07A44" stroke="#33305E" stroke-width="2.5"/>
        <circle cx="173" cy="83" r="1.7" fill="#33305E"/>
        <circle cx="179" cy="83" r="1.7" fill="#33305E"/>
        <ellipse cx="176" cy="88" rx="3.4" ry="2.4" fill="#7A5537"/>
      </g>
    </svg>
    <div class="breathphase" id="brPhase">Breathe in… 🌬️</div>
    <div class="bellyMeterWrap">
      <span style="font-size:13px;font-weight:800">📱 tummy:</span>
      <div id="bellyMeter"><div id="bellyMeterFill"></div></div>
      <span class="verTicks" id="brVer"></span>
    </div>
    <div class="breathmeta">
      <span>🧸 breaths: <b id="brCount">0</b></span>
      <span>⏱️ <b id="brTime">--:--</b></span>
    </div>
    <div class="tinynote" id="brSensorNote">If the phone is on your tummy, the bar moves when YOU breathe!</div>
    <button class="cta ice" id="brDone" disabled onclick="finishBreath()">Keep breathing…</button>
  `);
  breathLoop();
}
let brRAF=null;
function breathLoop(){
  if(brRAF)cancelAnimationFrame(brRAF);
  let lastT=performance.now();
  const CYCLE=8; /* 4s in, 4s out */
  function frame(t){
    if(!breath.active)return;
    const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
    breath.left-=dt;breath.pt+=dt;
    const inPhase=(breath.pt%CYCLE)<4;
    if(inPhase&&breath.phase!=='in'){
      breath.phase='in';
      tone(300,3.6,'sine',0.05,0,430);
      const p=document.getElementById('brPhase');if(p)p.textContent='Breathe IN… tummy goes up 🌬️';
      /* voice-guided for the first 3 breaths (after the intro finishes) */
      if(breath.count<3&&breath.pt>6&&soundOn){stopSpeak();speakPlain('Breathe in… let your tummy go up… the bear goes up too…');}
    }else if(!inPhase&&breath.phase!=='out'){
      breath.phase='out';breath.count++;
      tone(430,3.8,'sine',0.05,0,260);
      const p=document.getElementById('brPhase');if(p)p.textContent='Breathe OUT… tummy goes down 😌';
      const c=document.getElementById('brCount');if(c)c.textContent=breath.count;
      if(breath.count<=3&&breath.pt>6&&soundOn){stopSpeak();speakPlain('Breathe out… slowly… the bear rides down…');}
      if(breath.count===3&&soundOn)setTimeout(()=>speakPlain('Lovely. Keep going, just like that.'),4200);
      /* verify a real belly breath from the phone sensor this cycle */
      if(breath.hasMotion){
        if((breath.cycMax-breath.cycMin)>0.30){
          breath.verified++;
          const v=document.getElementById('brVer');if(v)v.textContent='✅'.repeat(Math.min(5,breath.verified));
          tone(900,0.1,'triangle',0.09);
        }
        breath.cycMin=99;breath.cycMax=-99;
      }
    }
    /* live belly meter: real sensor if available, else follow the animation */
    const fill=document.getElementById('bellyMeterFill');
    if(fill){
      let pct;
      if(breath.hasMotion){pct=50+Math.max(-45,Math.min(45,breath.sensor*90));}
      else{pct=50+(Math.sin((breath.pt%CYCLE)/CYCLE*Math.PI*2-Math.PI/2))*42;}
      fill.style.width=pct+'%';
    }
    const note=document.getElementById('brSensorNote');
    if(note&&breath.pt>4&&!breath.hasMotion)note.textContent='No tummy sensor here — just watch the bear and breathe with it! 🧸';
    /* belly + bear animation: smooth sine */
    const s=Math.sin((breath.pt%CYCLE)/CYCLE*Math.PI*2-Math.PI/2)*0.5+0.5; /* 0..1, peaks mid-inhale */
    const belly=document.getElementById('belly');
    const bear=document.getElementById('bear');
    if(belly){belly.setAttribute('ry',26+14*s);belly.setAttribute('cy',146-6*s);}
    if(bear){bear.setAttribute('transform',`translate(0,${-20*s})`);}
    /* timer */
    const tm=document.getElementById('brTime');
    if(tm){const L=Math.max(0,Math.ceil(breath.left));tm.textContent=`${String(Math.floor(L/60))}:${String(L%60).padStart(2,'0')}`;}
    const btn=document.getElementById('brDone');
    const elapsed=breath.total-breath.left;
    if(btn&&btn.disabled&&elapsed>=breath.min){btn.disabled=false;btn.textContent='I feel calm now ✅';}
    if(breath.left<=0){finishBreath();return;}
    brRAF=requestAnimationFrame(frame);
  }
  brRAF=requestAnimationFrame(frame);
}
function stopBreath(){breath.active=false;stopMotion();if(brRAF){cancelAnimationFrame(brRAF);brRAF=null;}}
function finishBreath(){
  if(!breath.active)return;
  const purpose=breath.purpose;
  const verBonus=breath.verified>=3?CFG.realBreathBonus:0;
  stopBreath();stopSpeak();
  if(verBonus){addPoints(verBonus);updateHUD();toast(`📱 Real tummy breaths! +${verBonus}`,true);}
  if(purpose==='rescue'){
    stats.zens++;
    challengeComplete(`${esc(rescue.name)} is calm now, just like you. Calm is catching — and you gave yours away! 🧸💛`,null,0);
  }else{
    /* freezeAll / repair / practice each print their own card */
    challengeComplete();
  }
}

let shareAmt=10;

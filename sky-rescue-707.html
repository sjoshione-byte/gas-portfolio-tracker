function shareSpin(d){

function doShare(amt){

       short spoken line ARE the notification; then straight back to flying */
    clapSound();confettiBurst();

    closeModal();

let talkRound=0;
const TALK_ROUNDS=[
  {q:n=>`${n} needs help with a hard puzzle. What should ${n} say to the teacher?`,
   ok:['🙏','"Please can you help me?"'],
   wrong:[['😤','"HELP ME RIGHT NOW!"'],['🤐','…say nothing and hide the puzzle'],['😒','"This puzzle is silly!"']]},
  {q:n=>`It worked! The teacher helped. What should ${n} say now?`,
   ok:['💛','"Thank you!"'],

  {q:n=>`Oh no — ${n} bumped a friend’s tower by mistake. What should ${n} say?`,
   ok:['🥺','"Sorry! Can I help you build it again?"'],

function showTalk(){

}
function talkStep(){

    </div>

function pickTalk(i){
  if(!quiz.talk)return;
  if(i!==quiz.talk.correct){flowMiss(document.getElementById('tk'+i));return;}
  streakUp();kindActs++;
  talkRound++;

/* ═══════════════════════════════════════════════════════════════════════════
   🧠 MEMORY MATCH  —  flip two cards, find the pair, short and snappy
   ═══════════════════════════════════════════════════════════════════════════ */
const MEMORY_SETS=[['🦉','🦊','🐻','🐰'],['🌟','🌙','☀️','⛅'],['🍎','🍌','🍇','🍓'],['🚀','✈️','🎈','🪁']];
let mem=null;
function showMemory(){
  const set=MEMORY_SETS[Math.floor(Math.random()*MEMORY_SETS.length)];
  const deck=shuffle([...set,...set]).map((em,i)=>({em,i,up:false,done:false}));
  mem={deck,openIdx:[],pairs:0,busy:false};
  renderMemory();
  if(autoRead)speakPlain('Tap two cards. Find the two that match.');
}
function renderMemory(){
  openModal(`
    <div class="bigem">🧠</div>
    <h2>Find the pairs</h2>
    <p class="msub">Found: ${mem.pairs} of ${mem.deck.length/2}</p>
    <div class="memgrid">
      ${mem.deck.map(c=>`<button class="memcard ${c.up||c.done?'up':''} ${c.done?'done':''}"
        onclick="memFlip(${c.i})" ${c.up||c.done?'disabled':''}>${c.up||c.done?c.em:'❓'}</button>`).join('')}
    </div>
  `);
}
function memFlip(i){
  if(!mem||mem.busy)return;
  const c=mem.deck[i];
  if(c.up||c.done)return;
  c.up=true; tone(600,0.08,'triangle',0.09); renderMemory();
  mem.openIdx.push(i);
  if(mem.openIdx.length<2)return;
  mem.busy=true;
  const [a,b]=mem.openIdx;
  const match=mem.deck[a].em===mem.deck[b].em;
  setTimeout(()=>{
    if(!mem)return;
    if(match){
      mem.deck[a].done=mem.deck[b].done=true; mem.pairs++;
      tone(880,0.12,'triangle',0.11);
    }else{
      mem.deck[a].up=mem.deck[b].up=false;
      tone(220,0.1,'square',0.08);
    }
    mem.openIdx=[]; mem.busy=false;
    const won=mem.pairs>=mem.deck.length/2;
    if(won){ mem=null; challengeComplete(`🧠 You found them all! What a good memory, Captain ${esc(kidName||'Pilot')}! 💛`); }
    else renderMemory();
  },match?450:750);
}

/* ═══════════════════════════════════════════════════════════════════════════
   🎹 PIANO WITH PIP  —  a real keyboard, white keys and black
   ---------------------------------------------------------------------------
   This is a first piano lesson, not a memory game. The keyboard is laid out
   properly: seven white keys with their letter names, and the black keys
   raised above them in the group of two and the group of three that a child
   uses to find their way about a real piano. Every tune is written out above
   the keys as note names with finger numbers, so he READS the music while he
   plays it. Pip demonstrates; the child copies; Pip will play it again as
   many times as he likes. Pressing a wrong key is just part of finding your
   way, so it never counts as a failure.
   ═══════════════════════════════════════════════════════════════════════════ */
/* One octave of C, exactly as it sits on a real keyboard.
     white:true  → a lettered white key
     white:false → a black key, drawn between its two neighbours
   `pos` is the white-key index a black key sits after, so C♯ has pos 0
   (just right of C). This is what puts the black keys into their 2 + 3
   groups without any hand-placed pixel values. */
const PIANO_KEYS=[
  {n:'C',  say:'C',        f:261.63, white:true,  fing:1},
  {n:'C♯', say:'C sharp',  f:277.18, white:false, pos:0, fing:2},
  {n:'D',  say:'D',        f:293.66, white:true,  fing:2},
  {n:'D♯', say:'D sharp',  f:311.13, white:false, pos:1, fing:3},
  {n:'E',  say:'E',        f:329.63, white:true,  fing:3},
  {n:'F',  say:'F',        f:349.23, white:true,  fing:4},
  {n:'F♯', say:'F sharp',  f:369.99, white:false, pos:3, fing:2},
  {n:'G',  say:'G',        f:392.00, white:true,  fing:5},
  {n:'G♯', say:'G sharp',  f:415.30, white:false, pos:4, fing:3},
  {n:'A',  say:'A',        f:440.00, white:true,  fing:3},
  {n:'A♯', say:'A sharp',  f:466.16, white:false, pos:5, fing:4},
  {n:'B',  say:'B',        f:493.88, white:true,  fing:4},
  {n:'C²', say:'high C',   f:523.25, white:true,  fing:5}
];
const WHITE_IDX=PIANO_KEYS.map((k,i)=>k.white?i:-1).filter(i=>i>=0);
/* Tunes he will recognise, plus two that exist to TEACH something specific:
   walking up the scale, and finding the black keys. Each carries a one-line
   lesson, said and shown before he plays it. */
const PIANO_TUNES=[
  {name:'Twinkle Twinkle',       notes:[0,0,7,7,9,9,7],
   tip:'C C G G A A G. Start on C — the white key just left of the TWO black keys.'},
  {name:'Mary Had a Little Lamb',notes:[4,2,0,2,4,4,4],
   tip:'E D C D E E E. Three notes, side by side: C, D, E. Walk down, then back up.'},
  {name:'Hot Cross Buns',        notes:[4,2,0,4,2,0],
   tip:'E D C, twice. Just three white keys next to each other.'},
  {name:'Happy Birthday',        notes:[0,0,2,0,5,4],
   tip:'C C D C F E. The same note twice, then a step up.'},
  {name:'Row Row Row Your Boat', notes:[0,0,0,2,4,4,2],
   tip:'C C C D E E D. Stay on C, then step up one white key at a time.'},
  {name:'This Old Man',          notes:[7,4,7,4,9,7,4],
   tip:'G E G E A G E. Hop between G and E, skipping the key in between.'},
  {name:'Frère Jacques',         notes:[0,2,4,0,0,2,4,0],
   tip:'C D E C. Four white keys walking up, then back to the start.'},
  {name:'Walking Up the Scale',  notes:[0,2,4,5,7,9,11,12],
   tip:'C D E F G A B C. Every white key in a row — this is the C scale.'},
  {name:'Black Key Song',        notes:[1,3,1,3,6,8],
   tip:'The BLACK keys! Two together, then three together. Find the two first.'}
];
let piano=null;
function showPattern(){
  const t=PIANO_TUNES[Math.floor(Math.random()*PIANO_TUNES.length)];
  /* only as many notes as the age band can hold in mind at once */
  const len=(band==='t')?3:(band==='y'?5:t.notes.length);
  piano={tune:t, notes:t.notes.slice(0,len), input:0, busy:true, round:1, replays:0};
  renderPiano('"Watch my paws," says Pip. "Then you play it back to me."','pip');
  if(autoRead&&!suppressAutoRead){
    setTimeout(()=>speakPlain(t.tip,()=>pipPlays()),300);
  }else setTimeout(pipPlays,500);
}
/* the keyboard, drawn to scale: white keys side by side, black keys sitting
   over the crack between two whites, exactly as on a real piano */
function keyboardHTML(who){
  const nW=WHITE_IDX.length;
  const WW=100/nW;                       /* white-key width, in % */
  const BW=WW*0.62;                      /* a black key is narrower */
  const parts=[];
  PIANO_KEYS.forEach((k,i)=>{
    const on=(who==='you');
    const isNext=on&&piano&&piano.notes[piano.input]===i;
    if(k.white){
      const w=WHITE_IDX.indexOf(i);
      parts.push(`<button class="pkey white${on?'':' pip'}${isNext?' next':''}" id="pk${i}"
        style="left:${w*WW}%;width:${WW}%" onclick="pianoPress(${i})"${on?'':' disabled'}>
        <span class="dot"></span>${k.n}<span class="fing">${k.fing}</span></button>`);
    }else{
      /* centred on the join between white key `pos` and the next one */
      const left=(k.pos+1)*WW-BW/2;
      parts.push(`<button class="pkey black${on?'':' pip'}${isNext?' next':''}" id="pk${i}"
        style="left:${left}%;width:${BW}%" onclick="pianoPress(${i})"${on?'':' disabled'}>
        <span class="dot"></span>${k.n}</button>`);
    }
  });
  return parts.join('');
}
/* the tune written out — note name, finger number, and where he is up to */
function staffHTML(who){
  return piano.notes.map((n,i)=>{
    const k=PIANO_KEYS[n];
    const state=(who==='you')?(i<piano.input?'done':(i===piano.input?'now':'')):'';
    return `<span class="snote ${k.white?'':'black'} ${state}">${k.n}<small>${k.fing}</small></span>`;
  }).join('');
}
function renderPiano(msg,who){
  const p=piano;
  openModal(`
    <h2>${esc(p.tune.name)} 🎹</h2>
    <div class="pianotip">🦊 ${esc(p.tune.tip)}</div>
    <div class="staff">${staffHTML(who)}</div>
    <div class="pianocase">
      <div class="pianokeys${who==='you'?'':' locked'}" id="pnKeys">${keyboardHTML(who)}</div>
      <div class="pianonote" id="pnNote">${who==='you'?'YOUR TURN':'PIP IS PLAYING…'}</div>
    </div>
    <p class="msub" id="pnQ">${esc(msg)}</p>
    <button class="cta ghost" id="pnAgain" onclick="pipPlayAgain()"${who==='you'?'':' disabled'}>🦊 Pip, play it again 🔁</button>
  `);
}
/* light a key and sound it — the same helper for Pip and for the child, so
   what he sees Pip do is exactly what he then does himself */
function pianoStrike(i,dur){
  const b=document.getElementById('pk'+i);
  if(b){b.classList.add('lit');setTimeout(()=>b.classList.remove('lit'),Math.max(140,dur*700));}
  tone(PIANO_KEYS[i].f,dur,'triangle',0.16,0,PIANO_KEYS[i].f*0.996);
}
/* he can ask for the tune again as often as he likes — asking to hear it
   once more is exactly what a learner should do, so it costs nothing */
function pipPlayAgain(){
  if(!piano||piano.busy)return;
  piano.replays++;
  pipPlays();
}
function pipPlays(){
  if(!piano)return;
  piano.busy=true;piano.input=0;
  renderPiano('Watch which keys Pip presses, and listen.','pip');
  let i=0;
  const step=()=>{
    if(!piano)return;
    if(i>=piano.notes.length){
      piano.busy=false;
      renderPiano('Now you play it. Follow the notes above the keys.','you');
      speakPlain('Your turn. Follow the note names.');
      return;
    }
    const k=PIANO_KEYS[piano.notes[i]];
    pianoStrike(piano.notes[i],0.34);
    const note=document.getElementById('pnNote');
    if(note)note.textContent='PIP: '+k.n;
    i++;setTimeout(step,540);
  };
  setTimeout(step,350);
}
function pianoPress(i){
  if(!piano||piano.busy)return;
  pianoStrike(i,0.26);
  const k=PIANO_KEYS[i];
  const note=document.getElementById('pnNote');
  if(note)note.textContent='YOU: '+k.n;
  if(piano.notes[piano.input]!==i){
    /* Hunting for a key is HOW you learn a keyboard, so a wrong press is
       never a failure here — no strike, no reset. It just says which note
       to look for, and the tune is always one button away. */
    softMiss(document.getElementById('pk'+i));
    const want=PIANO_KEYS[piano.notes[piano.input]];
    if(note)note.textContent='LOOK FOR '+want.n;
    speakNotice('That one is '+k.say+'. You want '+want.say+'.');
    return;
  }
  piano.input++;
  const done=piano.input>=piano.notes.length;
  if(!done){
    renderPiano('Keep going — you are playing it!','you');
    return;
  }
  piano.busy=true;
  if(piano.round>=cfgNum('patternRounds',2,1)){
    const nm=piano.tune.name, tip=piano.tune.tip;
    piano=null;
    confettiBurst();
    challengeComplete(
      `🎹 You played <b>${esc(nm)}</b>, Captain ${esc(kidName||'Pilot')}!`,
      `<div class="pianotip">🦊 "You read the notes and found them all," says Pip. "${esc(tip)}"</div>`,
      0,true);
    return;
  }
  /* another round: a longer stretch of the same tune, so it grows */
  piano.round++;
  const full=piano.tune.notes;
  if(piano.notes.length<full.length)piano.notes=full.slice(0,piano.notes.length+1);
  setTimeout(()=>{ if(piano)pipPlays(); },800);
}

/* ═══════════ INVENTOR PUZZLES WITH PIP — four real TRIZ tools, child-sized ═══
   🔀 Both At Once        (contradiction)      — "strong AND light? We want both!"
   ✨ The Magic Wish       (ideal final result) — "what if it fixed itself?"
   🧺 What Is Already Here? (resources)         — "the answer is lying right there"
   🔄 Turn It Around       (inversion)          — "try it the other way round"    */
const TRIZ_TOOLS={
  both:{em:'🔀',title:'Both At Once!',
    intro:'"Yummy puzzle!" says Pip. "We want BOTH things at the same time. Most people pick one. Inventors find both!"'},
  wish:{em:'✨',title:'The Magic Wish',
    intro:'"Make a magic wish," says Pip. "What if the problem fixed itself, all on its own?"'},
  here:{em:'🧺',title:'What Is Already Here?',
    intro:'"Look around first," says Pip. "The best answer is often right next to you, for free."'},
  flip:{em:'🔄',title:'Turn It Around!',
    intro:'"When you are stuck," says Pip, "flip it! Try it the other way round."'}
};
const TRIZ_PUZZLES=[
 {tool:'both', tx:'{N} needs a bridge that is STRONG so it holds everyone, and LIGHT so we can carry it. Strong means heavy. Light means weak. We want both!',
  ok:'Use hollow tubes — the air inside makes them light, and the round shape keeps them strong',
  wrong:['Use heavy stone — nobody can lift it','Use paper — it is light, but it snaps']},
 {tool:'both', tx:'{N} wants the fire CLOSE to stay warm, and FAR so nobody gets burnt. Close and far, both at once!',
  ok:'Put a ring of stones round the fire — you sit close, and the stones keep everyone safe',
  wrong:['Sit right on top of the fire','Put the fire far away and shiver']},
 {tool:'both', tx:'{N} wants the door OPEN so friends can come in, and SHUT so the cold wind stays out.',
  ok:'Hang soft leafy strips in the doorway — friends walk through, the wind cannot',
  wrong:['Leave the door wide open and freeze','Lock the door so no friend can come in']},
 {tool:'wish', tx:'{N} is tired of watering the garden every day. Make a magic wish: what if the garden watered ITSELF?',
  ok:'Plant the garden where the roof drips — every rain waters it, all by itself',
  wrong:['Stop watering and let the plants dry up','Shout at the plants to grow faster']},
 {tool:'wish', tx:'The ducklings keep wandering off. Magic wish: what if they stayed together all by themselves?',
  ok:'Let mother duck walk in front — the ducklings follow her on their own',
  wrong:['Chase every duckling all day long','Tell the ducklings a rule they cannot remember']},
 {tool:'wish', tx:'{N}’s toys are all over the floor at bedtime. Magic wish: what if tidying happened by itself?',
  ok:'Play INSIDE a big blanket — at bedtime lift the corners, and every toy is already together',
  wrong:['Never play with toys again','Push the mess under the bed and hope']},
 {tool:'here', tx:'{N} needs to cross the stream. There is no bridge. Look around — what is already here, for free?',
  ok:'The fallen log! Lay it across and walk over',
  wrong:['Order a bridge and wait ten years','Cry until the stream dries up']},
 {tool:'here', tx:'Rain is coming and {N} has no umbrella. Look around — what is already here?',
  ok:'That giant leaf makes a free umbrella',
  wrong:['Stand in the rain and get soaked','Walk all the way to a shop, in the rain']},
 {tool:'here', tx:'{N} wants to move a big pile of apples down the hill. There is no cart. What is already here?',
  ok:'The hill! Roll the apples gently down — the hill does the carrying',
  wrong:['Carry one apple at a time, all day','Leave all the apples to go bad']},
 {tool:'flip', tx:'{N} cannot pull the heavy sledge UP the hill. Turn it around — what is the other way?',
  ok:'Start at the TOP — then the sledge only slides DOWN, all by itself',
  wrong:['Pull harder until your arms hurt','Never go sledging again']},
 {tool:'flip', tx:'The jar lid is stuck and {N} cannot twist it off. Flip it — try the other way round!',
  ok:'Hold the LID still and twist the JAR instead',
  wrong:['Squeeze the lid tighter and tighter','Throw the jar on the floor']},
 {tool:'flip', tx:'{N} keeps losing at tag by RUNNING AWAY from everyone. Turn it around!',
  ok:'Stand still near base and jump aside at the last moment — let the chaser get tired',
  wrong:['Run faster and faster until you fall over','Never play tag again']}
];
let trz=null;
function showTriz(){
  const p=TRIZ_PUZZLES[Math.floor(Math.random()*TRIZ_PUZZLES.length)];
  const tool=TRIZ_TOOLS[p.tool];
  const opts=shuffle([p.ok,...p.wrong]);

    </div>

function pickTriz(i){
  if(!trz)return;
  if(i!==trz.correct){flowMiss(document.getElementById('tz'+i));return;}
  streakUp();stats.ideas=(stats.ideas||0)+1;

    both:'You got BOTH at once — that is a real inventor trick!',
    wish:'The problem fixes ITSELF. That is the best kind of answer!',
    here:'You used what was already there, for free!',
    flip:'You turned it around — and it came unstuck!'

/* ═══════════ ARCHERY WITH PIP THE POLITE FOX ═══════════
   Turn-taking (Pip insists YOU go first), a visible waiting turn while Pip
   shoots, targets that shrink as you level up, and a kind loss:
   "Not yet! What will you try next time?"                                   */
let arch=null;
/* HALF the target width, as a % of the box — the SAME unit the arrow marker
   uses. BUG FIX: the old code measured the target in pixels but the arrow in
   percent, so a shot that clearly missed on screen still scored points.     */
function archTargetPct(){
  const base={t:26,y:20,m:15,o:11}[band]||20;
  return Math.max(4, base - level()*1.2);
}
/* Both archers are always on screen. Whoever's turn it is stands up with a bow;
   the other one visibly SITS DOWN and rests. Turn-taking you can see.        */
function archStage(turn, note){
  const youUp = turn==='you';
  return `
  <div class="archstage">
    <div class="archer ${youUp?'active':'resting'}">
      <div class="archface">🧑‍✈️</div>
      <div class="archbow">${youUp?'🏹':'💤'}</div>
      <div class="archname">${esc(kidName||'You')}</div>
      <div class="archstate">${youUp?'YOUR TURN':'resting'}</div>
    </div>
    <div class="archvs">🎯</div>
    <div class="archer ${!youUp?'active':'resting'}">
      <div class="archface">🦊</div>
      <div class="archbow">${!youUp?'🏹':'💤'}</div>
      <div class="archname">Pip</div>
      <div class="archstate">${!youUp?'PIP&rsquo;S TURN':'resting'}</div>
    </div>
  </div>
  <div class="archnote" id="arNote">${note||''}</div>`;
}
function showArchery(){
  arch={round:0, you:0, pip:0, running:false, dir:1, pos:0, locked:true, turn:'you'};
  openModal(`
    <div class="bigem">🏹🦊</div>
    <h2>Archery with Pip</h2>
    <div class="speech" id="arQ">"You go first!" says Pip.</div>
    <div id="archTop">${archStage('you','Pip is resting. Take your shot.')}</div>
    <div id="archbox"></div>
    <div class="scoreline" id="arScore">You 0 · 🦊 Pip 0</div>
    <button class="cta" id="arBtn" onclick="archShoot()">Shoot! 🏹</button>
  `);
  /* one path only — the old code could start the round twice */
  if(autoRead&&!suppressAutoRead) autoReadIf('arQ',archStart);
  else setTimeout(archStart,300);
}
function archSetTurn(turn,note){
  if(!arch)return;
  arch.turn=turn;
  const t=document.getElementById('archTop');
  if(t)t.innerHTML=archStage(turn,note);
}
function archStart(){
  if(!arch)return;
  arch.running=true;arch.locked=false;arch.pos=0;arch.dir=1;
  archSetTurn('you','Pip is resting 😴 — line up your shot!');
  archRender();
  archLoop();
}
function archRender(){
  const box=document.getElementById('archbox');
  if(!box)return;
  const half=archTargetPct();
  box.innerHTML=`
    <div style="position:relative;height:52px;border:3px solid var(--ink);border-radius:16px;
                background:linear-gradient(90deg,#FFD6CE,#FFF3D6,#B9E8D8,#FFF3D6,#FFD6CE);overflow:hidden">
      <div style="position:absolute;left:50%;top:0;bottom:0;width:${half*2}%;transform:translateX(-50%);
                  background:rgba(255,180,50,.75);border-left:3px solid var(--ink);border-right:3px solid var(--ink)"></div>
      <div style="position:absolute;left:50%;top:0;bottom:0;width:${half*0.8}%;transform:translateX(-50%);
                  background:rgba(255,120,40,.55)"></div>
      <div id="arMark" style="position:absolute;top:2px;bottom:2px;width:6px;background:#33305E;border-radius:3px;left:50%"></div>
    </div>`;
}
let archRAF=null;
function archLoop(){
  if(archRAF)cancelAnimationFrame(archRAF);
  const speed=0.9+level()*0.12;
  const step=()=>{
    if(!arch||!arch.running)return;
    arch.pos+=arch.dir*speed;
    if(arch.pos>100){arch.pos=100;arch.dir=-1;}
    if(arch.pos<-100){arch.pos=-100;arch.dir=1;}
    const m=document.getElementById('arMark');
    if(m)m.style.left=`calc(50% + ${arch.pos*0.46}%)`;
    archRAF=requestAnimationFrame(step);
  };
  archRAF=requestAnimationFrame(step);
}
function archStop(){ if(arch)arch.running=false; if(archRAF){cancelAnimationFrame(archRAF);archRAF=null;} }
function archShoot(){
  if(!arch||arch.locked||!arch.running)return;
  archStop();
  const half=archTargetPct();
  const off=Math.abs(arch.pos*0.46);        /* same % unit as the drawn target */
  /* a real MISS scores 0 — before, every shot scored at least 1 point
     whether or not the arrow landed anywhere near the target */
  const hit=off<=half;
  const bullseye=off<=half*0.4;
  const pts=hit?(bullseye?3:2):0;
  arch.you+=pts;
  tone(hit?900:300,0.14,'triangle',0.11);
  const sc=document.getElementById('arScore');
  if(sc)sc.textContent=`You ${arch.you} · 🦊 Pip ${arch.pip}`;
  const btn=document.getElementById('arBtn');
  if(btn){btn.disabled=true;btn.textContent=bullseye?'Bullseye! 🎯':hit?'2 points 🏹':'Missed 🏹';}
  arch.locked=true;
  /* SHORT · KIND · RIGHT NOW — one line, said once */
  speakPlain(hit?`${praise()} ${pts} points!`:'Missed. Now it is Pip’s turn.');

  /* ── THE HANDOVER: quick and easy to see. Pip stands up, shoots, sits back
     down — one spoken line for the whole swap, not three. ── */
  setTimeout(()=>{
    if(!arch)return;
    archSetTurn('pip','🦊 Pip is shooting… 🏹');
    const b=document.getElementById('arBtn');
    if(b){b.disabled=true;b.className='cta ghost';b.textContent='Pip is shooting… ⏳';}
    tone(520,0.12,'sine',0.08);
    setTimeout(()=>{
      if(!arch)return;
      const pipHit=Math.random()<0.72;
      const pipPts=pipHit?(Math.random()<0.4?3:2):0;
      arch.pip+=pipPts;
      tone(pipHit?880:300,0.14,'triangle',0.1);
      const sc2=document.getElementById('arScore');
      if(sc2)sc2.textContent=`You ${arch.you} · 🦊 Pip ${arch.pip}`;
      const n=document.getElementById('arNote');
      if(n)n.textContent=pipPts?`🦊 Pip got ${pipPts}!`:'🦊 Pip missed!';
      speakPlain(pipPts?`Pip got ${pipPts}.`:'Pip missed.');
      arch.round++;
      setTimeout(()=>{
        if(!arch)return;
        if(arch.round>=cfgNum('archeryRounds',3,1)){ archFinish(); return; }
        archSetTurn('you',`Round ${arch.round+1} of ${cfgNum('archeryRounds',3,1)} — your turn!`);
        const b2=document.getElementById('arBtn');
        if(b2){b2.disabled=false;b2.className='cta';b2.textContent='Shoot! 🏹';}
        archStart();
      },900);
    },900);
  },500);
}
function archFinish(){
  if(!arch)return;
  archStop();
  const you=arch.you,pip=arch.pip;
  if(you>=pip){
    arch=null;
    challengeComplete(`🏹 You ${you} · Pip ${pip}. "You won it fair and square!" cheers Pip — and ${esc(rescue.name)} gets the prize! 🦊💛`);
  }else{
    openModal(`
      <div class="bigem">🦊🏹</div>
      <h2>Pip won this one!</h2>
      <div class="scoreline">You ${you} · 🦊 Pip ${pip}</div>
      <p class="msub" id="arLose">Not yet! What will you try next time? "Every time you lose, you get a bit better," says Pip.</p>
      <div class="stack">
        <button class="rowcard idea" onclick="showArchery()"><span class="em">🔁</span>Try again!</button>
        <button class="rowcard" onclick="archConcede()"><span class="em">🤝</span>Say "well done, Pip"</button>
      </div>
    `);
    autoReadIf('arLose');
  }
}
function archConcede(){
  arch=null;
  kindActs++;
  challengeComplete(`You said "Well done, Pip!" and you meant it. Being a good sport is a superpower. 🤝💛`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   9) JIGSAW WITH PIP  —  taking turns with Pip the Polite Fox
   ---------------------------------------------------------------------------
   A REAL jigsaw: one picture, genuinely cut up. Every slot and every loose
   piece is a different window onto the same big drawing — each piece is
   rendered from the whole picture, shifted so only its own part shows — so
   the pieces truly belong together and can be matched by looking rather than
   by remembering. The finished picture sits beside the board like the lid of
   a jigsaw box, with the hole he is filling marked on it, which is exactly
   how a child works a real puzzle.
   You and Pip put it together TAKING TURNS: he places one, you place one.
   ═══════════════════════════════════════════════════════════════════════════ */
const JIGSAWS=[
  {id:'rocket',    name:'a rocket',    em:'🚀'},
  {id:'sunflower', name:'a sunflower', em:'🌻'},
  {id:'butterfly', name:'a butterfly', em:'🦋'},
  {id:'rainbow',   name:'a rainbow',   em:'🌈'},
  {id:'lion',      name:'a lion',      em:'🦁'},
  {id:'cake',      name:'a birthday cake', em:'🎂'},
  {id:'turtle',    name:'a turtle',    em:'🐢'},
  {id:'castle',    name:'a castle',    em:'🏰'},
  {id:'world',     name:'the whole world', em:'🌍'},
  {id:'tiger',     name:'a tiger',     em:'🐯'}
];
/* how big the assembled picture is drawn, and how it is cut */
const JIG_SIZE=156;
function jigGrid(){ return (band==='t')?{c:2,r:2}:(band==='y'?{c:3,r:2}:{c:3,r:3}); }
let jig=null;
function showBuild(){
  const d=JIGSAWS[Math.floor(Math.random()*JIGSAWS.length)];
  const g=jigGrid(), n=g.c*g.r;
  /* piece k is the fragment of the picture at column k%c, row k/c */
  jig={def:d, grid:g, slots:Array(n).fill(null),
       tray:shuffle([...Array(n).keys()]), turn:'pip', busy:false};
  openModal(`
    <div class="bigem">${rescue.em}${d.em}</div>
    <h2>A jigsaw with Pip!</h2>
    <div class="speech" id="bdQ">${esc(rescue.name)} dropped a picture of ${d.name} and it broke into ${n} pieces. Pip the Fox will help you mend it. You take turns: Pip, then you, then Pip, then you.</div>
    ${jigRefHTML(-1)}
    <button class="cta" onclick="jigBegin()">Start the jigsaw 🧩</button>
  `);
  autoReadIf('bdQ',()=>speakPlain('Look at the whole picture first. Then we take turns. Pip goes first.'));
}
function jigBegin(){ if(jig)jigTurn(); }
/* the first hole still waiting for a piece */
function jigNextSlot(){ return jig.slots.findIndex(s=>s===null); }
/* one window onto the picture: the whole thing drawn at full size inside a
   small box, slid so that only piece `k` shows through */
function jigFragHTML(k,cellW,cellH){
  const g=jig.grid;
  const col=k%g.c, row=Math.floor(k/g.c);
  const fullW=cellW*g.c, fullH=cellH*g.r;
  /* the picture FILLS the frame — scaled to the long side, so it is cropped
     rather than letterboxed. Sized any smaller and the corner pieces come out
     blank, which makes them impossible to place by looking. */
  const size=jigArtSize(fullW,fullH);
  return `<div class="jigart" style="width:${fullW}px;height:${fullH}px;
    transform:translate(${-col*cellW}px,${-row*cellH}px);font-size:${size}px">${jig.def.em}</div>`;
}
/* one scale rule, shared by the board, the loose pieces and the reference, so
   a fragment looks the same wherever it is drawn */
function jigArtSize(w,h){ return Math.max(w,h)*1.04; }
/* the finished picture, with the hole he is filling marked on it */
function jigRefHTML(wantSlot){
  const g=jig.grid;
  const w=96, h=Math.round(96*g.r/g.c);
  const size=jigArtSize(w,h);
  return `<div class="jigref" style="margin:0 auto 8px">
    <div class="jigrefbox" style="width:${w}px;height:${h}px">
      <div class="jigart" style="width:${w}px;height:${h}px;font-size:${size}px">${jig.def.em}</div>
      <div class="jigrefgrid" style="grid-template-columns:repeat(${g.c},1fr);grid-template-rows:repeat(${g.r},1fr)">
        ${Array(g.c*g.r).fill(0).map((_,i)=>`<div class="jigrefcell${i===wantSlot?' want':''}"></div>`).join('')}
      </div>
    </div>
    <div class="jigreflbl">${wantSlot>=0?'this bit ↑':'the finished picture'}</div>
  </div>`;
}
function jigBoard(){
  const next=jigNextSlot();
  const g=jig.grid;
  const cw=Math.round(JIG_SIZE/g.c), ch=Math.round(JIG_SIZE/g.c); /* square pieces */
  /* loose pieces are drawn a little smaller so a full tray still fits */
  const tw=Math.round(cw*0.82), th=Math.round(ch*0.82);
  return `<div class="buildwrap">
    <div class="jigwho">
      <span class="tag ${jig.turn==='pip'?'on':''}">🦊 Pip</span>
      <span class="tag ${jig.turn==='you'?'on':''}">🧑‍✈️ You</span>
    </div>
    <div class="jigwrap">
      <div class="jigboard" style="grid-template-columns:repeat(${g.c},${cw}px)">
        ${jig.slots.map((s,i)=>`<div class="jigcell ${i===next?'next':''}" style="width:${cw}px;height:${ch}px">
          ${s!==null?jigFragHTML(s,cw,ch):''}</div>`).join('')}
      </div>
      ${jigRefHTML(next)}
    </div>
    <div class="jigtray">
      ${jig.tray.map((k,i)=>`<button class="jigpiece${jig.turn==='you'?'':' locked'}" id="jp${i}"
        style="width:${tw}px;height:${th}px" onclick="jigPlace(${i})">${jigFragHTML(k,tw,th)}</button>`).join('')}
    </div>
  </div>`;
}
function jigTurn(){
  if(!jig)return;
  if(jigNextSlot()<0){ jigDone(); return; }
  if(jig.turn==='pip'){ jigPipTurn(); return; }
  openModal(`
    <h2>Your turn! 🧩</h2>
    ${jigBoard()}
    <p class="msub" id="bdY">Look at the glowing hole, and at the marked bit of the picture. Which piece is it? Tap it.</p>
  `);
  autoReadIf('bdY');
}
function jigPipTurn(){
  jig.busy=true;
  const slot=jigNextSlot();
  openModal(`
    <h2>Pip’s turn 🦊</h2>
    ${jigBoard()}
    <p class="msub" id="bdW">"My turn — I am looking for my piece," says Pip. "You wait, and then it is you."</p>
  `);
  autoReadIf('bdW');
  tone(500,0.1,'triangle',0.08);
  setTimeout(()=>{
    if(!jig)return;
    /* Pip finds the piece that fits and puts it in */
    const ti=jig.tray.indexOf(slot);
    if(ti>=0)jig.tray.splice(ti,1);
    jig.slots[slot]=slot;
    jig.busy=false;
    tone(760,0.12,'triangle',0.1);
    if(jigNextSlot()<0){ jigDone(); return; }
    jig.turn='you';
    jigTurn();
    speakPlain('In it goes. Your turn now.');
  },1900);
}
function jigPlace(i){
  if(!jig||jig.busy||jig.turn!=='you')return;
  const slot=jigNextSlot();
  if(slot<0)return;
  const k=jig.tray[i];
  if(k!==slot){
    /* Trying a piece that turns out not to fit is how a jigsaw is DONE, so
       it costs nothing here — no strike, no reset, just put it back. */
    softMiss(document.getElementById('jp'+i));
    speakNotice('Not that one. Look at the marked bit of the picture.');
    return;
  }
  jig.tray.splice(i,1);
  jig.slots[slot]=k;
  streakUp();
  tone(880,0.12,'triangle',0.1);
  kindActs++;
  if(jigNextSlot()<0){ jigDone(); return; }
  jig.turn='pip';
  jigTurn();
}
function jigDone(){
  const d=jig.def;
  jig=null;
  confettiBurst();
  /* points go through challengeComplete so the card shows the real number */
  challengeComplete(
    `${d.em} You and Pip mended the picture of ${d.name}! "We took turns," says Pip, "and it worked."`,
    null, CFG.teamBonus
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   10) SAY IT RIGHT  —  listening practice
   ---------------------------------------------------------------------------
   The word is shown as a picture. The choices are spoken one after the other.
   Only ONE says it properly — the others are close but wrong. He taps the one
   that sounded right. Short, common words for a six-year-old.
   ═══════════════════════════════════════════════════════════════════════════ */

let say=null;
function showSayIt(){
  const pool=SAY_WORDS[band]||SAY_WORDS.y;
  const item=pool[Math.floor(Math.random()*pool.length)];
  const opts=shuffle([{t:item.w,ok:true}, ...item.wrong.map(x=>({t:x,ok:false}))]);
  say={item, opts, played:-1, tries:0};
  openModal(`
    <div class="spellpic">${item.pic}</div>

      ${opts.map((o,i)=>`<button class="rowcard sayopt" id="sy${i}" onclick="pickSay(${i})">
          <span class="em" id="syn${i}">${i+1}</span>
          <b>Listen, then choose</b>
          <span class="rspk" onclick="event.stopPropagation();saySample(${i})"></span>
        </button>`).join('')}
    </div>
    <button class="cta ghost" onclick="playAllSay()">🔁 Play them again</button>
  `);
  document.querySelectorAll('#syOpts .rspk').forEach(e=>{if(!e.innerHTML)e.innerHTML=SPK;});
  autoReadIf('syQ',()=>setTimeout(playAllSay,400));
  if(!autoRead)setTimeout(playAllSay,600);
}
/* speak one option, highlighting it as it plays */
function saySample(i){
  if(!say||!soundOn)return;
  stopSpeak();
  const el=document.getElementById('sy'+i);
  document.querySelectorAll('.sayopt').forEach(e=>e.classList.remove('playing'));
  if(el)el.classList.add('playing');
  const txt=say.opts[i].t;
  try{
    const u=new SpeechSynthesisUtterance(txt);
    u.rate=0.75;u.pitch=1.05;
    u.onend=u.onerror=()=>{ if(el)el.classList.remove('playing'); };
    speechSynthesis.speak(u);
  }catch(e){ if(el)el.classList.remove('playing'); }
}
/* play every option in turn, so he hears them one after another */
function playAllSay(){
  if(!say||!soundOn)return;
  stopSpeak();
  let i=0;
  const next=()=>{
    if(!say||i>=say.opts.length)return;
    const idx=i++;
    const el=document.getElementById('sy'+idx);
    document.querySelectorAll('.sayopt').forEach(e=>e.classList.remove('playing'));
    if(el)el.classList.add('playing');
    try{
      const u=new SpeechSynthesisUtterance(say.opts[idx].t);
      u.rate=0.75;u.pitch=1.05;
      u.onend=u.onerror=()=>{ if(el)el.classList.remove('playing'); setTimeout(next,550); };
      speechSynthesis.speak(u);
    }catch(e){ setTimeout(next,700); }
  };
  next();
}
function pickSay(i){
  if(!say)return;
  if(!say.opts[i].ok){
    say.tries++;
    flowMiss(document.getElementById('sy'+i));
    saySample(i);                              /* hear the wrong one again */
    setTimeout(()=>{
      if(!say)return;
      const right=say.opts.findIndex(o=>o.ok);
      speakPlain('Listen again.',()=>saySample(right));
    },1400);
    return;
  }
  stopSpeak();
  streakUp();
  stats.spells++;
  const w=say.item.w,pic=say.item.pic;
  say=null;
  challengeComplete(`🔊 Yes — <b>${esc(w)}</b>! Now ${esc(rescue.name)} can say it too. ${pic}`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   11) TIC-TAC-TOE with Pip
   Turn-taking again. Pip is beatable but not silly, he cheers when you win,
   and a draw is a good fair game — not a loss.
   ═══════════════════════════════════════════════════════════════════════════ */
let ttt=null;
const TTT_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(b){
  for(const [a,c,d] of TTT_LINES){
    if(b[a]&&b[a]===b[c]&&b[a]===b[d])return {who:b[a],line:[a,c,d]};
  }
  return b.every(x=>x)?{who:'draw',line:[]}:null;
}
function showTicTac(){
  ttt={board:Array(9).fill(''), turn:'you', over:false, note:'You are ❌. Pip is ⭕. You go first!'};
  renderTtt();
  speakPlain('Tic tac toe with Pip. You are the crosses. You go first.');
}
function renderTtt(){
  if(!ttt)return;
  const w=tttWinner(ttt.board);
  const win=(w&&w.line)?w.line:[];
  openModal(`
    <div class="bigem">⭕❌</div>
    <h2>Tic-tac-toe with Pip</h2>
    <div class="tttturn">
      <div class="tttp ${ttt.turn==='you'&&!ttt.over?'active':'resting'}">
        <div class="tttface">🧑‍✈️</div><div class="tttname">${esc(kidName||'You')} ❌</div>
        <div class="tttstate">${ttt.turn==='you'&&!ttt.over?'YOUR TURN':'waiting'}</div>
      </div>
      <div class="tttvs">🎲</div>
      <div class="tttp ${ttt.turn==='pip'&&!ttt.over?'active':'resting'}">
        <div class="tttface">🦊</div><div class="tttname">Pip ⭕</div>
        <div class="tttstate">${ttt.turn==='pip'&&!ttt.over?'PIP IS THINKING…':'waiting'}</div>
      </div>
    </div>
    <div class="tttgrid">
      ${ttt.board.map((c,i)=>`
        <button class="tttcell ${c?'taken':''} ${win.includes(i)?'win':''}"
                onclick="tttPlay(${i})" ${c||ttt.over||ttt.turn!=='you'?'disabled':''}>${c}</button>`).join('')}
    </div>
    <div class="archnote" id="tttNote">${esc(ttt.note)}</div>
    ${ttt.over?`<button class="cta" onclick="tttFinish()">Done ✅</button>`:''}
  `);
}
function tttPlay(i){
  if(!ttt||ttt.over||ttt.turn!=='you'||ttt.board[i])return;
  ttt.board[i]='❌';
  tone(720,0.1,'triangle',0.1);
  const r=tttWinner(ttt.board);
  if(r){ tttEnd(r); return; }
  ttt.turn='pip';
  ttt.note='🦊 Pip is thinking… wait for your turn 🤫';
  renderTtt();
  speakPlain('Now it is Pip’s turn. Please wait.');
  setTimeout(tttPipMove, 1500 + Math.random()*900);
}
function tttPipMove(){
  if(!ttt||ttt.over)return;
  const b=ttt.board;
  const empty=b.map((c,i)=>c?null:i).filter(i=>i!==null);
  if(!empty.length)return;
  const findWin=(mark)=>{
    for(const [a,c,d] of TTT_LINES){
      const line=[a,c,d], vals=line.map(i=>b[i]);
      if(vals.filter(v=>v===mark).length===2 && vals.includes('')) return line[vals.indexOf('')];
    }
    return null;
  };
  /* Pip plays well, but leaves the door open — he is a friend, not a machine.
     BUG FIX: the old "sometimes just plays" line was `move=null` when move was
     ALREADY null, so Pip in fact blocked every single time. */
  let move=findWin('⭕');                          /* win if he can  */
  if(move==null){
    const blockMove=findWin('❌');
    if(blockMove!=null&&Math.random()>=0.35)move=blockMove;   /* usually blocks */
  }
  if(move==null) move = b[4]===''?4:empty[Math.floor(Math.random()*empty.length)];
  b[move]='⭕';
  tone(520,0.1,'sine',0.09);
  const r=tttWinner(b);
  if(r){ tttEnd(r); return; }
  ttt.turn='you';
  ttt.note='🦊 "Your turn!" says Pip.';
  renderTtt();
  speakPlain('Your turn.');
}
function tttEnd(r){
  if(!ttt)return;
  ttt.over=true;
  if(r.who==='❌'){
    ttt.note='🏆 You won! "Well played, friend!" says Pip.';
    speakPlain('You won! Well played, friend, says Pip.');
    fanfare();confettiBurst();
  }else if(r.who==='⭕'){
    ttt.note='🦊 Pip won this one. "Good game! Shall we play again?"';
    speakPlain('Pip won this one. Good game! Every game makes you a bit better.');
  }else{
    ttt.note='🤝 A draw! "That was a fair game," says Pip.';
    speakPlain('A draw! That was a fair game, says Pip.');
    fanfare();
  }
  renderTtt();
}
function tttFinish(){
  if(!ttt)return;
  const r=tttWinner(ttt.board);
  ttt=null;
  kindActs++;
  if(r&&r.who==='⭕'){
    challengeComplete(`🦊 Pip won — and you shook his paw anyway. Being a good sport IS the win. 🤝`);
  }else if(r&&r.who==='draw'){
    challengeComplete(`🤝 A draw! Just as good as each other. ${esc(rescue.name)} loved watching!`);
  }else{
    challengeComplete(`🏆 You beat Pip fair and square! "Show me how you did that," he laughs. ${esc(rescue.name)} cheered for you both.`);
  }
}

/* ═══════════ TAKING MONEY BACK OUT OF SAVINGS ═══════════
   Saving is the habit being taught, so the savings pot is deliberately a
   little sticky: he is told it is there, told what it is for, and has to
   choose an amount on purpose. It is never taken automatically. */
let wdTo='repairs', wdAmt=0;
function canWithdraw(){ return wVault>0; }
function offerWithdraw(acct){
  wdTo=(acct==='fun')?'fun':'repairs';
  wdAmt=Math.min(wVault,50);
  renderWithdraw();
  if(autoRead)setTimeout(()=>speakPlain(
    `You have ${wVault} points saved up. You can take some out for ${wdTo==='fun'?'fun':'repairs'} if you need to. Choose how many, then press Take it out.`),350);
}
function renderWithdraw(){
  const potName=wdTo==='fun'?'fun':'repairs';
  const potNow =wdTo==='fun'?wWants:wNeeds;
  openModal(`
    <div class="bigem">🏦➡️${wdTo==='fun'?'🎉':'🔧'}</div>
    <h2>Take some out of savings?</h2>
    <p class="msub" id="wdQ">You have <b>${wVault}</b> points saved up.
      Your ${potName} pot has <b>${potNow}</b>. How many shall we move across?</p>
    <div class="spinwrap">
      <button class="spinbtn" onclick="wdSpin(-10)">−</button>
      <div class="spinval" id="wdVal">${wdAmt}</div>
      <button class="spinbtn" onclick="wdSpin(10)">+</button>
    </div>
    <div class="seg">
      <div class="sopt ${wdTo==='repairs'?'sel':''}" onclick="wdWhere('repairs')">🔧 to repairs</div>
      <div class="sopt ${wdTo==='fun'?'sel':''}" onclick="wdWhere('fun')">🎉 to fun</div>
    </div>
    <div class="hintline">💡 Saved points grow by ${CFG.interestPercent}% every ${CFG.interestEveryMinutes} minutes. Points you take out stop growing.</div>
    <button class="cta mint" onclick="doWithdraw()">🏦 Take out <b id="wdGoN">${wdAmt}</b></button>
    <button class="cta ghost" onclick="closeModal();openShop()">← Leave it saved</button>
  `);
}
function wdSpin(d){
  wdAmt=Math.max(0,Math.min(wVault,wdAmt+d));
  const v=document.getElementById('wdVal'); if(v)v.textContent=wdAmt;
  const n=document.getElementById('wdGoN'); if(n)n.textContent=wdAmt;
  tone(560+wdAmt*4,0.06,'triangle',0.07);
}
function wdWhere(where){ wdTo=where; renderWithdraw(); }
function doWithdraw(){
  const amt=Math.max(0,Math.min(wVault,wdAmt));
  if(amt<=0){toast('Choose how many first ✏️',true);return;}
  wVault-=amt;
  if(wdTo==='fun')wWants+=amt; else wNeeds+=amt;
  flyChip(amt);fanfare();updateHUD();saveProgress();
  closeModal();openShop();
  speakPlain(`${amt} points moved from savings to ${wdTo==='fun'?'fun':'repairs'}. You have ${wVault} still saved up.`);
}

/* kind refusal when he cannot afford something — and a way out if he has
   savings sitting there */
function cantAfford(acct,cost){
  const have={repairs:wNeeds,fun:wWants,savings:wVault}[acct]||0;
  const nice={repairs:'repairs',fun:'fun',savings:'saved up'}[acct]||acct;
  tone(300,0.12,'sine',0.07);tone(240,0.16,'sine',0.07,0.12);
  const short=cost-have;
  /* if the savings pot could cover it, say so and offer the choice */
  if(acct!=='savings'&&canWithdraw()){
    toast('Not enough — but you have savings 🏦',true);
    openModal(`
      <div class="bigem">🏦</div>
      <h2>Not quite enough…</h2>
      <p class="msub" id="caQ">Your ${nice} pot has <b>${have}</b>, and this costs <b>${cost}</b>.
        You need <b>${short}</b> more. But you have <b>${wVault}</b> points saved up!
        You can take some out if you want to.</p>
      <div class="stack">
        <button class="rowcard idea" onclick="offerWithdraw('${acct}')"><span class="em">🏦</span><b>Take some out of savings</b></button>
        <button class="rowcard" onclick="closeModal();openShop()"><span class="em">💪</span>Keep saving — I will earn it</button>
      </div>
    `);
    autoReadIf('caQ');
    return;
  }
  toast('Not enough points yet 💛',true);
  speakPlain(`Not enough points yet. You need ${cost} ${nice}, and you have ${have}. Help one more animal and you will get there.`);
}
function buyRepair(){
  if(wNeeds<CFG.engineCostRepair||engines>=engineSlots)return;
  wNeeds-=CFG.engineCostRepair;flyChip(-CFG.engineCostRepair);engines++;fanfare();updateHUD();saveProgress();openShop();
  speakPlain(`Engine mended! That cost ${CFG.engineCostRepair} from your repairs money. You have ${wNeeds} left.`);
}
function buyEngine(){
  if(wNeeds<CFG.engineCostNew||engineSlots>=CFG.maxEngines)return;
  wNeeds-=CFG.engineCostNew;flyChip(-CFG.engineCostNew);engineSlots++;engines++;fanfare();updateHUD();saveProgress();openShop();
  speakPlain(`A new engine! That cost ${CFG.engineCostNew} from your repairs money. You have ${wNeeds} left. Your plane is stronger now!`);
}
const PAINTS=['#E8564A','#3D8BE8','#3FA45C','#B455D8','#E88A2E'];
function buyPaint(){
  if(wWants<CFG.paintCost)return;
  wWants-=CFG.paintCost;flyChip(-CFG.paintCost);
  const other=PAINTS.filter(p=>p!==paint);
  paint=other[Math.floor(Math.random()*other.length)];
  fanfare();updateHUD();saveProgress();openShop();
  speakPlain(`New paint! That cost ${CFG.paintCost} from your fun money. You have ${wWants} left.`);
}
function buySticker(){
  if(wWants<CFG.stickerCost||stickers>=5)return;
  wWants-=CFG.stickerCost;flyChip(-CFG.stickerCost);stickers++;fanfare();updateHUD();saveProgress();openShop();
  speakPlain(`A new sticker! That cost ${CFG.stickerCost} from your fun money. You have ${wWants} left.`);
}
function unlockVault(){
  /* GUARD: this used to run with no check at all, so anything that called it
     directly could push the savings account below zero. */
  if(vaultUnlocked||wVault<CFG.vaultGoal)return;
  vaultUnlocked=true;wVault-=CFG.vaultGoal;paint='#E8B923';
  engineSlots=Math.min(CFG.maxEngines,engineSlots+1);engines=engineSlots;
  confettiBurst();fanfare();updateHUD();saveProgress();openShop();
  speakPlain('The GOLDEN 707! You saved up, and look what you built!');
}

function drawCargo(time){
  if(!cargo)return;
  const bob=Math.sin(time*3)*8;
  /* golden glow so the gift is impossible to miss */
  const g=ctx.createRadialGradient(cargo.sx,cargo.sy+bob-12,4,cargo.sx,cargo.sy+bob-12,52);
  g.addColorStop(0,`rgba(255,225,120,${0.55+0.2*Math.sin(time*6)})`);
  g.addColorStop(1,'rgba(255,225,120,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(cargo.sx,cargo.sy+bob-12,52,0,Math.PI*2);ctx.fill();
  drawEm('🎁',cargo.sx-22,cargo.sy+bob,46);
  drawEm('✨',cargo.sx+16,cargo.sy-26+bob,18);
}

/* ═══════════════════════════════════════════════════════════════════════════
   🧠 THINKING QUESTIONS  —  multiple choice
   ---------------------------------------------------------------------------
   A bank of topics. Each has SEVERAL right answers and a pool of wrong ones;
   every round shows ONE of the right answers together with freshly drawn
   wrong ones, so the same topic never looks the same twice and the child
   cannot learn the position of the answer.
   ═══════════════════════════════════════════════════════════════════════════ */
const MCQ_TOPICS=[
  {
    id:'focus', em:'📖', ask:'What helps you focus?',

      'Start with the very hardest bit',
      'Give up if it takes a long time',
      'Check the phone after every question',
      'Ask someone to just tell you the answer',
      'Do it while jumping on the bed',
      'Wait until you are very sleepy'
    ]
  },
  {
    id:'calm', em:'🧸', ask:'What helps when you feel cross?',
    right:[
      'Breathe slowly, with your tummy going up and down',

      'Take a little break, then come back',
      'Ask someone you trust for a hug'
    ],
    wrong:[
      'Shout as loudly as you can',
      'Throw the nearest thing',
      'Say something unkind back',

      'Stamp off and slam the door'
    ]
  },
  {
    id:'kind', em:'💛', ask:'What is a kind thing to do?',

      'Listen all the way to the end'
    ],
    wrong:[
      'Laugh when someone trips over',
      'Take the biggest piece every time',
      'Talk over someone who is talking',
      'Tell a friend they are no good at it'
    ]
  },
  {
    id:'money', em:'🏦', ask:'What is a good money habit?',
    right:[
      'Save some of it instead of spending it all',
      'Keep money aside for mending things that break',
      'Wait, and think, before buying something',
      'Give a little to someone who needs it'
    ],
    wrong:[
      'Spend it all the moment you get it',
      'Buy the same toy twice',
      'Never mend anything, just buy a new one',
      'Keep it all and never help anyone'
    ]
  }
];
let mcq=null;
function showMCQ(){
  const t=MCQ_TOPICS[Math.floor(Math.random()*MCQ_TOPICS.length)];
  /* one of the right answers, plus wrong ones drawn fresh each time */
  const ok=t.right[Math.floor(Math.random()*t.right.length)];
  const nWrong=(band==='t')?1:(band==='y'?2:3);
  const wrongs=shuffle([...t.wrong]).slice(0,nWrong);
  const opts=shuffle([ok,...wrongs]);
  mcq={topic:t,ok,opts,correct:opts.indexOf(ok)};
  openModal(`
    <div class="bigem">${rescue.em}${t.em}</div>
    <h2>${esc(rescue.name)} wants to know…</h2>
    <p class="msub" id="mcQ">${esc(t.ask)}</p>
    <div class="stack">
      ${opts.map((o,i)=>`<button class="rowcard" id="mc${i}" onclick="pickMCQ(${i})"><span class="em">${t.em}</span>${esc(o)}</button>`).join('')}
    </div>
  `);
  autoReadIf('mcQ',()=>readChoices(opts));
}
function pickMCQ(i){
  if(!mcq)return;
  if(i!==mcq.correct){flowMiss(document.getElementById('mc'+i));return;}
  streakUp();
  const t=mcq.topic, ok=mcq.ok;
  /* show the OTHER right answers too — there is rarely just one good way */
  const others=t.right.filter(r=>r!==ok);
  mcq=null;
  challengeComplete(
    `${t.em} Yes! <b>${esc(ok)}</b>`+
    (others.length?`<br><br><small>These help too:<br>${others.map(o=>'• '+esc(o)).join('<br>')}</small>`:'')
  );
}

/* ═══════════ AUTOPILOT — IF / THEN planning ═══════════
   Before a storm, the child programs the plane's autopilot with IF / THEN
   blocks. Getting all three right gives real protection in the air.      */
const AP_RULES=[
  {ifTxt:'IF ⚡ lightning flashes', ok:'THEN 🛬 go down low', opts:['THEN 🛬 go down low','THEN 🚀 fly straight at it','THEN 😴 do nothing']},
  {ifTxt:'IF 🆘 an animal needs help', ok:'THEN 🛞 wheels DOWN', opts:['THEN 🛞 wheels DOWN','THEN ⬆️ climb away fast','THEN 🚀 fly straight past']},
  {ifTxt:'IF 😤 I start to feel cross', ok:'THEN 🧸 breathe with my bear', opts:['THEN 🧸 breathe with my bear','THEN 📣 shout louder','THEN 💥 bump into something']}
];
let apPicks={};
function showAutopilot(next){
  apPicks={};
  openModal(`
    <div class="bigem">🤖</div>
    <h2>Teach the autopilot</h2>
    <p class="msub" id="apQ">A storm is coming! Tell the plane what to do BEFORE it starts. Pick the kind, safe THEN for each IF.</p>
    <div class="stack">
      ${AP_RULES.map((r,ri)=>{
        /* the option index is passed, not the text — the old version spliced
           the label straight into an onclick attribute */
        const order=shuffle(r.opts.map((o,i)=>i));
        return `<div class="apblock">
          <div class="apif">${r.ifTxt}</div>
          ${order.map(oi=>`<button class="apthen" onclick="apPick(${ri},${oi},this)">${r.opts[oi]}</button>`).join('')}
        </div>`;
      }).join('')}
    </div>
    <button class="cta" id="apBtn" onclick="apRun()">Start the autopilot! 🤖</button>
  `);
  autoReadIf('apQ');
  window._apNext=next||null;
}
function apPick(ri,oi,el){
  const choice=AP_RULES[ri].opts[oi];
  apPicks[ri]=choice;
  const block=el.parentElement;
  block.querySelectorAll('.apthen').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  tone(600,0.08,'triangle',0.08);
  speakPlain(choice.replace(/^THEN/,''));
}
function apRun(){
  let right=0;
  AP_RULES.forEach((r,ri)=>{ if(apPicks[ri]===r.ok) right++; });
  if(right===AP_RULES.length){
    autopilotOn=true;
    closeModal();fanfare();
    banner('🤖 Autopilot on',2200,true);
    speakPlain(`${praise()} The autopilot knows what to do. Planning first is what calm pilots do.`);
    if(window._apNext){const n=window._apNext;window._apNext=null;n();}
  }else{
    toast('🤖 '+notYetLine()+` ${right} of ${AP_RULES.length} are right.`,true);
    speakPlain(`${notYetLine()} ${right} of ${AP_RULES.length} are right. Have another look.`);
  }
}

/* ═══════════ 11) PRE-FLIGHT CHECK — looking after the plane ═══════════
   Skip it and the plane flies heavy next level. Caring beats repairing.  */
/* preflightOK / preflightDue live with the rest of the world state, above */
let pfState=null;
function showPreflight(){
  introReading(true);
  /* 5 dirty marks to rub off, 3 nails to hammer in */
  pfState={stains:5, nails:3, nailHits:{}};
  const stains=[...Array(5)].map((_,i)=>{
    const t=12+Math.random()*46, l=8+Math.random()*76;
    const r=(Math.random()*60-30)|0;
    const kind=['oil','mud','bug'][i%3];
    return `<span class="pfstain ${kind}" id="pfs${i}" style="top:${t}%;left:${l}%;transform:rotate(${r}deg)"
              onmousedown="pfWipe(${i})" onmouseover="pfDrag(event,${i})" ontouchstart="pfWipe(${i})" ontouchmove="pfTouchWipe(event)"></span>`;
  }).join('');
  openModal(`
    <div class="bigem">🧽🔨</div>
    <h2>Check the plane</h2>
    <p class="msub" id="pfQ">Rub the dirty marks off the window. Then hammer the loose nails in.</p>
    <div id="pffield" ontouchmove="pfTouchWipe(event)">
      <div class="pfglass">
        ${stains}
      </div>
      <div class="pfledge">
        <span class="pfnail" id="pfn0" onclick="pfHit(0)">🔩</span>
        <span class="pfnail" id="pfn1" onclick="pfHit(1)">🔩</span>
        <span class="pfnail" id="pfn2" onclick="pfHit(2)">🔩</span>
      </div>
    </div>
    <div class="tinynote" id="pflbl">🧽 marks: <b>5</b> &nbsp;·&nbsp; 🔨 nails: <b>3</b> (tap each one 3 times)</div>
    <button class="cta ghost" onclick="pfSkip()">Skip it — fly now</button>
  `);
  autoReadIf('pfQ',()=>speakPlain('Rub the dirty marks away. Then tap each nail three times to hammer it in.'));
}
function pfLbl(){
  if(!pfState)return;
  const l=document.getElementById('pflbl');
  if(l)l.innerHTML=`🧽 marks: <b>${pfState.stains}</b> &nbsp;·&nbsp; 🔨 nails: <b>${pfState.nails}</b>`;
  if(pfState.stains===0&&pfState.nails===0)pfComplete();
}
/* --- rubbing: each mark fades as you rub over it --- */
function pfWipe(i){
  if(!pfState)return;
  const e=document.getElementById('pfs'+i);
  if(!e||e.dataset.done)return;
  const rub=(+(e.dataset.rub||0))+1;
  e.dataset.rub=rub;
  e.style.opacity=String(Math.max(0,1-rub/3));
  e.style.transform=(e.style.transform||'')+` scale(${1-rub*0.12})`;
  tone(180+rub*90,0.05,'sawtooth',0.05);
  if(rub>=3){
    e.dataset.done='1';
    e.style.opacity='0';
    pfState.stains--;
    tone(880,0.09,'sine',0.08);
    pfLbl();
  }
}
function pfDrag(ev,i){ if(ev.buttons===1)pfWipe(i); }          /* rub with the mouse held down */
function pfTouchWipe(ev){                                       /* rub with a finger */
  if(!ev.touches||!ev.touches.length)return;
  const t=ev.touches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(el&&el.classList&&el.classList.contains('pfstain')){
    const id=el.id.replace('pfs','');
    pfWipe(+id);
  }
}
/* --- hammering: three taps sinks the nail flush --- */
function pfHit(i){
  if(!pfState)return;
  const e=document.getElementById('pfn'+i);
  if(!e||e.dataset.done)return;
  const hits=(pfState.nailHits[i]||0)+1;
  pfState.nailHits[i]=hits;
  e.classList.remove('whack');void e.offsetWidth;e.classList.add('whack');
  tone(140,0.07,'square',0.12);
  noiseBurst(0.06,0.07,900,300);
  e.style.transform=`translateY(${hits*4}px) scale(${1-hits*0.08})`;
  if(hits>=3){
    e.dataset.done='1';
    e.textContent='✅';
    e.style.transform='translateY(10px)';
    pfState.nails--;
    tone(900,0.12,'triangle',0.09);
    pfLbl();
  }
}
function pfComplete(){
  pfState=null;                          /* so pfLbl cannot fire twice */
  preflightOK=true;preflightDue=false;
  addPoints(CFG.preflightPoints);updateHUD();fanfare();confettiBurst();saveProgress();
  setTimeout(()=>{
    const pct=Math.round(cfgNum('cleanBoost',0.10,0)*100);
    const line=`All clean! A clean plane is a lighter plane, and a lighter plane flies faster. You get ${pct} per cent more speed.`;
    if(!started){
      speakPlain(praise()+' '+line);
      showOrientation();   /* last stop before take-off: the two helpers */
    }else{
      introReading(false);
      closeModal();
      banner(`✨ All clean — ${pct}% faster!`,2600,true);
      speakPlain(line);
    }
  },900);
}
function pfSkip(){
  pfState=null;
  preflightOK=false;preflightDue=false;
  stopSpeak();
  if(!started){
    speakPlain('You skipped the check. The plane will feel heavy and slow.');
    showOrientation();

    introReading(false);
    closeModal();
    banner('⚠️ Skipped — the plane feels heavy',2600);
  }

/* ═══════════ FORK IN THE SKY — a real choice ═══════════ */
function maybeFork(){
  if(animal||hazards.length||emergencyMode||!started)return;
  if(!canInterrupt())return;                    /* something else just happened */
  /* NOTE: route + weather planning happens ONCE, before take-off. It must
     never interrupt a flight already under way. */
  /* the plane check no longer ambushes him in mid-air — it belongs before
     take-off, or in the hangar when he chooses to go there */
  /* BUG FIX: markInterrupt() used to run here, at the top — so on the ~37% of
     calls that showed nothing at all, the quiet-gap budget was spent anyway
     and real events (rescues, gifts) got silently swallowed. It now only runs
     when something is actually about to appear. And the focus game used to
     open its modal WITHOUT pausing, so the plane kept flying underneath it. */
  if(Math.random()<0.5)return;                  /* nothing this time */
  markInterrupt();
  paused=true;engineUpdate();
  openModal(`
    <div class="bigem">🛤️</div>
    <h2>Two ways to go!</h2>
    <p class="msub" id="fkQ">Which way will you fly, Captain?</p>

/* feelings work, grounding and calming earn a little extra on top of the

const NVC_TYPES=['feelings','feelonly','needonly','solveonly'];
/* one short line naming where the points went — the saving habit only
   teaches if he sees it happen, and it keeps the "well done" card to three
   plain facts: correct, solved, saved. */
function savedLine(pts){
  const toSave=Math.round(pts*CFG.splitSavings);

     ask — a second spoken line here would just talk over it */
  if(ctxMode==='rescue'&&maybeAskShare()){
    overlay.classList.remove('show');
    return;
  }
  closeModal();
}
/* ---- ONCE IN A WHILE after a rescue, the animal simply asks. Short.
   Skippable. Two guards keep it occasional: the dice, and a floor of
   several rescues between asks — without the floor, an unlucky run of rolls
   could ask three rescues in a row and it stops feeling like a gift.
   He can always share on purpose from 💝 SHARE POINTS instead. ---- */
let lastShareAskAt=-99;
function maybeAskShare(){
  if(score<10)return false;
  if(stats.rescues-lastShareAskAt<cfgNum('shareAskGap',4,0))return false;
  if(Math.random()>CFG.shareAskChance)return false;
  lastShareAskAt=stats.rescues;
  markInterrupt();
  setTimeout(()=>{ ctxMode='sharing'; showSharing(); }, 900);
  return true;
}
function confettiBurst(){
  const ems=['🎉','⭐','💛','🎈','🌈'];
  for(let i=0;i<16;i++){
    const s=document.createElement('div');
    s.className='confetti';s.textContent=ems[i%ems.length];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3200);
  }
}

function addPilot(){
  const name=(document.getElementById('apName')||{}).value||'';
  const dob =(document.getElementById('apDob') ||{}).value||'';
  const age =(document.getElementById('apAge') ||{}).value||'';
  const say =(document.getElementById('apSay') ||{}).value||'';
  if(!name.trim()){toast('Type a name first ✏️');return;}
  if(!dob && !age){toast('Add a date of birth, or an age ✏️');return;}

  let useDob=dob;
  if(!useDob && age){                    /* turn a plain age into a date of birth */
    const n=parseInt(age,10);
    if(isNaN(n)||n<1||n>18){toast('Type an age between 1 and 18 ✏️');return;}
    useDob=`${new Date().getFullYear()-n}-01-01`;
  }
  const id=name.trim().toLowerCase().replace(/[^a-z0-9]/g,'')||('pilot'+Date.now());
  CFG.profiles[id]={name:name.trim(), dob:useDob};
  if(say.trim())NAME_SAYS[name.trim().toLowerCase()]=say.trim();

  /* remember the new pilot on this device */
  try{
    const extra=JSON.parse(localStorage.getItem('skyRescuePilots')||'{}');
    extra[id]={name:name.trim(), dob:useDob, says:say.trim()||undefined};
    localStorage.setItem('skyRescuePilots',JSON.stringify(extra));
  }catch(e){}

  const a=pilotAge(useDob);
  toast(`✅ ${name.trim()} added — age ${a}, ${BANDS[bandForAge(a)]}`);
  speakPlain(`${name.trim()} has been added. Age ${a}.`);
  showProfilePicker();
}

/* ═══════════════════════════════════════════════════════════════════════════
   COMPLETENESS BY CONSTRUCTION
   ---------------------------------------------------------------------------
   The groups above are the nicely-labelled ones. This sweep then collects
   EVERY other number in CFG and drops it into an "Everything else" tab with a
   sensible range worked out from its own value — so the settings space always
   holds every variable that can be tweaked, and any key added to CFG in
   future turns up automatically instead of being quietly unreachable.
   ═══════════════════════════════════════════════════════════════════════════ */
function labelledKeys(){
  const set=new Set();
  DASH_GROUPS.forEach(g=>g.fields.forEach(f=>set.add(f.k)));
  return set;
}
function prettify(k){
  return k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).trim();
}
function autoRange(v){
  if(!isFinite(v))return {min:0,max:10,step:1};
  const a=Math.abs(v);
  if(Number.isInteger(v)&&a>=1){
    const max=Math.max(10,Math.ceil(a*4));
    return {min:0,max,step:(max>500?10:1)};
  }
  if(a<=1) return {min:0,max:(a<=1?2:Math.ceil(a*4)),step:0.05};
  return {min:0,max:Math.ceil(a*4),step:0.1};
}
function extraFields(){
  const known=labelledKeys();
  return Object.keys(CFG)
    .filter(k=>typeof CFG[k]==='number'&&isFinite(CFG[k])&&!known.has(k))
    .sort()
    .map(k=>Object.assign({k,t:prettify(k)},autoRange(CFG[k])));
}
let dashTab='journey';

/* per-pilot overrides, saved on the device */
function dashKey(){ return 'skyDash_'+profileId; }
function loadDash(){
  try{
    const o=JSON.parse(localStorage.getItem(dashKey())||'{}');
    Object.keys(o).forEach(k=>{ CFG[k]=o[k]; });
    return o;
  }catch(e){ return {}; }
}
function saveDash(k,v){
  /* v may be a number (a slider) or an array of lines (the praise words) */
  let o={};
  try{ o=JSON.parse(localStorage.getItem(dashKey())||'{}'); }catch(e){}
  o[k]=v;
  CFG[k]=v;
  try{ localStorage.setItem(dashKey(),JSON.stringify(o)); }catch(e){}
}
function resetDash(){
  try{ localStorage.removeItem(dashKey()); }catch(e){}
  location.reload();
}

function openDashboard(){
  paused=true;engineUpdate();
  const g=DASH_GROUPS.find(x=>x.id===dashTab)||DASH_GROUPS[0];
  const nTunable=()=>Object.keys(CFG).filter(k=>typeof CFG[k]==='number'&&isFinite(CFG[k])).length;
  openModal(`
    <div class="dashhead">
      <div class="dashwho">⚙️ <b>${esc(kidName||'Pilot')}</b>&rsquo;s settings</div>
      <div class="dashsub">Changes are saved for this pilot only</div>

      ${DASH_GROUPS.map(x=>`<button class="dtab ${x.id===dashTab?'on':''}" onclick="dashGo('${x.id}')">${x.em}<small>${x.tab||x.name}</small></button>`).join('')}
      <button class="dtab ${dashTab==='more'?'on':''}" onclick="dashGo('more')">🔧<small>More</small></button>
      <button class="dtab ${dashTab==='content'?'on':''}" onclick="dashGo('content')">📝<small>Content</small></button>
    </div>
    <div id="dashbody">${
      dashTab==='content' ? dashContent()
    : dashTab==='more'    ? dashFields({em:'🔧',name:'Everything else',fields:extraFields()})
    : dashFields(g)}</div>

    <button class="cta ghost" onclick="dashReset()">↺ Back to the defaults for this pilot</button>
    <button class="cta" onclick="openSettings()">Done ✅</button>
  `);
}
function dashGo(t){ dashTab=t; openDashboard(); }
function dashFields(g){
  if(!g.fields.length){
    return `<div class="dashgrp"><div class="dashgrpname">${g.em} ${g.name}</div>
      <p class="tinynote">Every setting already has a proper home in the other tabs. 👍</p></div>`;
  }
  return `
    <div class="dashgrp">
      <div class="dashgrpname">${g.em} ${g.name}</div>
      ${g.fields.map(f=>{
        const v=(CFG[f.k]!=null?CFG[f.k]:f.min);
        return `
        <div class="dfield">
          <label>${f.t}</label>
          <div class="drow2">
            <input type="range" id="dr-${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}"
                   oninput="dashSet('${f.k}',this.value,${f.step})">
            <input type="number" id="dn-${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}"
                   onchange="dashSet('${f.k}',this.value,${f.step},true)">
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
function dashSet(k,v,step,fromNumber){
  const num=(step<1)?parseFloat(v):parseInt(v,10);
  if(isNaN(num))return;
  saveDash(k,num);
  const r=document.getElementById('dr-'+k), n=document.getElementById('dn-'+k);
  if(r&&fromNumber)r.value=num;
  if(n&&!fromNumber)n.value=num;
  tone(500+num,0.03,'sine',0.03);
  updateHUD();
}
function dashReset(){
  openModal(`

function dashAddNvc(){
  const tx=(document.getElementById('ceTx')||{}).value||'';

  const need=(document.getElementById('ceNeed')||{}).value||'being_heard';
  const bad=(document.getElementById('ceBad')||{}).value||'';
  if(!tx.trim()||!fix.trim()){toast('Need the story and what helps ✏️');return;}
  const item={tx:tx.trim(), feeling:window._ceFam||'sad', need,
              resolution:fix.trim(),
              wrong:bad.split(',').map(x=>x.trim()).filter(Boolean).map(x=>['🙅',x])};
  customSituations.push(item);
  CFG.extraSituations=CFG.extraSituations||[];CFG.extraSituations.push(item);

/* BUG FIX: these two used to finish by calling openContentEditor() — a whole
   different screen — so adding a question from the dashboard threw the
   grown-up out of the dashboard. They now return to the tab they came from. */
function ceAddMath(){
  const q=(document.getElementById('ceMq')||{}).value||'';
  const a=(document.getElementById('ceMa')||{}).value||'';
  const w=(document.getElementById('ceMw')||{}).value||'';
  if(!q.trim()||!a.trim()){toast('Need a question and an answer ✏️');return;}
  const num=v=>{const s=String(v).trim();if(!s)return null;const n=Number(s);return isNaN(n)?s:n;};
  const item={q:q.trim(),ans:num(a),
              wrong:w.split(',').map(num).filter(x=>x!==null&&x!=='')};
  customMath[band]=customMath[band]||[];customMath[band].push(item);
  CFG.extraMath=CFG.extraMath||{};CFG.extraMath[band]=CFG.extraMath[band]||[];CFG.extraMath[band].push(item);
  toast(`✅ Maths question added for ${BANDS[band]}!`);
  speakPlain('Maths question added.');
  dashSubGo('math');
}
function ceAddQ(){
  const q=(document.getElementById('ceQq')||{}).value||'';
  const a=(document.getElementById('ceQa')||{}).value||'';
  const w=(document.getElementById('ceQw')||{}).value||'';
  if(!q.trim()||!a.trim()){toast('Need a question and an answer ✏️');return;}
  const wrong=w.split(',').map(x=>x.trim()).filter(Boolean);
  if(!wrong.length){toast('Add at least one wrong answer ✏️');return;}
  const item={q:q.trim(),ok:a.trim(),wrong,em:'📝'};
  customQuestions.push(item);
  CFG.extraQuestions=CFG.extraQuestions||[];CFG.extraQuestions.push(item);
  toast(`✅ Added (${customQuestions.length} total)`);
  speakPlain('Question added. The animals will ask it.');
  dashSubGo('q');
}
function dashSaveWords(){
  const grab=id=>((document.getElementById(id)||{}).value||'')
    .split('\n').map(x=>x.trim()).filter(Boolean);
  const pr=grab('wdPraise'), ny=grab('wdNotYet');
  if(!pr.length||!ny.length){toast('Both lists need at least one line ✏️');return;}
  CFG.praise=pr; CFG.notYet=ny;
  /* saved per pilot, exactly like every slider */
  saveDash('praise',pr); saveDash('notYet',ny);
  toast(`✅ Saved — ${pr.length} praise lines, ${ny.length} not-yet lines`);
  speakPlain(praise());
  dashSubGo('words');
}
function dashBulk(){
  const raw=(document.getElementById('ceBulk')||{}).value||'';
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let n=0;
  lines.forEach(line=>{
    const p=line.split('|').map(x=>x.trim());
    try{
      if(bulkK==='nvc' && p.length>=4){
        const item={feeling:p[0], need:p[1], tx:p[2], resolution:p[3],
                    wrong:(p[4]||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>['🙅',x])};
        if(!FEELING_SYNS[item.feeling]||!NEED_SYNS[item.need])return;
        customSituations.push(item);
        CFG.extraSituations=CFG.extraSituations||[];CFG.extraSituations.push(item);
        n++;
      }else if(bulkK==='math' && p.length>=2){
        const item={q:p[0], ans:isNaN(+p[1])?p[1]:+p[1],
                    wrong:(p[2]||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>isNaN(+x)?x:+x)};
        customMath[band]=customMath[band]||[];customMath[band].push(item);
        CFG.extraMath=CFG.extraMath||{};CFG.extraMath[band]=CFG.extraMath[band]||[];CFG.extraMath[band].push(item);
        n++;
      }else if(bulkK==='q' && p.length>=2){
        const wrong=(p[2]||'').split(',').map(x=>x.trim()).filter(Boolean);
        if(!wrong.length)return;                 /* a question with no choices is unplayable */
        customQuestions.push({q:p[0], ok:p[1], wrong, em:'📝'});
        CFG.extraQuestions=CFG.extraQuestions||[];
        CFG.extraQuestions.push({q:p[0], ok:p[1], wrong, em:'📝'});
        n++;
      }
    }catch(e){}
  });
  if(n){
    toast(`✅ Added ${n} of ${lines.length}`);
    speakPlain(`Added ${n} items.`);
    const b=document.getElementById('ceBulk'); if(b)b.value='';
    openDashboard();
  }else{
    toast('Nothing matched the format ✏️');
  }
}

/* ═══════════ SETTINGS ═══════════ */
function openSettings(){
  paused=true;engineUpdate();updateCalmBtn();
  const bandRows=Object.entries(BANDS).map(([id,t])=>{
    const d={t:'counting · simple feelings · CAT words · gentle skies',
             y:'adding & taking away · FROG words · eagles & storms',
             m:'× and ÷ · more words · dragons & asteroids',
             o:'algebra & % · full feelings words · rockets & flares'}[id];
    return `<div class="ageopt ${band===id?'sel':''}" onclick="setBand('${id}')" id="opt-${id}">
      <div>${t}<small>${d}</small></div><div>${band===id?'✅':''}</div></div>`;
  }).join('');
  const chRows=CHALLENGE_TYPES.map(c=>
    `<div class="sopt ${enabled[c.id]?'sel':''}" onclick="toggleCh('${c.id}',this)">${c.em} ${c.label}</div>`).join('');
  openModal(`
    <h2>${started?'Grown-up corner ⚙️':'🛫 Sky Rescue 707!'}</h2>
    <p class="msub">${started?'You can change these any time.':'Pick a mission, fly the 707, help the animals you meet, and calm every storm with CALM POWER — by breathing, listening, or thinking.'}</p>
    <label class="fieldlbl">Pilot’s name</label>
    <input type="text" id="kidname" maxlength="24" value="${esc(kidName)}" placeholder="e.g. Aaries">
    <label class="fieldlbl">Date of birth (sets the age level by itself)</label>
    <input type="date" id="kiddob" value="${esc(kidDOB)}" onchange="dobChanged()">
    <label class="fieldlbl">Age level <small style="font-weight:700;opacity:.6">(from the date of birth — change it if you like)</small></label>
    <div class="agegroup">${bandRows}</div>
    <label class="fieldlbl">Games at each rescue (they take turns)</label>
    <div class="seg">${chRows}</div>
    <label class="fieldlbl">Read everything out loud (for pre-readers)</label>
    <div class="seg">
      <div class="sopt ${autoRead?'sel':''}" id="ar-on" onclick="setAR(true)">🔊 Reading ON</div>
      <div class="sopt ${!autoRead?'sel':''}" id="ar-off" onclick="setAR(false)">🔇 Off</div>
    </div>
    <button class="cta ghost" onclick="openDashboard()">🎛️ Full dashboard — change ANY setting</button>
    <button class="cta ghost" onclick="showProfilePicker()">🧑‍✈️ Switch or add a pilot (${esc(kidName||'—')})</button>
    <button class="cta ghost" onclick="exportSaves()">💾 Export saved progress</button>
    <button class="cta ghost" onclick="showSaveSnippet()">💾 Save progress into the settings file</button>
    <button class="cta" onclick="startGame()">${started?'Back to flying! ✈️':'Start the mission 🫡'}</button>
    <p class="tinynote">Touch ANYWHERE low on the screen to steer — the dial appears under your thumb.<br>🚀 boost (off while the wheels are down) · 🛞 wheels · 🧊 CALM stops danger · 🛠️ HANGAR mends and shops<br>🧑‍✈️ view · ↻ double-tap starts everything again · Computer: arrow keys, space, W</p>
  `);
}
function dobChanged(){
  const d=document.getElementById('kiddob');
  if(!d||!d.value)return;
  kidDOB=d.value;
  setBand(bandForAge(pilotAge(kidDOB)));
  toast(`🎂 Age ${pilotAge(kidDOB)} → ${BANDS[band]}`);
}
function setBand(id){
  band=id;
  document.querySelectorAll('.ageopt').forEach(o=>{
    o.classList.remove('sel');
    if(o.lastElementChild)o.lastElementChild.textContent='';
  });
  const el=document.getElementById('opt-'+id);
  if(el){el.classList.add('sel');if(el.lastElementChild)el.lastElementChild.textContent='✅';}
}
function setAR(v){
  autoRead=v;
  const on=document.getElementById('ar-on'), off=document.getElementById('ar-off');
  if(on)on.classList.toggle('sel',v);
  if(off)off.classList.toggle('sel',!v);
  if(!v)stopSpeak();
}
function toggleCh(id,el){
  const on=Object.values(enabled).filter(Boolean).length;
  if(enabled[id]&&on===1){toast('Keep at least one game switched on! 😊');return;}
  enabled[id]=!enabled[id];
  el.classList.toggle('sel',enabled[id]);
}
function startGame(){
  audioInit();
  const n=document.getElementById('kidname');
  if(n&&n.value.trim())kidName=n.value.trim();
  const d=document.getElementById('kiddob');
  if(d&&d.value){kidDOB=d.value;band=bandForAge(pilotAge(kidDOB));}
  updateHUD();
  if(profileChosen)saveProgress();
  if(!started){
    /* first launch: welcome by name, then the mission */
    showWelcome();
  }else{
    closeModal();
  }
}
function showWelcome(){
  introReading(true);
  const age=pilotAge(kidDOB);
  const ageBit=(age&&!isNaN(age))?`You are ${age} years old, and today `:'Today ';
  openModal(`
    <div class="bigem">🧑‍✈️✈️</div>
    <h2 id="wlTitle">Hello, Captain ${esc(kidName||'Pilot')}!</h2>
    <p class="msub" id="wlSub">${ageBit}you are flying a big plane. It is full of fuel. Now — where shall we fly?</p>
    <button class="cta" onclick="showMissionPicker(false)">Choose my mission 🗺️</button>
  `);
  if(autoRead){
    setTimeout(()=>speakHL('wlTitle',()=>speakHL('wlSub')),300);
  }
}

/* ═══════════ START HERE ═══════════ */
loadCustomContent();
updateHUD();updateAlt();updateGps();
showProfilePicker();     /* who is flying today? then settings, then the mission */
</script>
</body>
</html>

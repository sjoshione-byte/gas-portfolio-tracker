<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sky Rescue 707 — Flying Learning Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#33305E; --sun:#FFB432; --card:#FFFFFF; --idea:#B9E8D8; --ice:#BFE8FF;
    --shadow:0 4px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#87CEEB;touch-action:none}

  #game{position:fixed;inset:0}
  canvas#cv{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:42px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
  .hudbox{
    background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:14px;
    padding:5px 10px;font-weight:800;font-size:13.5px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:6px;
  }
  #zonename{font-family:'Fredoka';font-weight:600}
  .hudcol{display:flex;flex-direction:column;gap:7px}
  .hudcol.r{align-items:flex-end}
  .hudbox.calmdial{pointer-events:auto;cursor:pointer;gap:4px;background:#E4F3FC}
  .hudbox.calmdial b{font-size:15px;font-family:'Fredoka'}
  .hudrow{display:flex;gap:7px}
  #gearbtn,#sndbtn{pointer-events:auto;cursor:pointer}

  #altwrap{
    position:fixed;left:8px;top:54%;transform:translateY(-50%);width:24px;height:150px;
    background:rgba(255,255,255,.9);border:3px solid var(--ink);border-radius:13px;z-index:5;overflow:hidden;
  }
  #altfill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#8FD3FF,#4AA8E8);border-top:3px solid var(--ink)}
  #altplane{position:absolute;left:50%;transform:translate(-50%,50%);font-size:13px}

  #banner{
    position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;
    background:#FFF3D6;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--shadow);
    padding:8px 16px;font-weight:800;font-size:14.5px;text-align:center;display:none;max-width:88vw;line-height:1.35;
  }
  #banner.show{display:block;animation:bpop .3s ease}
  @keyframes bpop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
  #toast{
    position:fixed;top:148px;left:50%;transform:translateX(-50%);z-index:8;background:rgba(255,255,255,.95);
    border:3px solid var(--ink);border-radius:16px;box-shadow:var(--shadow);padding:8px 15px;
    font-weight:800;font-size:14px;display:none;text-align:center;max-width:86vw;line-height:1.35;
  }
  #toast.show{display:block;animation:bpop2 .25s ease}
  @keyframes bpop2{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1)}}

  /* ---------- SKIP THE READING ----------
     BUGFIX: this button had no CSS at all. It showed as loose text at the
     bottom of the page, and because it had no z-index it sat UNDERNEATH the
     modal overlay — so it could never actually be tapped. It now floats over
     the modal (z-index above #overlay) and hides itself until it is needed. */
  #skipRead{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:12;display:none;
    background:#FFF3D6;border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);
    padding:8px 16px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink);
  }
  #skipRead.show{display:block}
  #skipRead:active{transform:translateX(-50%) translateY(2px);box-shadow:0 1px 0 var(--ink)}

  /* BUGFIX: .pulseme was added by the code but never defined here, so the
     "press this button next" hint was invisible. */
  .pulseme{animation:pulseBig 1.1s infinite}

  /* Small action icons in the bottom bar (CALM + HANGAR) */
  #actionbar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:6;
    display:none;gap:10px;
  }
  #actionbar.show{display:flex}
  .actbtn{
    position:relative;
    width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);
    background:#E4F3FC;box-shadow:var(--shadow);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:21px;line-height:1;opacity:.9;pointer-events:auto;
  }
  .actbtn small{font-size:8px;font-weight:800;margin-top:2px;letter-spacing:.3px}
  .actbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .actbtn.hangar{background:#FFE9B8}
  .actbtn.alert{opacity:1;animation:pulseBig 1s infinite}
  @keyframes pulseBig{
    0%,100%{transform:scale(1);box-shadow:var(--shadow),0 0 0 0 rgba(80,190,255,.8)}
    50%{transform:scale(1.16);box-shadow:var(--shadow),0 0 0 14px rgba(80,190,255,0)}
  }
  /* NVC recap card — keeps the story + answers visible */
  .recap{
    background:#F3F1FB;border:2.5px dashed var(--ink);border-radius:14px;
    padding:9px 12px;font-weight:800;font-size:12.5px;line-height:1.5;margin-bottom:11px;
  }

  /* ---------- CONTROLS: DIRECTIONAL DIAL ---------- */
  #controls{position:fixed;bottom:0;left:0;right:0;z-index:5;pointer-events:none;padding:12px}
  .ctlrow{display:flex;justify-content:space-between;align-items:flex-end}
  /* Joystick: fixed in the bottom-left corner, always in the same place */
  #dial{
    position:fixed;left:16px;bottom:18px;width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%, rgba(255,255,255,.96), rgba(230,226,244,.92));
    border:3px solid var(--ink);box-shadow:var(--shadow);
    z-index:6;touch-action:none;display:none;
  }
  #dial.show{display:block}
  #dial .darr{position:absolute;font-size:17px;opacity:.45;pointer-events:none}
  #dial .darr.u{top:5px;left:50%;transform:translateX(-50%)}
  #dial .darr.d{bottom:5px;left:50%;transform:translateX(-50%)}
  #dial .darr.l{left:7px;top:50%;transform:translateY(-50%)}
  #dial .darr.r{right:7px;top:50%;transform:translateY(-50%)}
  #dialKnob{
    position:absolute;width:52px;height:52px;border-radius:50%;left:39px;top:39px;
    background:var(--sun);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:22px;pointer-events:none;
  }
  .padR{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
  .cbtn{
    background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:18px;
    font-size:23px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
    cursor:pointer;width:56px;height:56px;color:var(--ink);
  }
  .cbtn:active,.cbtn.held{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:#FFE9B8}
  .cbtn.wide{width:122px;font-family:'Fredoka';font-weight:600;font-size:14.5px;gap:6px}
  .cbtn.wheels.down{background:var(--idea)}
  .cbtn.locked{opacity:.45}

  /* ---------- MODALS ---------- */
  #overlay{
    position:fixed;inset:0;background:rgba(51,48,94,.45);z-index:10;display:none;
    align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px 12px 28px;
  }
  #overlay.show{display:flex}
  .modal{
    width:100%;max-width:440px;background:var(--card);border:3px solid var(--ink);border-radius:26px;
    box-shadow:0 6px 0 var(--ink);padding:18px;animation:mpop .25s ease;margin:auto 0;
  }
  @keyframes mpop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h2{font-family:'Fredoka';font-weight:600;font-size:20px;text-align:center;line-height:1.3;margin-bottom:6px}
  .msub{text-align:center;font-weight:800;font-size:14px;opacity:.82;margin-bottom:12px;line-height:1.5}
  .bigem{font-size:52px;text-align:center;line-height:1;margin-bottom:8px}
  .mathq{
    font-family:'Fredoka';font-weight:600;font-size:24px;text-align:center;background:#FFF3D6;
    border:3px dashed var(--ink);border-radius:18px;padding:13px;margin-bottom:12px;line-height:1.5;
  }
  .vault{
    display:flex;align-items:center;justify-content:center;gap:10px;background:#EDEAF7;
    border:3px solid var(--ink);border-radius:16px;padding:9px;margin-bottom:12px;
    font-family:'Fredoka';font-weight:600;font-size:17px;
  }
  .vault .code{letter-spacing:4px;background:#33305E;color:#FFD35C;border-radius:8px;padding:3px 10px;font-size:19px}
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ans{
    border:3px solid var(--ink);border-radius:16px;background:var(--card);box-shadow:var(--shadow);
    font-family:'Fredoka';font-weight:600;font-size:19px;padding:12px;cursor:pointer;text-align:center;color:var(--ink);
  }
  .ans:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .ans.wrong{background:#FFD6CE;animation:wob .3s}
  @keyframes wob{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip{
    border:3px solid var(--ink);border-radius:999px;background:var(--card);box-shadow:var(--shadow);
    padding:10px 14px;font-family:'Fredoka';font-weight:600;font-size:15px;cursor:pointer;
    display:flex;gap:7px;align-items:center;color:var(--ink);
  }
  .chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .chip .em{font-size:19px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .rowcard{
    border:3px solid var(--ink);border-radius:16px;background:var(--card);box-shadow:var(--shadow);
    padding:10px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;font-weight:800;
    font-size:14px;text-align:left;font-family:'Nunito';color:var(--ink);
  }
  .rowcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .rowcard .em{font-size:22px}
  .rowcard.idea{background:var(--idea)}
  .rowcard.icec{background:var(--ice)}
  .rowcard.cantafford{opacity:.55;background:#F2F1F6}
  .cta{
    border:3px solid var(--ink);border-radius:18px;background:var(--sun);box-shadow:var(--shadow);
    font-family:'Fredoka';font-weight:600;font-size:16.5px;padding:13px;cursor:pointer;width:100%;
    color:var(--ink);margin-top:11px;
  }
  .cta.mint{background:var(--idea)}
  .cta.ghost{background:var(--card)}
  .cta.ice{background:var(--ice)}
  .cta:disabled{opacity:.45}
  .cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  textarea{
    width:100%;border:3px solid var(--ink);border-radius:14px;padding:11px;font-family:'Nunito';
    font-weight:800;font-size:15px;background:var(--card);color:var(--ink);resize:none;min-height:74px;line-height:1.5;
    user-select:text;-webkit-user-select:text;
  }
  input[type=text],input[type=date]{
    width:100%;border:3px solid var(--ink);border-radius:14px;padding:10px;font-family:'Nunito';
    font-weight:800;font-size:15px;background:var(--card);color:var(--ink);margin-bottom:12px;
    user-select:text;-webkit-user-select:text;
  }
  input[type=range]{accent-color:var(--sun);height:30px}
  .speech{
    border:3px solid var(--ink);border-radius:20px;background:#FFF3D6;padding:11px 14px;
    font-weight:800;font-size:15px;line-height:1.6;margin-bottom:12px;text-align:center;
  }
  .sentence{
    border:3px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:var(--shadow);
    padding:13px;font-family:'Fredoka';font-weight:600;font-size:17px;line-height:1.6;text-align:center;margin-bottom:8px;
  }
  .sentence b{background:var(--sun);border-radius:7px;padding:0 5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .sentence b.i{background:var(--idea)}
  .hintline{
    text-align:center;font-weight:800;font-size:12.5px;background:#FFF3D6;border:2.5px dashed var(--ink);
    border-radius:12px;padding:7px 10px;margin-bottom:10px;line-height:1.45;
  }
  .hintline.mint{background:var(--idea)}
  .agegroup{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .ageopt{
    border:3px solid var(--ink);border-radius:14px;padding:8px 11px;cursor:pointer;display:flex;
    justify-content:space-between;align-items:center;font-weight:800;font-size:13.5px;background:var(--card);
  }
  .ageopt small{display:block;font-weight:700;opacity:.65;font-size:11px;margin-top:2px}
  .ageopt.sel{background:#FFF3D6;box-shadow:inset 0 0 0 2px var(--sun)}
  label.fieldlbl{font-weight:800;font-size:12.5px;display:block;margin-bottom:5px}
  .seg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .seg .sopt{
    border:3px solid var(--ink);border-radius:13px;padding:8px 10px;text-align:center;
    font-weight:800;font-size:12.5px;cursor:pointer;background:var(--card);flex:1 1 40%;
  }
  .seg .sopt.sel{background:#FFF3D6;box-shadow:inset 0 0 0 2px var(--sun)}
  .tinynote{font-size:11px;font-weight:700;opacity:.6;text-align:center;margin-top:9px;line-height:1.5}
  .crew{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:24px;margin:7px 0}
  .scoreline{font-family:'Fredoka';font-weight:600;text-align:center;font-size:16px;margin-bottom:6px}
  .hlw{border-radius:5px;padding:0 1px}
  .hlw.on{background:var(--sun)}

  /* ---------- ART ---------- */
  #artcv{border:3px solid var(--ink);border-radius:16px;background:#fff;touch-action:none;display:block;margin:0 auto 8px;cursor:crosshair}
  .palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
  .swatch{width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}
  .swatch.sel{box-shadow:0 0 0 3px var(--sun)}
  .arttools{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:4px}
  .toolb{
    border:3px solid var(--ink);border-radius:12px;background:var(--card);padding:5px 10px;
    font-weight:800;font-size:12.5px;cursor:pointer;box-shadow:0 3px 0 var(--ink);color:var(--ink);
  }
  .toolb.sel{background:#FFF3D6}
  .toolb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .palname{text-align:center;font-weight:800;font-size:12px;opacity:.7;margin-bottom:6px}

  /* ---------- SPELLING ---------- */
  .wordrow{display:flex;gap:7px;justify-content:center;margin-bottom:13px;flex-wrap:wrap}
  .letterbox{
    width:42px;height:50px;border:3px solid var(--ink);border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-family:'Fredoka';font-weight:700;font-size:25px;background:var(--card);
  }
  .letterbox.blank{background:#FFF3D6;border-style:dashed}
  .letterbox.blank.active{box-shadow:0 0 0 3px var(--sun);animation:blinkb 1s infinite}
  @keyframes blinkb{50%{box-shadow:0 0 0 3px transparent}}
  .letterbox.filled{background:var(--idea);border-style:solid}
  /* the picture IS the clue — make it huge */
  .spellpic{
    font-size:120px;text-align:center;line-height:1.05;margin:2px 0 10px;
    filter:drop-shadow(0 6px 0 rgba(51,48,94,.18));
  }
  .letterchoices{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .lchip{
    width:38px;height:38px;border:3px solid var(--ink);border-radius:11px;background:var(--card);
    box-shadow:0 3px 0 var(--ink);font-family:'Fredoka';font-weight:700;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .lchip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .lchip.wrong{background:#FFD6CE;animation:wob .3s}
  .lchip.used{opacity:.3;pointer-events:none}

  /* ---------- BELLY BEAR ---------- */
  #breathsvg{display:block;margin:0 auto 8px;max-width:100%}
  .breathphase{font-family:'Fredoka';font-weight:600;font-size:21px;text-align:center;margin-bottom:4px}
  .breathmeta{display:flex;justify-content:center;gap:18px;font-weight:800;font-size:14px;opacity:.75;margin-bottom:8px}

  /* ---------- SPEAKER BUTTONS on any text ---------- */
  .spkr{
    display:inline-flex;align-items:center;justify-content:center;margin-left:7px;
    width:26px;height:26px;border:2.5px solid var(--ink);border-radius:50%;background:#FFF3D6;
    font-size:13px;cursor:pointer;vertical-align:middle;box-shadow:0 2px 0 var(--ink);
  }
  .spkr:active{transform:translateY(2px);box-shadow:none}

  /* tap zone over the plane — spends a kindness shield */
  #planetap{
    position:fixed;left:50%;transform:translateX(-50%);
    width:190px;height:150px;z-index:4;display:none;cursor:pointer;
  }
  #planetap.show{display:block}

  /* ---------- RADAR / COMPASS ---------- */
  /* BUGFIX: the radar was at top:46px, exactly on top of the four HUD buttons
     at top:42px — and with z-index 8 against their 5, it swallowed the taps.
     The 🔊 sound and ↻ reset buttons were completely unreachable. It now sits
     UNDER the button row. */
  #compass{
    position:fixed;top:94px;right:8px;z-index:8;cursor:pointer;display:none;
    filter:drop-shadow(0 4px 0 rgba(51,48,94,.25));
  }
  #compass.show{display:block}
  #cpMiles{
    position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
    background:var(--sun);border:2.5px solid var(--ink);border-radius:999px;
    font-family:'Fredoka';font-weight:600;font-size:11px;padding:1px 9px;white-space:nowrap;
  }
  #cpPulse{animation:cppulse 1.6s infinite}
  @keyframes cppulse{
    0%{r:8;opacity:.55}
    70%{r:20;opacity:0}
    100%{r:8;opacity:0}
  }
  #compass.wrongway #cpPlaneShape{fill:#FFB3AA;stroke:#E8564A}
  #compass.wrongway #cpLine{stroke:#E8564A}
  #cpSweep{animation:cpsweep 3.4s linear infinite;transform-origin:60px 60px}
  @keyframes cpsweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  #compass.wrongway{animation:cpwarn .8s infinite}
  @keyframes cpwarn{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  /* ---------- MEMORY / PATTERN / SPINNER ---------- */
  .memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
  .memcard{aspect-ratio:1;font-size:24px;border-radius:12px;border:3px solid var(--ink);
    background:#EAF1FF;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .memcard.up{background:#FFF3D6}
  .memcard.done{background:#DFF3E6;opacity:.6}
  .patgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
  .patkey{aspect-ratio:1;font-size:30px;border-radius:14px;border:3px solid var(--ink);
    background:#F4F4FA;cursor:pointer}
  .patkey.lit{background:#FFE39A;transform:scale(1.08)}
  .patkey:disabled{opacity:.55;cursor:default}
  .spinwrap{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
  .spinbtn{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:#EAF1FF;
    font-size:28px;font-weight:900;cursor:pointer;line-height:1;color:var(--ink)}
  .spinval{font-size:56px;font-weight:900;min-width:110px;text-align:center;color:var(--ink);
    font-family:'Nunito',sans-serif;letter-spacing:-1px}

  /* ---------- COCKPIT INSTRUMENT PANEL ---------- */
  #panel{
    position:fixed;left:8px;right:8px;bottom:112px;z-index:5;display:none;
    gap:7px;justify-content:center;flex-wrap:nowrap;pointer-events:none;
  }
  .gauge{
    background:#2E2B4D;border:3px solid #191731;border-radius:14px;box-shadow:0 4px 0 #191731, inset 0 2px 6px rgba(255,255,255,.08);
    min-width:52px;padding:5px 7px;text-align:center;color:#CFE6FF;flex:0 1 auto;
  }
  .gauge .glbl{font-size:9px;font-weight:800;letter-spacing:1px;opacity:.7}
  .gauge .gval{font-family:'Fredoka';font-weight:600;font-size:15px;line-height:1.15}
  .gauge.tap{pointer-events:auto;cursor:pointer}
  .gauge.tap:active{transform:translateY(2px)}
  .gauge.calm{background:#173A52}
  .gauge.calm.alert{animation:gpulse .9s infinite;background:#1E5A7A}
  @keyframes gpulse{0%,100%{box-shadow:0 4px 0 #191731,0 0 0 0 rgba(120,220,255,.6)}50%{box-shadow:0 4px 0 #191731,0 0 0 8px rgba(120,220,255,0)}}
  .gauge.warng.alert{background:#5A1E1E;animation:wblink .5s infinite}
  @keyframes wblink{50%{background:#8A2727}}
  .gauge.radar.alert{background:#1E5A32;animation:rblink 1s infinite}
  @keyframes rblink{50%{background:#2A7A45}}
  .gbar{height:6px;border-radius:4px;background:#191731;overflow:hidden;margin-top:3px}
  .gbar>div{height:100%;background:#6FD3FF;width:0%}

  /* ---------- BELLY METER (accelerometer) ---------- */
  .bellyMeterWrap{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
  #bellyMeter{
    width:150px;height:16px;border:3px solid var(--ink);border-radius:10px;background:#EDEAF7;overflow:hidden;
  }
  #bellyMeterFill{height:100%;width:50%;background:linear-gradient(90deg,#8FB8E8,#B9E8D8);transition:width .12s}
  .verTicks{font-size:17px;letter-spacing:2px;min-width:70px}

  /* ---------- AUTOPILOT IF/THEN BLOCKS ---------- */
  .apblock{border:3px solid var(--ink);border-radius:16px;padding:9px;background:#EDEAF7}
  .apif{
    font-family:'Fredoka';font-weight:600;font-size:14px;background:var(--ink);color:#FFD35C;
    border-radius:10px;padding:6px 10px;margin-bottom:7px;text-align:center;
  }
  .apthen{
    display:block;width:100%;border:3px solid var(--ink);border-radius:12px;background:var(--card);
    font-weight:800;font-size:13px;padding:8px 10px;margin-bottom:6px;cursor:pointer;color:var(--ink);
    text-align:left;font-family:'Nunito';
  }
  .apthen.sel{background:var(--idea);box-shadow:inset 0 0 0 2px var(--sun)}
  .apthen:active{transform:translateY(2px)}

  /* ---------- PRE-FLIGHT HANGAR CHECK ---------- */
  #pffield{
    position:relative;height:200px;border:3px solid var(--ink);border-radius:18px;
    background:linear-gradient(180deg,#CDEBFF,#E8F6FF);overflow:hidden;
  }
  .pfglass{position:absolute;inset:0 0 34% 0;overflow:hidden;border-radius:15px 15px 0 0}
  .pfstain{
    position:absolute;width:44px;height:34px;cursor:grab;
    border-radius:48% 52% 42% 58% / 55% 45% 55% 45%;
    transition:opacity .18s,transform .18s;
  }
  .pfstain.oil{background:radial-gradient(circle at 35% 35%, #6B5B4B, #33291F);opacity:.85}
  .pfstain.mud{background:radial-gradient(circle at 40% 40%, #A0784A, #5C4227);opacity:.85}
  .pfstain.bug{background:radial-gradient(circle at 45% 40%, #7A8B4A, #3E4A22);opacity:.85}
  .pfstain::after{
    content:'';position:absolute;right:-7px;top:6px;width:14px;height:11px;border-radius:50%;
    background:inherit;opacity:.8;
  }
  .pfledge{
    position:absolute;left:0;right:0;bottom:0;height:32%;
    background:linear-gradient(#C9D2E0,#9FAABD);border-top:3px solid var(--ink);
    border-radius:0 0 15px 15px;display:flex;align-items:center;justify-content:space-around;
  }
  .pfnail{font-size:30px;cursor:pointer;transition:transform .12s;display:inline-block}
  .pfnail.whack{animation:whack .18s}
  @keyframes whack{0%{transform:translateY(-8px) scale(1.15)}100%{transform:translateY(0) scale(1)}}

  /* ---------- RIGHT-SIDE STATS DRAWER ---------- */
  #drawerTab{
    position:fixed;right:0;top:44%;z-index:7;
    background:var(--sun);border:3px solid var(--ink);border-right:none;
    border-radius:16px 0 0 16px;box-shadow:-3px 4px 0 var(--ink);
    padding:12px 7px;cursor:pointer;font-size:17px;line-height:1.25;text-align:center;
    writing-mode:vertical-rl;font-family:'Fredoka';font-weight:600;
  }
  #drawerTab.flash{animation:tabflash .5s ease}
  @keyframes tabflash{0%,100%{transform:scale(1)}45%{transform:scale(1.25);background:#B9E8D8}}
  #drawer{
    position:fixed;right:0;top:0;bottom:0;width:212px;z-index:8;
    background:rgba(255,255,255,.97);border-left:3px solid var(--ink);
    box-shadow:-6px 0 0 rgba(51,48,94,.18);
    transform:translateX(100%);transition:transform .28s cubic-bezier(.3,1.3,.6,1);
    padding:14px 12px;overflow-y:auto;
  }
  #drawer.open{transform:translateX(0)}
  /* always reachable — sticks to the top of the drawer, never needs scrolling */
  #drawerX{
    position:sticky;top:0;z-index:2;width:100%;margin-bottom:8px;
    border:3px solid var(--ink);border-radius:14px;background:var(--sun);
    font-family:'Fredoka';font-weight:600;font-size:14px;padding:9px;cursor:pointer;
    box-shadow:0 3px 0 var(--ink);color:var(--ink);
  }
  #drawerX:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  #drawer h3{font-family:'Fredoka';font-weight:600;font-size:16px;text-align:center;margin-bottom:10px}
  .drow{
    display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:14px;
    background:var(--card);padding:7px 9px;margin-bottom:8px;font-weight:800;font-size:13px;
    box-shadow:0 3px 0 var(--ink);
  }
  .drow .dem{font-size:19px}
  .drow .dval{margin-left:auto;font-family:'Fredoka';font-weight:600;font-size:16px}
  .drow.bank{background:#EDEAF7;display:block}
  .drow.calm{background:#E4F3FC}
  .drow.calm svg{flex-shrink:0}
  .drow.bank .bk{display:flex;justify-content:space-between;font-size:12px;margin-top:3px}
  .accounts{
    position:relative;border:3px solid var(--ink);border-radius:16px;background:#EDEAF7;
    padding:10px 12px;margin-bottom:10px;
  }
  .acctrow{
    display:flex;justify-content:space-between;align-items:center;
    font-weight:800;font-size:13.5px;padding:3px 0;padding-right:34px;
  }
  .acctrow b{font-family:'Fredoka';font-weight:600;font-size:16px}
  .acctspk{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
  .rspk{
    display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
    border:2.5px solid var(--ink);border-radius:50%;background:#FFF3D6;
    margin-left:7px;cursor:pointer;flex-shrink:0;box-shadow:0 2px 0 var(--ink);
  }
  .rspk:active{transform:translateY(2px);box-shadow:none}
  .rspk svg{width:12px;height:12px}
  .spk-mini{
    display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
    border:2px solid var(--ink);border-radius:50%;background:#FFF3D6;font-size:10px;margin-left:6px;cursor:pointer;
  }
  #drawerClose,.drawerbtn{
    border:3px solid var(--ink);border-radius:14px;background:#FFE9B8;width:100%;
    font-family:'Fredoka';font-weight:600;font-size:14px;padding:9px;cursor:pointer;
    box-shadow:0 3px 0 var(--ink);color:var(--ink);
  }
  #drawerClose{background:var(--sun)}
  #drawerClose:active,.drawerbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

  /* flying +/- score chip that sails into the drawer */
  .flychip{
    position:fixed;z-index:9;font-family:'Fredoka';font-weight:700;font-size:38px;
    border:4px solid var(--ink);border-radius:18px;padding:8px 16px;
    box-shadow:0 5px 0 var(--ink);pointer-events:none;
    animation:flyToDrawer 1.5s cubic-bezier(.4,0,.5,1) forwards;
  }
  .flychip.plus{background:#B9E8D8}
  .flychip.minus{background:#FFD6CE}
  @keyframes flyToDrawer{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
    18%{transform:translate(-50%,-50%) scale(1.35);opacity:1}
    45%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
    100%{
      left:calc(100% - 30px);top:46%;
      transform:translate(-50%,-50%) scale(.18);opacity:0;
    }
  }

  /* ---------- MISSION BRIEFING ---------- */
  .misslist{list-style:none;margin:0 0 12px}
  .misslist li{
    display:flex;gap:9px;align-items:flex-start;border:3px solid var(--ink);border-radius:14px;
    background:#FFF3D6;padding:9px 11px;margin-bottom:8px;font-weight:800;font-size:13.5px;line-height:1.5;
  }
  .misslist li .mi{font-size:20px;flex-shrink:0}

  /* ---------- ROUTE PLANNER ---------- */
  .routegrid{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
  .routecard{
    border:3px solid var(--ink);border-radius:16px;background:var(--card);box-shadow:var(--shadow);
    padding:10px 12px;cursor:pointer;text-align:left;font-weight:800;font-size:13.5px;color:var(--ink);
    display:flex;gap:10px;align-items:center;font-family:'Nunito';
  }
  .routecard .rem{font-size:26px}
  .routecard small{display:block;font-weight:700;opacity:.7;font-size:11.5px;margin-top:2px}
  .routecard.sel{background:#FFF3D6;box-shadow:inset 0 0 0 3px var(--sun),var(--shadow)}
  .routecard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

  /* ---------- ARCHERY: two archers, one resting ---------- */
  .archstage{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-bottom:8px}
  .archer{
    flex:1;border:3px solid var(--ink);border-radius:18px;padding:8px 4px;text-align:center;
    transition:transform .3s, background .3s, opacity .3s;
  }
  .archer.active{
    background:#FFF3D6;transform:translateY(-6px) scale(1.04);
    box-shadow:var(--shadow),0 0 0 3px var(--sun);
  }
  .archer.resting{background:#EDEAF7;opacity:.62;transform:translateY(6px) scale(.94)}
  .archface{font-size:34px;line-height:1}
  .archer.resting .archface{filter:grayscale(.5)}
  .archbow{font-size:22px;line-height:1.2}
  .archer.active .archbow{animation:bowdraw 1.1s infinite}
  @keyframes bowdraw{0%,100%{transform:scale(1)}50%{transform:scale(1.22) rotate(-8deg)}}
  .archname{font-family:'Fredoka';font-weight:600;font-size:13px;margin-top:2px}
  .archstate{
    font-weight:800;font-size:9.5px;letter-spacing:.6px;margin-top:2px;
    padding:2px 4px;border-radius:8px;
  }
  .archer.active .archstate{background:var(--sun);color:var(--ink)}
  .archer.resting .archstate{background:#D8D4E8;color:#6A6688}
  .archvs{font-size:24px;padding-bottom:22px}
  .archnote{
    text-align:center;font-weight:800;font-size:12.5px;background:#FFF3D6;
    border:2.5px dashed var(--ink);border-radius:12px;padding:6px 8px;margin-bottom:9px;min-height:19px;
  }

  /* ---------- ARRIVAL: the village receives the cargo ---------- */
  .village{
    position:relative;height:230px;border:3px solid var(--ink);border-radius:20px;overflow:hidden;
    background:linear-gradient(#8FD4F2 0%,#CFEAF7 55%,#D8C9A8 55%,#C4B492 100%);margin-bottom:12px;
  }
  .vsky{position:absolute;inset:0 0 45% 0}
  .vplane{position:absolute;top:14%;left:-40px;font-size:34px;animation:vfly 4s ease-out forwards}
  @keyframes vfly{to{left:72%;top:8%}}
  .vbox{position:absolute;font-size:20px;opacity:0}
  .vbox.b1{left:30%;animation:vdrop 1.6s 1.4s ease-in forwards}
  .vbox.b2{left:44%;animation:vdrop 1.6s 1.9s ease-in forwards}
  .vbox.b3{left:57%;animation:vdrop 1.6s 2.4s ease-in forwards}
  @keyframes vdrop{0%{top:12%;opacity:1}100%{top:52%;opacity:1;transform:rotate(20deg)}}
  .vground{position:absolute;inset:45% 0 0 0}
  .vmount{position:absolute;top:-46px;left:4%;font-size:44px;opacity:.55}
  .vmount.m2{left:74%;font-size:36px;top:-38px}
  .vtent{position:absolute;top:6px;left:8%;font-size:24px}
  .vtent.t2{left:80%;font-size:22px}
  .vkids{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:4px}
  .vkid{font-size:32px;transform-origin:bottom center}
  .vkid.k1{animation:vwave 1.1s 2.6s infinite}
  .vkid.k2{animation:vwave 1.1s 2.8s infinite}
  .vkid.k3{font-size:36px;animation:vwave 1.3s 3.0s infinite}
  .vkid.k4{animation:vwave 1.1s 3.2s infinite}
  .vkid.k5{animation:vwave 1.2s 3.4s infinite}
  @keyframes vwave{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  .vhearts{position:absolute;bottom:44px;left:0;right:0;display:flex;justify-content:center;gap:18px}
  .vhearts span{font-size:16px;opacity:0;animation:vheart 2.6s infinite}
  .vhearts span:nth-child(1){animation-delay:3.0s}
  .vhearts span:nth-child(2){animation-delay:3.3s}
  .vhearts span:nth-child(3){animation-delay:3.6s}
  .vhearts span:nth-child(4){animation-delay:3.9s}
  .vhearts span:nth-child(5){animation-delay:4.2s}
  @keyframes vheart{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-38px) scale(1.2)}}

  /* ---------- WELCOME BACK ---------- */
  .resumegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
  .rcard{
    border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--ink);
    padding:8px 4px;text-align:center;
  }
  .rcard .rem{font-size:20px;display:block;line-height:1}
  .rcard b{font-family:'Fredoka';font-weight:600;font-size:19px;display:block;line-height:1.2}
  .rcard small{font-weight:800;font-size:9.5px;opacity:.65}

  /* ---------- THE DASHBOARD ---------- */
  .dashhead{
    background:linear-gradient(135deg,#33305E,#4A4580);color:#FFF3D6;
    border:3px solid var(--ink);border-radius:18px;padding:10px 12px;margin-bottom:10px;text-align:center;
  }
  .dashwho{font-family:'Fredoka';font-weight:600;font-size:17px}
  .dashsub{font-weight:800;font-size:11px;opacity:.75;margin-top:2px}
  .dashtabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .dtab{
    flex:1 1 0;min-width:52px;border:3px solid var(--ink);border-radius:13px;background:var(--card);
    padding:6px 3px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--ink);
  }
  .dtab small{font-size:8.5px;font-weight:800;letter-spacing:.2px}
  .dtab.on{background:var(--sun);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .dashgrp{border:3px solid var(--ink);border-radius:18px;background:#F7F5FC;padding:11px;margin-bottom:10px}
  .dashgrpname{font-family:'Fredoka';font-weight:600;font-size:15px;margin-bottom:9px;text-align:center}
  .dfield{margin-bottom:11px}
  .dfield label{display:block;font-weight:800;font-size:12px;margin-bottom:4px}
  .drow2{display:flex;align-items:center;gap:8px}
  .drow2 input[type=range]{flex:1;accent-color:var(--sun);height:26px}
  .drow2 input[type=number]{
    width:74px;border:3px solid var(--ink);border-radius:11px;padding:6px;margin:0;
    font-family:'Fredoka';font-weight:600;font-size:14px;text-align:center;background:#FFF3D6;color:var(--ink);
  }
  .dsel{
    width:100%;border:3px solid var(--ink);border-radius:12px;padding:9px;margin-bottom:10px;
    font-family:'Nunito';font-weight:800;font-size:14px;background:var(--card);color:var(--ink);
  }

  /* ---------- GET READY TO FOCUS ---------- */
  .focusroom{
    position:relative;border:3px solid var(--ink);border-radius:16px;background:#F7F5FC;
    padding:9px;margin-bottom:10px;min-height:190px;
  }
  .frow{
    display:flex;align-items:center;gap:9px;width:100%;padding:10px;border-radius:12px;
    border:3px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);
    font-weight:800;font-size:13px;margin-bottom:6px;cursor:pointer;color:var(--ink);
    font-family:'Nunito';text-align:left;
  }
  .frow.now{background:#FFF3D6;box-shadow:0 3px 0 var(--ink),inset 0 0 0 2.5px var(--sun);animation:nowpulse 1.3s infinite}
  .frow.done{background:#DFF3E6;opacity:.85}
  .frow.later{opacity:.4;box-shadow:none}
  .frow:disabled{cursor:default}
  .fem{font-size:22px}
  .flabel{flex:1}
  .ftick{font-size:15px}
  .distract{
    position:absolute;font-size:30px;border:none;background:transparent;cursor:pointer;
    animation:distractin .35s ease, jitter .8s .35s infinite alternate;z-index:2;
  }
  @keyframes distractin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
  @keyframes jitter{from{margin-top:-3px}to{margin-top:4px}}

  /* ---------- RESET & RETURN ---------- */
  .resetsteps{margin-bottom:10px}
  .rstep{
    display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:14px;
    padding:7px 10px;margin-bottom:6px;font-weight:800;font-size:12.5px;background:#F3F1FB;opacity:.5;
  }
  .rstep.now{opacity:1;background:#FFF3D6;box-shadow:inset 0 0 0 2.5px var(--sun)}
  .rstep.done{opacity:1;background:#DFF3E6}
  .rdots{margin-left:auto;letter-spacing:2px;font-size:13px}
  .sensebody{border:3px solid var(--ink);border-radius:16px;background:#F7F5FC;padding:8px;margin-bottom:10px}
  .sensepart{
    display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;
    font-weight:800;font-size:13.5px;margin-bottom:5px;opacity:.4;
  }
  .sensepart.now{opacity:1;background:#FFF3D6;box-shadow:inset 0 0 0 2.5px var(--sun);animation:nowpulse 1.4s infinite}
  .sensepart.done{opacity:1;background:#DFF3E6}
  .sem{font-size:24px}
  .stick{margin-left:auto}

  /* ---------- TIC-TAC-TOE ---------- */
  .tttturn{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:9px}
  .tttp{
    flex:1;border:3px solid var(--ink);border-radius:16px;padding:7px 4px;text-align:center;
    transition:all .25s;
  }
  .tttp.active{background:#FFF3D6;box-shadow:var(--shadow),0 0 0 3px var(--sun);transform:translateY(-4px)}
  .tttp.resting{background:#EDEAF7;opacity:.6;transform:translateY(4px) scale(.95)}
  .tttface{font-size:28px;line-height:1}
  .tttname{font-family:'Fredoka';font-weight:600;font-size:12.5px}
  .tttstate{font-weight:800;font-size:9px;letter-spacing:.5px;margin-top:2px;padding:2px;border-radius:7px}
  .tttp.active .tttstate{background:var(--sun)}
  .tttp.resting .tttstate{background:#D8D4E8;color:#6A6688}
  .tttvs{font-size:20px}
  .tttgrid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
    max-width:250px;margin:0 auto 10px;
  }
  .tttcell{
    aspect-ratio:1;border:3px solid var(--ink);border-radius:14px;background:var(--card);
    box-shadow:0 3px 0 var(--ink);font-size:32px;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .tttcell:disabled{cursor:default}
  .tttcell:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .tttcell.taken{background:#F3F1FB}
  .tttcell.win{background:#B9E8D8;animation:nowpulse .8s infinite}

  /* ---------- SHOP PRICES ---------- */
  .shopname{flex:1;text-align:left}
  .shopcost{
    font-family:'Fredoka';font-weight:600;font-size:15px;
    border:2.5px solid var(--ink);border-radius:10px;padding:3px 8px;white-space:nowrap;
  }
  .shopcost small{font-size:10px;font-weight:800;opacity:.7}
  .shopcost.ok{background:#B9E8D8}
  .shopcost.no{background:#FFD6CE}

  /* ---------- BUILD IT TOGETHER ---------- */
  .buildwrap{border:3px solid var(--ink);border-radius:16px;background:#F7F5FC;padding:8px;margin-bottom:10px}
  .brung{
    display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:11px;
    font-weight:800;font-size:12.5px;margin-bottom:4px;opacity:.42;
  }
  .brung.done{opacity:1;background:#DFF3E6}
  .brung.now{opacity:1;background:#FFF3D6;box-shadow:inset 0 0 0 2.5px var(--sun);animation:nowpulse 1.3s infinite}
  @keyframes nowpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  .bwho{
    width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
  }
  .bwho.pip{background:#FFD9B8}
  .bwho.you{background:#B9E8D8}
  .bem{font-size:17px}
  .bact{flex:1;text-align:left}
  .btick{font-size:14px}

  /* ---------- SAY IT RIGHT ---------- */
  .sayopt{transition:transform .15s, background .15s}
  .sayopt.playing{
    background:#FFF3D6;transform:scale(1.04);
    box-shadow:inset 0 0 0 3px var(--sun),var(--shadow);
  }
  .sayopt.playing .em{animation:speakerpulse .5s infinite}
  @keyframes speakerpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
  .sayopt .em{
    width:28px;height:28px;border-radius:50%;background:var(--ink);color:#FFD35C;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-family:'Fredoka';
  }

  .confetti{position:fixed;top:-20px;font-size:22px;pointer-events:none;animation:fall 2.4s linear forwards;z-index:20}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body>
<div id="game"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="hudcol">
    <div class="hudbox">🎚️ LV <b id="level">1</b> &nbsp;<span id="hearts">⚙️⚙️⚙️⚙️</span></div>
    <!-- BUGFIX: updateHUD() wrote to #zoneem / #zonename / #weatherphase, but
         those elements did not exist, so the zone and the weather were never
         shown anywhere. This box gives them a home. -->
    <div class="hudbox"><span id="zoneem">🏙️</span> <span id="zonename">Downtown</span>
      &nbsp;<span id="weatherphase">Sunny</span></div>

/* ═════════════════════════════════════════════════════════════════════════════
   SKY RESCUE 707 — single-file educational flying game            (v5, fixed)
   ─────────────────────────────────────────────────────────────────────────────
   FLYING      Pseudo-3D chase view + 🧑‍✈️ cockpit view with live instruments.
               Fixed joystick (bottom-left), 🚀 boost (locked with wheels down),
               🛞 landing gear. Four zones chosen by real world position, and a
               weather wheel: Sunny (rescues ×1.5) / Windy / Stormy / Calm.

   RESCUES     🆘 animals appear; fly LOW with WHEELS DOWN to land beside them.
               One of these challenges then unlocks the rescue (toggle in ⚙️):
               🧮 vault math · 💛 feelings (NVC) · 🎨 trace & paint ·
               🔤 word builder · 🧸 belly-bear breathing · 🤝 sharing ·

   HAZARDS     🦅 eagle → ⛈️ storm → 🐉 dragon → 🛩️ jet → 🌀 hurricane →
               ☄️ asteroid → 🛰️ satellite → 🚀 missile → 🌞 solar flare.
               Each unlocks by level, announces itself, and makes 2–3 runs.

   CALM POWER  Earned by calm exercises, spent automatically to soak up hits.
               It shows as a glow around the plane and fades if not topped up.

   DAMAGE      Engines, not hearts. Two hits kill one engine. One engine left
               → emergency: land low with wheels. Zero → crash & recover.

   MONEY       Every reward is split 50% REPAIRS / 30% FUN / 20% SAVINGS.
               Savings earn interest and buy the GOLDEN 707.

   READING     Everything is read aloud with word-by-word highlighting, and a
               speaker button sits on every heading, sentence and choice.
               ⏭️ skip ends any long read. ↻ (double-tap) restarts.

   PARENTS     Drop sky-rescue-settings.js beside this file to override word
               lists, praise lines, prices and pacing — see DEFAULT_CONFIG.
               Or use ⚙️ → 🎛️ dashboard to change any of it live, per pilot.
   ═════════════════════════════════════════════════════════════════════════════ */

/* ═══════════ CONFIG — everything a parent may want to tune.

       ['CARROT','🥕'],['BANANA','🍌'],['ORANGE','🍊'],['TIGER','🐅'],['ZEBRA','🦓'],['KOALA','🐨'],['PANDA','🐼']],
    /* 8+ letters, richer vocabulary */
    o:[['ELEPHANT','🐘'],['MOUNTAIN','⛰️'],['BUTTERFLY','🦋'],['ADVENTURE','🗺️'],['LIGHTHOUSE','🗼'],['DINOSAUR','🦕'],
       ['TELESCOPE','🔭'],['SUBMARINE','🚤'],['HELICOPTER','🚁'],['CROCODILE','🐊'],['KANGAROO','🦘'],['FLAMINGO','🦩'],
       ['HEDGEHOG','🦔'],['SQUIRREL','🐿️'],['PARACHUTE','🪂'],['MICROSCOPE','🔬'],['ASTRONAUT','👨‍🚀'],['HURRICANE','🌀'],
       ['WATERFALL','💦'],['SUNFLOWER','🌻'],['STRAWBERRY','🍓'],['PINEAPPLE','🍍'],['CHOCOLATE','🍫'],['SANDWICH','🥪'],
       ['SKELETON','💀'],['TREASURE','💰'],['COMPASS','🧭'],['SATELLITE','🛰️'],['JELLYFISH','🪼'],['PEACOCK','🦚'],
       ['ORCHESTRA','🎻'],['LIBRARY','📚'],['MOUNTAINS','🏔️'],['CATERPILLAR','🐛']]
  },
  /* SIMPLIFIED: short praise a six-year-old hears in one go */
  praise:['Great focus!','You tried so hard!','You kept going!','Your practice is working!','Lovely trying!','You thought hard about that!','Nice thinking!','You stuck with it!'],
  notYet:['Not yet — try again!','Not yet. Have another go!','Not yet — you are learning!','Not yet. Try once more!'],

  /* ── THE JOURNEY ─────────────────────────────────────────────────────────
     The mission is a real distance. The plane covers ground as it flies.      */
  missionDistance:    40,    // miles to the village that needs help

  interestEveryMinutes:10,   // the bank pays interest every N MINUTES of play
  interestPercent:    10,    // ...adding this % to the SAVINGS account

  /* ── HOW EVERY REWARD IS SPLIT (must add up to 1) ────────────────────────

  splitRepairs:      0.5,    // half → fixing the plane
  splitFun:          0.3,    // for paint and stickers
  splitSavings:      0.2,    // quietly saved for the golden plane

  /* ── REWARDS ─────────────────────────────────────────────────────────────*/
  rescuePoints:       20,    // a full rescue — deliberately modest
  ideaBonus:          10,    // inventing his own kind idea
  hazardHitPenalty:   15,    // lost when an engine is knocked out
  freezeOnePoints:    10,    // calming one troublemaker
  freezeAllPoints:    25,    // calming the whole sky

  preflightPoints:     8,    // doing the pre-flight check
  sunnyMultiplier:   1.5,    // rescues in sunny weather
  rareMultiplier:    2,      // rescues on the storm route
  crashRepairCost:   250,    // the crew fixing a crash
  arrivalBonus:      120,    // delivering the medicine
  flareDodgePoints:   25,    // diving under a solar flare
  realBreathBonus:    20,    // 3+ real tummy breaths, checked by the phone
  teamBonus:          40,    // building something together with Pip

  /* ── SPENDING: expensive on purpose, so a purchase is a real decision ──── */
  engineCostRepair:  120,    // fix one engine     (REPAIRS)  ≈ 12 rescues
  engineCostNew:     400,    // a whole new engine (REPAIRS)

  /* ── SAVED PROGRESS ──────────────────────────────────────────────────────
     Profiles and their saved status. The game loads these at start-up and
     saves back to the device as he plays. Paste an exported snippet here to
     carry progress to a different device.                                    */

    aaries:{ name:'Aaries', dob:'2020-04-16' },

  },
  saved:{}                   // filled in by the game / by an exported snippet

const RAW_SETTINGS=window.SKY_SETTINGS||{};   /* exactly what the parent wrote */
const CFG=(()=>{
  const c=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  const o=RAW_SETTINGS;
  for(const k in o){
    if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])&&c[k]&&!Array.isArray(c[k]))Object.assign(c[k],o[k]);
    else c[k]=o[k];
  }
  return c;
})();
function praise(){return CFG.praise[Math.floor(Math.random()*CFG.praise.length)];}
function notYetLine(){return CFG.notYet[Math.floor(Math.random()*CFG.notYet.length)];}

/* BUGFIX: these two were frozen into consts at load time, so the matching
   dashboard sliders ("How far the calm dial goes", "How fast the plane turns")
   did nothing at all. They are functions now, so a change takes effect at once. */
function calmMax(){ const n=+CFG.calmMax; return (n>0)?n:10; }
function turnRate(){ const n=+CFG.turnRate; return (n>0)?n:0.85; }

/* ═══════════ AGE GROUPS ═══════════
   Inside the code the four age groups are short codes, but in the settings
   file a parent may write ANY of these friendly names instead:

       ages3to4  / toddler / preschool   →  t   (ages 3–4)
       ages5to7  / young   / early       →  y   (ages 5–7)   ← Aaries
       ages8to10 / middle                →  m   (ages 8–10)  ← Sushan
       ages11plus/ older   / teen        →  o   (ages 11+)                   */
const BAND_ALIAS={
  t:'t', ages3to4:'t', '3to4':'t', toddler:'t', preschool:'t',
  y:'y', ages5to7:'y', '5to7':'y', young:'y', early:'y',
  m:'m', ages8to10:'m', '8to10':'m', middle:'m',
  o:'o', ages11plus:'o', '11plus':'o', older:'o', teen:'o'
};
function toBand(k){
  const key=String(k).toLowerCase().replace(/[\s_\-]/g,'');
  return BAND_ALIAS[key]||null;
}
/* turn { ages5to7:[...], m:[...] } into { y:[...], m:[...] } */
function normBands(obj){
  const out={t:[],y:[],m:[],o:[]};
  if(!obj)return out;
  Object.keys(obj).forEach(k=>{
    const b=toBand(k);
    if(b&&Array.isArray(obj[k]))out[b]=out[b].concat(obj[k]);
  });
  return out;
}

/* ═══════════ LOAD EVERYTHING THE PARENT ADDED ═══════════
   Read from RAW_SETTINGS (exactly what they wrote), never from the merged
   config — otherwise the built-in lists would be counted twice.        */
let customSituations=[], customMath={t:[],y:[],m:[],o:[]}, customQuestions=[];
function loadCustomContent(){
  const R=RAW_SETTINGS;

  /* ---- 1. SITUATIONS: one feeling, one need, one resolution ----
     New format:  { situation:'…', feeling:'sad', need:'comfort',
                    resolution:'Give a hug', wrong:['Laugh at them'] }
     The older { fam, tx } shape still works.                          */
  customSituations=(R.extraSituations||[]).map(x=>{
    if(!x)return null;
    const tx=x.situation||x.tx;
    const feeling=x.feeling||x.fam;
    if(!tx||!feeling)return null;
    return {
      tx,
      feeling,
      need: x.need || 'being_heard',
      resolution: x.resolution || x.helps || 'Listen to how they feel',
      wrong: (x.wrong||x.wrongResolutions||[]).map(w=>Array.isArray(w)?w:['🙅',w])
    };
  }).filter(Boolean);

  /* ---- 2. maths, per age group (ADDED) ---- */
  customMath=normBands(R.extraMath);
  ['t','y','m','o'].forEach(b=>{ customMath[b]=customMath[b].filter(x=>x&&x.q&&x.ans!=null); });

  /* ---- 3. any other questions (ADDED) ---- */
  customQuestions=(R.extraQuestions||[]).filter(x=>x&&x.q&&x.ok).map(q=>{
    const c=Object.assign({},q);
    if(c.band){const b=toBand(c.band); if(b)c.band=b; else delete c.band;}
    return c;
  });

  /* ---- 4. spelling words: listing a group REPLACES it ---- */
  const sw=normBands(R.spellWords);
  ['t','y','m','o'].forEach(b=>{ if(sw[b].length)CFG.spellWords[b]=sw[b]; });

  /* ---- 5. FEELING SYNONYMS (ADDED, or a whole new category) ---- */
  const ef=R.feelingWords||R.extraFeelings||{};
  Object.keys(ef).forEach(cat=>{
    const per=normBands(ef[cat]);
    if(!FEELING_SYNS[cat])FEELING_SYNS[cat]={t:[],y:[],m:[],o:[]};
    ['t','y','m','o'].forEach(b=>{
      if(per[b].length)FEELING_SYNS[cat][b]=(FEELING_SYNS[cat][b]||[]).concat(per[b]);
    });
  });

  /* ---- 6. NEED SYNONYMS (ADDED, or a whole new category) ---- */
  const en=R.needWords||R.extraNeeds||{};
  Object.keys(en).forEach(cat=>{
    const per=normBands(en[cat]);
    if(!NEED_SYNS[cat])NEED_SYNS[cat]={t:[],y:[],m:[],o:[]};
    ['t','y','m','o'].forEach(b=>{
      if(per[b].length)NEED_SYNS[cat][b]=(NEED_SYNS[cat][b]||[]).concat(per[b]);
    });
  });

  /* ---- 7. more unkind options for "what will help?" (ADDED) ---- */
  (R.wrongResolutions||R.extraRequestWrong||[]).forEach(w=>{
    RESOLUTION_WRONG.push(Array.isArray(w)?w:['🙅',w]);
  });

  /* ---- 8. extra pilots added in-game are merged with the file's ---- */
  try{
    const extra=JSON.parse(localStorage.getItem('skyRescuePilots')||'{}');
    Object.keys(extra).forEach(id=>{ CFG.profiles[id]=extra[id]; });
  }catch(e){}
}

function pronounce(t){
  let out=String(t);
  for(const k in NAME_SAYS){

    const safe=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp('\\b'+safe+'\\b','gi'),NAME_SAYS[k]);

   kept topped up. When a hazard strikes, the glow spends itself to absorb the
   blow. Kindness rings do the same, in gold.

function normAng(a){ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; }

     relBearing() — which way is the village, from the nose? (0 = dead ahead)

/* which zone the CURRENT position belongs to — a stable hash of a coarse
   world grid cell, so the same patch of world always looks the same,
   whichever direction you flew in from */
const ZONE_SPACING=6.5;   /* world miles per grid cell, each way */
/* BUG FIX: the route the child picks before take-off used to be thrown away
   within 2.2 seconds, because the landscape came purely from this hash and at
   miles 0 the hash always gave the same answer. The route now rotates the
   whole map by zoneOffset, so "over the mountains" really does start over the
   mountains — and the scenery still changes honestly as he flies. */
let zoneOffset=0;
function rawZoneIndex(m,lat){
  const fx=Math.round(m/ZONE_SPACING), fy=Math.round(lat/ZONE_SPACING);
  const h=((fx*2654435761)^(fy*2246822519))>>>0;
  return h%ZONES.length;
}

  const t=Math.pow(1-z,1.9);

  }catch(e){AC=null;}
}
function engineUpdate(){

function tone(freq,dur,type='sine',vol=0.12,when=0,glideTo=null){
  if(!AC||!soundOn)return;
  const t0=AC.currentTime+when;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t0);
  if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g).connect(AC.destination);
  o.start(t0);o.stop(t0+dur+0.05);
}

function noiseBurst(dur,vol,filterFreq,slideTo){
  if(!AC||!soundOn)return;
  const t0=AC.currentTime;
  const len=Math.max(1,Math.floor(AC.sampleRate*dur));
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
  const src=AC.createBufferSource();src.buffer=buf;
  const f=AC.createBiquadFilter();f.type='bandpass';
  f.frequency.setValueAtTime(filterFreq,t0);
  if(slideTo)f.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  f.Q.value=1.2;
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.03);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  src.connect(f).connect(g).connect(AC.destination);
  src.start(t0);src.stop(t0+dur+0.02);
}
